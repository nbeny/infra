---
# Deploie le stack UrbanLink (kube/urbanlink/) sur le cluster de la VM cible.
#
# Prerequis :
#   1. Le cluster existe, avec sa StorageClass et Traefik/CrowdSec
#      -> ansible-playbook playbooks/20-debian-k8s.yml -l urbanlink
#   2. Les trois images applicatives sont construites
#      -> ansible-playbook playbooks/30-urbanlink-images.yml
#
#   ansible-playbook playbooks/31-urbanlink-deploy.yml
#   ansible-playbook playbooks/31-urbanlink-deploy.yml -e urbanlink_wipe=true   # repart de zero

- name: Deployer le stack UrbanLink
  hosts: urbanlink
  gather_facts: true
  become: true

  vars:
    urbanlink_manifests_src: "{{ playbook_dir }}/../../kube/urbanlink"
    urbanlink_manifests_dest: /opt/urbanlink-kube
    urbanlink_namespace: urbanconnect
    urbanlink_kubeconfig: /etc/kubernetes/admin.conf
    urbanlink_wipe: false
    # Passerelle Istio : le Secret TLS doit vivre aupres de ses pods.
    urbanlink_gateway_namespace: istio-ingress
    urbanlink_tls_secret: uc-tls-cert
    urbanlink_domain: urbanlink.fr

    # -----------------------------------------------------------------------
    #  Configuration -- elle vient du DEPOT APPLICATIF, plus de celui-ci
    # -----------------------------------------------------------------------
    # `config/` vit dans UrbanConnct, a cote du docker-compose.yml qui monte
    # les memes fichiers en developpement. C'est ce qui garantit qu'un reglage
    # ne peut pas diverger entre les deux environnements : il n'existe qu'une
    # fois. Ce depot-ci n'en garde AUCUNE copie -- kube/urbanlink/config/ a ete
    # supprime le 2026-08-30.
    #
    # Le repertoire arrive sur le noeud de controle par le meme tar que les
    # sources applicatives (voir l'en-tete de 30-urbanlink-images.yml, qui
    # emporte desormais `config` en plus de `backTs` et `front`).
    #
    # ⚠️ 30 et 31 restent INDEPENDANTS : 31 ne suppose pas que les images ont
    # ete construites, il ne partage que le repertoire depose. Si le tar est
    # absent, la tache de verification ci-dessous s'arrete en le disant plutot
    # que de creer des ConfigMaps vides -- ce qui laisserait Kratos en
    # CrashLoopBackOff sans expliquer pourquoi.
    urbanlink_config_control: /root/urbanlink-src/config
    urbanlink_config_dest: /opt/urbanlink-config

    # Environnement de configuration : `prod` ou `dev`.
    #   config/common/  -- ce qui ne depend pas de l'environnement
    #   config/prod/    -- URLs en urbanlink.fr, pools elargis, Europe entiere
    #   config/dev/     -- URLs en localhost, pour un poste de developpement
    # Les deux fournissent les MEMES NOMS DE FICHIERS : seul leur contenu
    # change. Le deploiement n'a donc pas a savoir ou il tourne.
    # Carte complete : config/README.md du depot applicatif.
    urbanlink_env: prod

  tasks:

    - name: Verifier que le cluster repond
      ansible.builtin.command: "kubectl --kubeconfig {{ urbanlink_kubeconfig }} get --raw /healthz"
      register: ul_health
      changed_when: false
      failed_when: ul_health.stdout != 'ok'

    - name: Verifier qu'une StorageClass par defaut existe
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} get storageclass
          -o jsonpath='{range .items[*]}{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}{"\n"}{end}'
          | grep -c true
        executable: /bin/bash
      register: ul_sc
      changed_when: false
      failed_when: ul_sc.stdout | int < 1

    # Sans les CRD Istio, `kubectl apply -k` echoue en bloc sur le Gateway et
    # les VirtualService.
    - name: Verifier que les CRD Istio sont presentes
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} get crd -o name
          | grep -cE 'gateways.networking.istio.io|virtualservices.networking.istio.io|authorizationpolicies.security.istio.io'
        executable: /bin/bash
      register: ul_crd
      changed_when: false
      failed_when: ul_crd.stdout | int < 3

    - name: Verifier que la passerelle Istio est deployee
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_gateway_namespace }}
        get deploy istio-ingressgateway
      register: ul_gw
      changed_when: false
      failed_when: ul_gw.rc != 0

    - name: Supprimer le namespace existant
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }}
        delete namespace {{ urbanlink_namespace }} --ignore-not-found --wait=true --timeout=300s
      when: urbanlink_wipe | bool
      changed_when: true

    # rsync tourne en tant que ansible_user (cf. become: false ci-dessous) :
    # le repertoire doit exister et lui appartenir, sinon mkdir echoue dans /opt.
    - name: Creer le repertoire des manifests
      ansible.builtin.file:
        path: "{{ urbanlink_manifests_dest }}"
        state: directory
        owner: "{{ lab_admin_user }}"
        group: "{{ lab_admin_user }}"
        mode: "0755"

    - name: Transferer les manifests sur la VM
      become: false
      ansible.posix.synchronize:
        src: "{{ urbanlink_manifests_src }}/"
        dest: "{{ urbanlink_manifests_dest }}/"
        delete: true

    # ---------------------------------------------------------------------
    #  Configuration applicative
    # ---------------------------------------------------------------------
    - name: Verifier que la configuration applicative est sur le noeud de controle
      ansible.builtin.stat:
        path: "{{ urbanlink_config_control }}/{{ item }}"
      register: ul_config_check
      delegate_to: localhost
      become: false
      loop: [common, "{{ urbanlink_env }}"]

    # Sans ce garde-fou, un tar oublie donnerait des ConfigMaps VIDES : Kratos
    # demarrerait sans configuration et repartirait en CrashLoopBackOff, sans
    # que rien ne relie la panne au fichier manquant.
    - name: Exiger la configuration applicative
      ansible.builtin.assert:
        that: ul_config_check.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          {{ urbanlink_config_control }} ne contient pas common/ et
          {{ urbanlink_env }}/. Cette configuration vit dans le depot
          UrbanConnct (repertoire config/), pas dans celui-ci. La deposer
          depuis Windows :
            cd C:/Users/nbeny/Documents/GitHub/UrbanConnct
            tar -czf - --exclude=node_modules --exclude=.next --exclude=dist
                       --exclude=.git --exclude=coverage backTs front config
              | ssh root@192.168.100.50 'mkdir -p /root/urbanlink-src
                                         && tar -xzf - -C /root/urbanlink-src'

    - name: Creer le repertoire de configuration sur la VM
      ansible.builtin.file:
        path: "{{ urbanlink_config_dest }}"
        state: directory
        owner: "{{ lab_admin_user }}"
        group: "{{ lab_admin_user }}"
        mode: "0755"

    # `delete: true` : un fichier retire du depot applicatif doit disparaitre
    # de la VM, sinon il resterait dans la ConfigMap au passage suivant --
    # `create configmap --from-file=<repertoire>` prend TOUT ce qu'il trouve.
    - name: Transferer la configuration applicative sur la VM
      become: false
      ansible.posix.synchronize:
        src: "{{ urbanlink_config_control }}/"
        dest: "{{ urbanlink_config_dest }}/"
        delete: true

    # ⚠️ **Retirer les retours chariot, sinon chaque VALEUR en herite.**
    # Le depot applicatif n'a pas de .gitattributes et ces fichiers sont
    # commites en CRLF (mesure : 41 lignes du blob de pgbouncer.env en
    # portent). Sur un fichier YAML ou SQL c'est sans consequence ; sur un
    # fichier d'environnement lu par `--from-env-file`, c'est fatal :
    # `DB_HOST=postgres\r` fait chercher un hote nomme « postgres\r », et le
    # message d'erreur ne montre pas le caractere fautif.
    - name: Normaliser les fins de ligne de la configuration
      ansible.builtin.command: >-
        find {{ urbanlink_config_dest }} -type f -exec sed -i 's/\r$//' {} +
      changed_when: true

    - name: Creer le namespace
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }}
        apply -f {{ urbanlink_manifests_dest }}/namespace.yaml
      changed_when: true

    # `create ... --dry-run=client | apply -f -` rend l'operation idempotente :
    # `kubectl create configmap` seul echouerait au deuxieme passage.
    - name: Creer les ConfigMaps prerequises
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_namespace }}
          create configmap {{ item.name }} {{ item.src }}
          --dry-run=client -o yaml
          | kubectl --kubeconfig {{ urbanlink_kubeconfig }} apply -f -
        executable: /bin/bash
      loop:
        # Chaque ConfigMap est construite depuis DEUX repertoires : `kubectl
        # create configmap` accepte plusieurs --from-file et fusionne, la ou
        # kustomize ne sait pas le faire. Cela evite de recopier dans chaque
        # environnement ce qui n'y varie pas -- une copie qui divergerait.
        #
        # ⚠️ La fusion se fait par NOM DE FICHIER : deux homonymes dans common/
        # et <env>/ se marcheraient dessus, le dernier gagnant en silence. Le
        # decoupage est pense pour qu'il n'y en ait aucun -- voir
        # config/README.md du depot applicatif avant d'ajouter un fichier.
        - name: kratos-config
          src: >-
            --from-file={{ urbanlink_config_dest }}/common/kratos/
            --from-file={{ urbanlink_config_dest }}/{{ urbanlink_env }}/kratos/
        - name: postgres-init
          src: "--from-file={{ urbanlink_config_dest }}/common/postgres-init/"
        # ⚠️ **`--from-env-file` et NON `--from-file` pour ces deux-la.**
        # Les deux sont consommees par `envFrom: configMapRef:`, qui attend une
        # ConfigMap dont CHAQUE CLE est une variable. `--from-file` produit au
        # contraire UNE seule cle, nommee comme le fichier, contenant tout son
        # texte : `envFrom` tente alors de creer une variable nommee
        # « pgbouncer.env » — un nom invalide — et aucune des vraies variables
        # n'est posee.
        #
        # Mesure sur la VM `urbanlink` : le pod refusait de demarrer sur
        # « /entrypoint.sh: line 68: DB_HOST: Setup pgbouncer config error!
        # You must set DB_HOST env », alors que `DB_HOST=postgres` figure bien
        # dans le fichier. Le message accuse une variable absente, la cause est
        # la FORME de la ConfigMap.
        #
        # Les identifiants restent dans le Secret : pgbouncer/deployment.yaml
        # pose DB_NAME/DB_USER/DB_PASSWORD en `env:`, qui prime sur `envFrom:`.
        - name: pgbouncer-config
          src: "--from-env-file={{ urbanlink_config_dest }}/{{ urbanlink_env }}/pgbouncer/pgbouncer.env"
        # ⚠️ **Le fichier d'environnement SEUL**, pas le repertoire `common/`.
        # Celui-ci contient `fetch-pbf.sh`, un SCRIPT : melange a un `envFrom`,
        # il produirait une variable nommee « fetch-pbf.sh » et ferait echouer
        # le pod avec `InvalidVariableNames`. Le script n'est monte nulle part
        # aujourd'hui — l'import OSM n'est pas cable sur ce cluster. Le jour ou
        # il le sera, il lui faudra sa PROPRE ConfigMap et un `volumeMounts`,
        # pas une place dans celle-ci.
        - name: nominatim-config
          src: "--from-env-file={{ urbanlink_config_dest }}/{{ urbanlink_env }}/nominatim/nominatim.env"
        # ⚠️ `observability-config` n'est PAS construite ici, volontairement :
        # aucun workload de ce depot ne la monterait. La pile LGTM (collecteur
        # OTLP, Tempo, Loki, Prometheus applicatif, Grafana) n'est pas encore
        # deployee sur le cluster -- seule sa configuration existe, dans
        # config/{common,prod}/observability/ du depot applicatif. Creer la
        # ConfigMap malgre tout donnerait un objet que personne ne lit, et
        # laisserait croire que la pile tourne.
        # Pour l'activer : ajouter les manifests, puis
        #   - name: observability-config
        #     src: >-
        #       --from-file={{ urbanlink_config_dest }}/common/observability/
        #       --from-file={{ urbanlink_config_dest }}/{{ urbanlink_env }}/observability/
      loop_control:
        label: "{{ item.name }} ({{ urbanlink_env }})"
      changed_when: true

    # ---------------------------------------------------------------------
    #  Secret applicatif
    # ---------------------------------------------------------------------
    # Il n'y a plus de manifest secrets.yaml : le Secret est construit ici,
    # depuis un fichier d'environnement non versionne. L'ancien manifest ne
    # contenait que des CHANGE_ME -- c'est ce qui empechait kratos, backend,
    # minio et kafka de demarrer.
    #
    # La source de verite est GitHub Secrets. secrets.env en est la copie
    # locale, la seule lisible : l'API GitHub ne permet pas de RELIRE un
    # secret, seulement de l'ecrire.
    #
    #   scripts/secrets/bootstrap.sh     genere les valeurs aleatoires
    #   scripts/secrets/github-sync.sh   les pousse dans GitHub Secrets

    - name: Verifier que le fichier de secrets est present
      ansible.builtin.stat:
        path: "{{ urbanlink_manifests_dest }}/secrets.env"
      register: ul_secrets

    - name: Exiger le fichier de secrets
      ansible.builtin.assert:
        that: ul_secrets.stat.exists
        fail_msg: >-
          {{ urbanlink_manifests_dest }}/secrets.env est absent. Le creer
          depuis kube/urbanlink/secrets.env.example, ou lancer
          scripts/secrets/bootstrap.sh puis repousser le depot sur le noeud.

    # Refuser explicitement les placeholders : sans ce garde-fou, le Secret
    # serait cree avec des CHANGE_ME et les pods repartiraient en
    # CrashLoopBackOff sans que rien ne le signale.
    - name: Refuser les placeholders restants
      ansible.builtin.shell:
        cmd: "grep -cE '=.*CHANGE_ME' {{ urbanlink_manifests_dest }}/secrets.env || true"
        executable: /bin/bash
      register: ul_placeholders
      changed_when: false

    - name: Echouer si des placeholders subsistent
      ansible.builtin.assert:
        that: ul_placeholders.stdout | trim | int == 0
        fail_msg: >-
          secrets.env contient encore {{ ul_placeholders.stdout | trim }}
          valeur(s) CHANGE_ME. Lancer scripts/secrets/bootstrap.sh.

    # ---------------------------------------------------------------------
    #  Connexion Google : le bloc `providers` ENTIER, ou rien
    # ---------------------------------------------------------------------
    # ⚠️ **Kratos ne mappe NI `GOOGLE_CLIENT_ID` NI `GOOGLE_CLIENT_SECRET`.**
    # Il ne lit une variable d'environnement que si son nom decrit un CHEMIN de
    # configuration ; ces deux-la n'en decrivent aucun, il les ignore purement
    # et simplement. Le YAML garde donc ses placeholders et Google refuse la
    # connexion — mesure sur le cluster : le pod voyait bien les deux variables,
    # et sa configuration montee annoncait toujours
    # `client_id: CHANGE_ME.apps.googleusercontent.com`. L'ecran affiche
    # « Impossible d'initier la connexion Google ».
    #
    # Le seul override qui fonctionne est le bloc `providers` ENTIER, en JSON
    # **BRUT** (jamais base64 : Kratos ne le decode pas, `providers` tombe a
    # null et il refuse de demarrer), via
    # `SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS`. C'est deja ce que fait le
    # developpement — cf. `config/common/kratos/scripts/gen-google-oidc-env.mjs`
    # du depot applicatif, dont l'en-tete enonce la meme regle.
    #
    # ⚠️ **La FORME du bloc n'est pas recopiee ici, elle est LUE.** Elle vit
    # dans `config/{{ urbanlink_env }}/kratos/kratos.yml`, et l'y relire evite
    # une troisieme copie qui divergerait en silence (le generateur de dev en
    # est deja une, et son en-tete le signale). On ne substitue que les deux
    # identifiants.
    - name: Lire les identifiants Google depuis secrets.env
      ansible.builtin.shell:
        cmd: |
          sed -n 's/^GOOGLE_CLIENT_ID=//p'     {{ urbanlink_manifests_dest }}/secrets.env | head -1
          sed -n 's/^GOOGLE_CLIENT_SECRET=//p' {{ urbanlink_manifests_dest }}/secrets.env | head -1
        executable: /bin/bash
      register: ul_google
      changed_when: false
      no_log: true

    - name: Relever la presence des identifiants Google
      ansible.builtin.set_fact:
        ul_google_ok: "{{ (ul_google.stdout_lines | length) >= 2
                          and (ul_google.stdout_lines[0] | trim | length) > 0
                          and (ul_google.stdout_lines[1] | trim | length) > 0 }}"

    - name: Avertir que la connexion Google restera fermee
      ansible.builtin.debug:
        msg: >-
          GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET sont vides dans secrets.env :
          le bloc `providers` ne sera pas injecte et Kratos gardera ses
          placeholders. Tout le reste fonctionne — seule la connexion Google
          repondra « Impossible d'initier la connexion ». URI de redirection a
          declarer cote Google : https://auth.{{ urbanlink_domain }}/self-service/methods/oidc/callback/google
      when: not ul_google_ok

    - name: Lire la configuration Kratos de l'environnement
      ansible.builtin.slurp:
        src: "{{ urbanlink_config_dest }}/{{ urbanlink_env }}/kratos/kratos.yml"
      register: ul_kratos_yml
      when: ul_google_ok

    # `map('combine', …)` remplace les deux cles dans CHAQUE provider declare :
    # il n'y a que Google aujourd'hui, et un second fournisseur voudrait de
    # toute facon ses propres identifiants — le jour venu, cette tache devra
    # apparier par `id` plutot que d'appliquer la meme paire a tous.
    - name: Construire le bloc providers avec les vrais identifiants
      ansible.builtin.set_fact:
        ul_oidc_providers: >-
          {{ (ul_kratos_yml.content | b64decode | from_yaml).selfservice.methods.oidc.config.providers
             | map('combine', {'client_id': ul_google.stdout_lines[0] | trim,
                               'client_secret': ul_google.stdout_lines[1] | trim})
             | list | to_json }}
      when: ul_google_ok
      no_log: true

    # ⚠️ **`--from-env-file` ne se combine NI avec `--from-file` NI avec
    # `--from-literal`** : kubectl refuse net (« from-env-file cannot be
    # combined with from-file or from-literal »). Le bloc `providers` ne peut
    # donc pas etre ajoute a cote du fichier d'environnement — il faut qu'il
    # soit DEDANS. On assemble donc une copie temporaire.
    #
    # Le JSON tient sur une seule ligne (`JSON.stringify`), ce qu'un fichier
    # d'environnement exige : une valeur ne peut pas y courir sur deux lignes.
    - name: Assembler le fichier d'environnement du Secret
      ansible.builtin.copy:
        src: "{{ urbanlink_manifests_dest }}/secrets.env"
        dest: /tmp/urbanconnect-secrets.env
        remote_src: true
        mode: "0600"
      changed_when: true

    - name: Y ajouter le bloc providers Kratos
      ansible.builtin.lineinfile:
        path: /tmp/urbanconnect-secrets.env
        regexp: '^KRATOS_OIDC_PROVIDERS='
        line: "KRATOS_OIDC_PROVIDERS={{ ul_oidc_providers }}"
        state: present
      when: ul_google_ok
      no_log: true

    - name: Creer le Secret applicatif
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_namespace }}
          create secret generic urbanconnect-secrets
          --from-env-file=/tmp/urbanconnect-secrets.env
          --dry-run=client -o yaml
          | kubectl --kubeconfig {{ urbanlink_kubeconfig }} apply -f -
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Retirer le fichier d'environnement assemble
      ansible.builtin.file:
        path: /tmp/urbanconnect-secrets.env
        state: absent

    # ---------------------------------------------------------------------
    #  TLS de la passerelle
    # ---------------------------------------------------------------------
    # Traefik obtenait ses certificats seul via ACME. Istio ne fait pas d'ACME :
    # il lit un Secret. Sans DNS public pointant ici, Let's Encrypt ne peut pas
    # valider -- on depose donc un certificat auto-signe, suffisant pour valider
    # le routage. En production, c'est cert-manager qui remplit ce Secret.
    - name: Verifier si le certificat de la passerelle existe
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_gateway_namespace }}
        get secret {{ urbanlink_tls_secret }}
      register: ul_tls
      changed_when: false
      failed_when: false

    - name: Generer un certificat auto-signe pour la passerelle
      when: ul_tls.rc != 0
      block:

        - name: Produire la cle et le certificat
          ansible.builtin.command: >-
            openssl req -x509 -newkey rsa:2048 -nodes -days 825
              -keyout /tmp/uc-tls.key -out /tmp/uc-tls.crt
              -subj "/CN=*.{{ urbanlink_domain }}/O=lab"
              -addext "subjectAltName=DNS:{{ urbanlink_domain }},DNS:*.{{ urbanlink_domain }}"
          changed_when: true

        - name: Deposer le certificat dans le namespace de la passerelle
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_gateway_namespace }}
            create secret tls {{ urbanlink_tls_secret }}
            --cert=/tmp/uc-tls.crt --key=/tmp/uc-tls.key
          changed_when: true

        - name: Retirer les fichiers temporaires
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: [/tmp/uc-tls.key, /tmp/uc-tls.crt]

    - name: Appliquer le kustomize
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }}
        apply -k {{ urbanlink_manifests_dest }}
      register: ul_apply
      changed_when: true

    # Hors kustomize : elle doit rester dans istio-ingress, alors que le
    # kustomization force `namespace: urbanconnect` sur tout ce qu'il liste.
    - name: Appliquer la politique d'autorisation de la passerelle
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ urbanlink_kubeconfig }}
        apply -f {{ urbanlink_manifests_dest }}/ingress/authorization.yaml
      register: ul_authz
      changed_when: "'created' in ul_authz.stdout or 'configured' in ul_authz.stdout"

    - name: Resultat de l'application
      ansible.builtin.debug:
        msg: "{{ ul_apply.stdout_lines | length }} objets crees ou mis a jour"

    # Les dependances entre composants font que plusieurs pods bouclent en
    # CrashLoopBackOff pendant quelques minutes avant que leurs bases soient
    # pretes : c'est attendu, on laisse converger avant de compter.
    - name: Laisser le stack converger
      ansible.builtin.pause:
        seconds: "{{ urbanlink_settle_seconds | default(180) }}"

    - name: Relever l'etat des pods
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_namespace }}
          get pods --no-headers 2>/dev/null | awk '{print $3}' | sort | uniq -c | sort -rn
        executable: /bin/bash
      register: ul_status
      changed_when: false

    - name: Relever les PVC
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ urbanlink_kubeconfig }} -n {{ urbanlink_namespace }}
          get pvc --no-headers 2>/dev/null | awk '{print $2}' | sort | uniq -c
        executable: /bin/bash
      register: ul_pvc
      changed_when: false

    - name: Etat du deploiement
      ansible.builtin.debug:
        msg:
          - "--- pods par etat ---"
          - "{{ ul_status.stdout_lines }}"
          - "--- PVC par etat ---"
          - "{{ ul_pvc.stdout_lines }}"
          - ""
          - "Suivi :  kubectl -n {{ urbanlink_namespace }} get pods -w"
          - "Detail d'un pod :  kubectl -n {{ urbanlink_namespace }} describe pod <nom>"
