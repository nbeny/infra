---
# ============================================================================
#  Variables globales du lab
# ============================================================================

# --- Identite du noeud Proxmox -------------------------------------------
pve_node: pve
pve_lan_ip: 192.168.100.50
pve_lan_bridge: vmbr0
pve_lan_gateway: 192.168.100.1

# --- Reseau interne des VMs (NAT derriere le noeud Proxmox) ---------------
lab_bridge: vmbr1
lab_subnet: 10.0.0.0/24
lab_netmask_bits: 24
lab_gateway: 10.0.0.1

# Le resolveur du noeud est Tailscale (100.100.100.100) et n'est PAS joignable
# depuis 10.0.0.0/24. Les VMs utilisent donc des resolveurs publics.
lab_dns_servers:
  - 1.1.1.1
  - 9.9.9.9
lab_search_domain: lab.nbeny.fr

# --- Messagerie -----------------------------------------------------------
# Prefixe du reseau Docker de Mailcow. SOURCE UNIQUE, volontairement ici et pas
# dans l'un des deux roles : `mailcow` le pose dans mailcow.conf, et
# `mail_tunnel` route exactement ce prefixe par le tunnel vers le VPS.
#
# Les laisser diverger couperait l'emission SANS message d'erreur : les
# conteneurs sortiraient par la passerelle du lab, donc depuis l'IP de la
# maison, qui est en Spamhaus PBL. Le seul symptome serait une file d'attente
# qui gonfle et des rejets chez les destinataires.
mail_docker_net_prefix: "172.22.1"

# --- Stockage -------------------------------------------------------------
# pool1 : raidz1 de 3 disques, ~4,4 To libres -> cible des VMs et des templates
# ⚠️ pool2 : UN SEUL disque, sans redondance. Devenu inimportable apres la
# coupure de courant du 2026-10-04 (`can't open objset ..., error 5`), il a
# emporte urbanlink, mail, ci-runner et les templates 9000/9100. DETRUIT le
# 2026-10-09 (`zpool destroy`, entrees pool2 / pool2-backup retirees de
# storage.cfg) apres sauvetage sur pool1 des disques de 120/190 et des
# templates 9001/9100/9101. Le disque physique (sde, Hitachi 3 To) est mort.
pve_vm_storage: pool1
pve_template_storage: pool1
pve_iso_storage: local

# --- Compte administrateur cree sur toutes les VMs ------------------------
lab_admin_user: nbeny
lab_admin_shell: /bin/bash

# Cles publiques autorisees sur le compte admin de chaque VM.
# Ce sont des cles PUBLIQUES : les versionner est normal et rend le repo
# auto-suffisant (indispensable pour recreer le lab depuis zero).
lab_ssh_public_keys:
  # Poste Windows principal -- utilise pour l'acces ProxyJump
  - "ssh-rsa  nbeny@PC-Alesio"
  # Noeud Proxmox (root@pve) -- indispensable : c'est le noeud de controle Ansible
  - "ssh-rsa  root@pve"
  - "ssh-rsa  root@pve"
  # Poste secondaire
  - "ssh-rsa  nbeny@student.42.fr"
  # ⚠️ **LA SEULE CLE DU NOEUD DONT LA PRIVEE EXISTE ENCORE.**
  # Les deux entrees `root@pve` ci-dessus sont RSA, et /root/.ssh du noeud ne
  # contient plus qu'une paire ed25519 : leur cle privee a disparu. Les hotes
  # qui n'autorisaient qu'elles etaient donc INJOIGNABLES depuis le noeud de
  # controle, alors que l'inventaire affirmait le contraire.
  #
  # Mesure le 2026-09-01 sur `ci-runner` : tout `ansible-playbook` lance depuis
  # le noeud echouait en `UNREACHABLE / Permission denied (publickey)`, sans
  # rapport avec le playbook joue. La declarer ici la repose sur chaque hote
  # ou le role `common` passe.
  #
  # ⚠️ Cela ne suffit PAS a amorcer un hote neuf : y poser cette cle exige de
  # l'atteindre, ce que seul le rebond depuis le poste
  # (`ssh -J root@192.168.100.50 debian@10.0.0.x`) permet. Sur les VMs creees
  # par Terraform, cloud-init s'en charge ; sur une VM montee a la main, c'est
  # un geste manuel a faire une fois. Voir l'en-tete de playbooks/35-ci-registry.yml.
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJtDIzD15+UwiHK6YYUAoWKUdUtL7RvAUkpaNMKJNK0P pve-root@urbanlink-ops"

# --- Divers ---------------------------------------------------------------
lab_timezone: Europe/Paris
lab_locale: en_US.UTF-8
