---
# ============================================================================
#  Correctifs de l'audit -- docs/audit-securite.md
# ============================================================================
# TOUT est desactive par defaut. Le noeud heberge de la production : chaque
# correctif s'active explicitement, apres lecture.
#
#   ansible-playbook playbooks/95-hardening.yml -e pve_hardening_backup=true
#   ansible-playbook playbooks/95-hardening.yml -e pve_hardening_all=true

pve_hardening_all: false

# --- Constat 1 : aucune sauvegarde (CRITIQUE) ------------------------------
pve_hardening_backup: false
# pool1 : pool2-backup vivait sur le meme disque unique que les VMs qu'il
# protegeait, et ce disque a ete perdu le 2026-10-04.
pve_hardening_backup_storage: pool1-backup
pve_hardening_backup_schedule: "04:30"
# VM 100 n'a JAMAIS ete sauvegardee : c'est elle qui compte en premier.
# "all" est possible, mais lire l'avertissement de volumetrie dans le role.
# ⚠️ Etait "100" -- une VM qui N'EXISTE PLUS sur ce noeud. Un job pointant sur
# un VMID absent echoue silencieusement chaque nuit : on croit sauvegarder.
#
# 140 est la VM de messagerie, et c'est aujourd'hui la seule dont la perte
# serait irrattrapable : elle porte du courrier, c'est-a-dire des donnees que
# rien d'autre ne reconstruit -- contrairement au cluster, qui se redeploie
# depuis ce depot.
#
# Le mode `snapshot` s'appuie sur qemu-guest-agent pour geler le systeme de
# fichiers le temps de l'instantane. Sans agent, la sauvegarde reste coherente
# au niveau bloc mais pas au niveau applicatif -- d'ou l'insistance a l'activer
# sur cette VM.
# 130 (ci-runner) ajoutee apres la perte de pool2 le 2026-10-04 : elle n'avait
# aucune sauvegarde, runners et registre ont du etre remontes a la main.
# ⚠️ La tache ne cree le job que s'il n'existe pas : sur un noeud ou il existe
# deja, appliquer avec `pvesh set /cluster/backup/<id> --vmid 140,130`.
pve_hardening_backup_vmids: "140,130"
pve_hardening_backup_mode: snapshot
pve_hardening_backup_compress: zstd
# Retention volontairement courte : un vzdump est une image COMPLETE a chaque
# fois, sans deduplication. Deux copies de la VM 100 remplissent deja ~1,2 To.
pve_hardening_backup_retention: "keep-last=3,keep-weekly=2,keep-monthly=1"
# Marge libre exigee sur le stockage avant de creer le job, en Gio.
# 800 Gio se justifiaient pour la VM 100 et son disque d'un tera. La VM de
# messagerie fait 150 Gio, dont 6 utilises.
pve_hardening_backup_min_free_gb: 200

# --- Constat 2 : origine joignable en direct (CRITIQUE) --------------------
# Restreint 80/443 aux plages Cloudflare. N'active QUE si tous tes domaines
# sont proxifies : sinon les sites deviennent injoignables.
pve_hardening_cloudflare_only: false

# --- Constat 4 : pare-feu Proxmox jamais active ----------------------------
# SENSIBLE : une erreur coupe l'acces au noeud. Le role garde SSH et 8006
# ouverts depuis le LAN, et sauvegarde la configuration avant ecriture.
pve_hardening_firewall: false
pve_hardening_firewall_mgmt_cidr: "192.168.100.0/24"

# --- Constat 5 : SSH root par mot de passe ---------------------------------
# Les 4 cles publiques de lab_ssh_public_keys sont deja dans authorized_keys :
# couper les mots de passe ne coupe pas ton acces.
pve_hardening_ssh: false

# --- Constat 5 bis : CrowdSec ne parse ni auth.log ni pveproxy -------------
# La bascule fait trois choses : rebrancher les items du hub restes lies a
# l'ancien /var/lib/crowdsec/hub (c'est la cause de la panne SSH), installer
# les collections ci-dessous, et reprendre /etc/crowdsec/acquis.yaml en
# gestion. Ce dernier point ECRASE un fichier ecrit a la main -- une copie
# horodatee est laissee a cote.
pve_hardening_crowdsec_acquis: false

# fulljackz/proxmox est la piece qui manquait : c'est elle qui lit les echecs
# d'authentification de pvedaemon dans syslog. Sans elle, un bruteforce de
# l'interface 8006 ne declenche rien.
pve_hardening_crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/nginx
  - crowdsecurity/apache2
  - crowdsecurity/base-http-scenarios
  - crowdsecurity/http-cve
  - crowdsecurity/iptables
  - fulljackz/proxmox

# openresty sert, mais il inclut les vhosts de /etc/nginx : les deux
# arborescences de logs sont vivantes, il faut les deux.
pve_hardening_crowdsec_nginx_files:
  - /usr/local/openresty/nginx/logs/*.log
  - /var/log/nginx/*.log

# --- Detection des echecs de login applicatif (Ory Kratos) -----------------
# Aucun parseur du hub ne pose `sub_type: auth_fail` sur ce noeud, ce qui rend
# `crowdsecurity/http-generic-bf` structurellement inerte. Les deux fichiers
# maison ci-dessous le reveillent et ajoutent un seuil lent. Detail et mesures
# en tete des templates kratos-logs.yaml.j2 et kratos-bf.yaml.j2.
pve_hardening_crowdsec_kratos: true

# Mesure : un echec d'identifiants rend 400, un succes 303. Un CSRF invalide
# rend 403 et un flow expire 410 -- ni l'un ni l'autre n'est un echec de
# credentials, et aucun des deux ne doit compter.
pve_hardening_crowdsec_kratos_status: "400"

# Le prefixe optionnel couvre le second chemin d'acces a Kratos, proxifie par
# le frontend : urbanlink.fr/api/kratos/self-service/login.
#
# Le point d'interrogation litteral s'ecrit `[?]` et NON `\?` : expr traite les
# chaines entre apostrophes comme du Go, ou `\?` n'est pas une echappement
# valide. CrowdSec refuse alors de demarrer, pas seulement de charger la regle
#   FATAL crowdsec init: while loading parsers: ... invalid char escape
# La classe de caracteres dit la meme chose sans echappement du tout.
pve_hardening_crowdsec_kratos_path_re: '^(/api/kratos)?/self-service/login/?([?]|$)'

# ~10 echecs en ~50 min. Volontairement tolerant : une IP bannie perd l'acces
# a TOUS les vhosts du noeud, le bouncer openresty repondant avant le cluster.
pve_hardening_crowdsec_kratos_capacity: 10
pve_hardening_crowdsec_kratos_leakspeed: "5m"

# Lignes de reference passees a `cscli explain` en fin de role. Une chaine de
# parsing qui echoue sur l'une d'elles fait echouer le play : c'est le seul
# moyen de constater que la detection marche sans attendre un vrai attaquant.
# `expect` va plus loin que « ca parse » : il exige que l'evenement atteigne
# bien le scenario cense l'attraper.
pve_hardening_crowdsec_probes_base:
  - name: "SSH (OpenSSH >= 9.8, programme sshd-session)"
    type: syslog
    log: "2026-01-01T00:00:00.000000+01:00 pve sshd-session[1]: Invalid user admin from 203.0.113.1 port 4242"
    expect: crowdsecurity/ssh-bf
  - name: "Authentification Proxmox (pvedaemon)"
    type: syslog
    log: "2026-01-01T00:00:00.000000+01:00 pve pvedaemon[1]: authentication failure; rhost=203.0.113.1 user=root@pam msg=Authentication failure"
    expect: fulljackz/proxmox-bf

# Les deux chemins d'acces a Kratos sont sondes separement : ils passent par
# des vhosts differents et le second porte le prefixe du frontend. Le second
# vise http-generic-bf, ce qui verifie du meme coup que `sub_type: auth_fail`
# est bien pose -- le scenario du hub qui etait inerte.
pve_hardening_crowdsec_probes_kratos:
  - name: "Echec de login Kratos, chemin direct"
    type: nginx
    log: '203.0.113.1 - - [01/Jan/2026:00:00:00 +0100] "POST /self-service/login?flow=00000000-0000-0000-0000-000000000000 HTTP/1.1" 400 2019 "-" "curl/8.14.1"'
    expect: alesio/kratos-bf
  - name: "Echec de login Kratos, chemin proxifie par le frontend"
    type: nginx
    log: '203.0.113.1 - - [01/Jan/2026:00:00:00 +0100] "POST /api/kratos/self-service/login/?flow=00000000-0000-0000-0000-000000000000 HTTP/1.1" 400 2019 "-" "curl/8.14.1"'
    expect: crowdsecurity/http-generic-bf

pve_hardening_crowdsec_probes: >-
  {{ pve_hardening_crowdsec_probes_base
     + (pve_hardening_crowdsec_probes_kratos
        if pve_hardening_crowdsec_kratos | bool else []) }}

# --- Constats 7 et 9 : services exposes inutilises -------------------------
pve_hardening_disable_unused: false
pve_hardening_disable_services: [iperf3, rpcbind]
# `restrict` = snmpd n'ecoute plus que sur 127.0.0.1 ; `disable` = arrete.
pve_hardening_snmp_action: restrict

# --- Constat 8 : aucun scrub ZFS depuis 6 mois -----------------------------
pve_hardening_zfs_scrub: false
pve_hardening_zfs_scrub_schedule: "Sun *-*-08..14 03:00:00"   # 2e dimanche
pve_hardening_zfs_scrub_max_age_days: 35

# --- Constat 10 : pas de mises a jour automatiques -------------------------
# Securite uniquement : jamais de montee de version PVE automatique.
pve_hardening_unattended: false

# --- Constat 11 : regles ufw obsoletes -------------------------------------
pve_hardening_ufw_cleanup: false
pve_hardening_ufw_drop_rules:
  - "5201"          # iperf3
  - "179/tcp"       # BGP, aucun demon
  - "443/udp"       # QUIC non utilise
  - "8006/udp"      # 8006 est du TCP uniquement
# La redirection 4242 -> SSH de la VM 102 est un choix d'usage, pas une faille :
# elle n'est retiree que sur demande explicite (le ProxyJump la remplace).
pve_hardening_drop_dnat_4242: false

# --- Constat 14 : sysctl ---------------------------------------------------
pve_hardening_sysctl: false
pve_hardening_sysctl_values:
  kernel.kptr_restrict: "1"
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.all.log_martians: "1"
