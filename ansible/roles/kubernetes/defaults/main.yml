---
kubernetes_version: "1.36"
kubernetes_package_version: ""
k8s_install_only: false
k8s_role: control_plane
k8s_single_node: true
# Nom d'inventaire du plan de controle -- requis uniquement pour un worker.
k8s_control_plane_host: ""
k8s_pod_cidr: "10.244.0.0/16"
k8s_service_cidr: "10.96.0.0/12"
k8s_cni: flannel
k8s_apiserver_advertise_address: "{{ ansible_default_ipv4.address }}"
k8s_extra_tools:
  helm: true
  k9s: true
k8s_helm_version: ""      # "" = derniere version stable
k8s_k9s_version: ""       # "" = derniere version stable

# --- Metriques -------------------------------------------------------------
# Requis par tout HorizontalPodAutoscaler et par `kubectl top` : l'API
# `metrics.k8s.io` est agregee, donc inexistante sans ce serveur.
k8s_metrics_server_enabled: true
k8s_metrics_server_namespace: kube-system
k8s_metrics_server_chart_version: "3.14.0"
k8s_metrics_server_resolution: 15s
# Necessaire sous kubeadm, qui n'active pas `serverTLSBootstrap` : voir le
# commentaire du fichier de valeurs.
k8s_metrics_server_insecure_tls: true

# --- Stockage --------------------------------------------------------------
# `none` laisse le cluster sans provisionneur : tout PVC restera en Pending.
k8s_storage_provisioner: local-path
k8s_local_path_version: v0.0.37

# --- Edge : ingress et securite -------------------------------------------
k8s_ingress_controller: traefik      # traefik | none
k8s_ingress_namespace: traefik
k8s_traefik_chart_version: "41.4.0"
k8s_traefik_nodeport_http: 30080
k8s_traefik_nodeport_https: 30443
k8s_traefik_log_level: INFO
k8s_traefik_redirect_https: false

k8s_crowdsec_enabled: true
k8s_crowdsec_namespace: crowdsec
k8s_crowdsec_chart_version: "0.24.0"
k8s_crowdsec_appsec: true
k8s_crowdsec_plugin_version: v1.7.1
k8s_crowdsec_lapi_data_size: 2Gi

# Collections chargees par les agents : scenarios Traefik, HTTP generiques et
# CVE connues.
k8s_crowdsec_collections:
  - crowdsecurity/traefik
  - crowdsecurity/base-http-scenarios
  - crowdsecurity/http-cve

# Regles du WAF AppSec : virtual patching et regles generiques.
k8s_crowdsec_appsec_collections:
  - crowdsecurity/appsec-virtual-patching
  - crowdsecurity/appsec-generic-rules

# Profil AppSec applique au listener (doit exister dans les collections above).
k8s_crowdsec_appsec_config: crowdsecurity/virtual-patching

# --- Service mesh ----------------------------------------------------------
# `none` par defaut : Istio est utile sur un cluster qui porte des charges
# reelles, pas sur un cluster de test. Activer par host_vars.
k8s_service_mesh: none               # istio | none
k8s_istio_version: "1.30.4"
k8s_istio_namespace: istio-system

# `ambient` (sans sidecar) ou `default` (avec sidecar).
# Ambient est le bon choix des qu'il y a des Jobs ou des pods hostNetwork :
# un sidecar empeche un Job de se terminer, et ne capture rien en hostNetwork.
k8s_istio_mode: ambient

# Namespaces enroles dans le maillage. Traefik en est volontairement absent :
# il reste la porte d'entree, hors mesh, et joint les services via la
# politique PERMISSIVE.
k8s_istio_namespaces:
  - urbanconnect

# Prometheus + Kiali : le graphe de service et les metriques du mesh.
k8s_istio_observability: true

# --- Observabilite applicative ---------------------------------------------
# kube-prometheus-stack (Prometheus + Grafana + Alertmanager). Helm, comme
# istiod/metrics-server -- PAS par Argo (chart non-Kustomizable). A cote de
# ce que pose Argo dans `urbanconnect` : OTel/Tempo/Loki + PrometheusRule
# (kube/urbanlink/observability/). Le Prometheus du MESH (k8s_istio_*)
# reste celui de Kiali et ne leur est pas melange.
k8s_observability_enabled: true
k8s_observability_namespace: urbanconnect
k8s_kube_prometheus_stack_chart_version: "88.3.0"

# Passerelle d'entree Istio. Quand elle est active, elle REMPLACE Traefik et
# reprend ses NodePort : les deux ne peuvent pas ecouter sur les memes ports.
k8s_istio_gateway: false
k8s_istio_gateway_namespace: istio-ingress
k8s_istio_gateway_nodeport_http: 30080
k8s_istio_gateway_nodeport_https: 30443
# Desinstalle la release Helm de Traefik au profit de la passerelle Istio.
k8s_istio_replaces_traefik: false

# Fournisseurs d'autorisation externe, equivalents du `forwardAuth` Traefik.
# Referencables depuis une AuthorizationPolicy en action CUSTOM.
#
# CrowdSec n'y figure PAS, et c'est un constat, pas un oubli : son bouncer est
# un plugin Go specifique a Traefik. Le portage Envoy officiel
# (crowdsecurity/cs-envoy-bouncer) n'a ni release ni image publiee, et brancher
# l'AppSec en direct est impossible -- `includeAdditionalHeadersInCheck` n'accepte
# que des valeurs FIXES, alors que l'AppSec exige l'URI et l'IP client de chaque
# requete. CrowdSec reste donc a sa place actuelle : le nginx du noeud Proxmox,
# ou il fonctionne et ou le trafic Internet arrive reellement.
k8s_istio_ext_authz:
  - name: oathkeeper
    service: oathkeeper-api.urbanconnect.svc.cluster.local
    port: 4456
    path_prefix: /decisions
    include_headers:
      - authorization
      - cookie
      - x-forwarded-for
      - x-forwarded-proto
      - x-forwarded-host
      - x-request-id
    headers_upstream:
      - x-user-id
      - x-user-email
