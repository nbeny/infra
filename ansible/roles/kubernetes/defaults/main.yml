---
kubernetes_version: "1.36"
kubernetes_package_version: ""
k8s_install_only: false
k8s_role: control_plane
k8s_single_node: true
# Nom d'inventaire du plan de controle -- requis uniquement pour un worker.
k8s_control_plane_host: ""
k8s_pod_cidr: "10.244.0.0/16"
k8s_service_cidr: "10.96.0.0/12"
k8s_cni: flannel
k8s_apiserver_advertise_address: "{{ ansible_default_ipv4.address }}"
k8s_extra_tools:
  helm: true
  k9s: true
k8s_helm_version: ""      # "" = derniere version stable
k8s_k9s_version: ""       # "" = derniere version stable

# --- Stockage --------------------------------------------------------------
# `none` laisse le cluster sans provisionneur : tout PVC restera en Pending.
k8s_storage_provisioner: local-path
k8s_local_path_version: v0.0.37

# --- Edge : ingress et securite -------------------------------------------
k8s_ingress_controller: traefik      # traefik | none
k8s_ingress_namespace: traefik
k8s_traefik_chart_version: "41.4.0"
k8s_traefik_nodeport_http: 30080
k8s_traefik_nodeport_https: 30443
k8s_traefik_log_level: INFO
k8s_traefik_redirect_https: false

k8s_crowdsec_enabled: true
k8s_crowdsec_namespace: crowdsec
k8s_crowdsec_chart_version: "0.24.0"
k8s_crowdsec_appsec: true
k8s_crowdsec_plugin_version: v1.7.1
k8s_crowdsec_lapi_data_size: 2Gi

# Collections chargees par les agents : scenarios Traefik, HTTP generiques et
# CVE connues.
k8s_crowdsec_collections:
  - crowdsecurity/traefik
  - crowdsecurity/base-http-scenarios
  - crowdsecurity/http-cve

# Regles du WAF AppSec : virtual patching et regles generiques.
k8s_crowdsec_appsec_collections:
  - crowdsecurity/appsec-virtual-patching
  - crowdsecurity/appsec-generic-rules

# Profil AppSec applique au listener (doit exister dans les collections above).
k8s_crowdsec_appsec_config: crowdsecurity/virtual-patching
