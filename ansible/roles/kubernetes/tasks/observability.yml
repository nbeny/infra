---
# ---------------------------------------------------------------------------
#  Observabilite applicative -- kube-prometheus-stack
# ---------------------------------------------------------------------------
# Met en place, par Helm (comme istiod/metrics-server), la plateforme
# d'observabilite : Prometheus (avec son operator), Grafana et Alertmanager.
# Elle vit dans `urbanconnect`, a cote de l'observabilite posee par Argo
# (OTel/Tempo/Loki). C'est Argo qui deploie ces trois-la et le PrometheusRule
# (kube/urbanlink/observability/) ; ici on ne pose QUE le chart Helm -- le
# reste est du kustomize, sans Helm.
#
# Ce fichier est volontairement separe d'istio.yml : le Prometheus du MESH
# (addon Istio) reste celui de Kiali. Deux Prometheus distincts, un par role.
#
# ORDRE : ce role doit passer AVANT qu'Argo ne synchronise
# observability/prometheus-alerts.yaml -- c'est le chart qui installe la CRD
# PrometheusRule. Sans lui, Argo echoue sur un `kind` inconnu.
#
# Secrets : lus depuis secrets.env sur le noeud (depose par
# 31-urbanlink-deploy.yml), jamais ecrits ici.

- name: "[obs] Verifier le fichier de secrets"
  ansible.builtin.stat:
    path: "{{ k8s_observability_secrets_env }}"
  register: obs_secrets

- name: "[obs] Exiger le fichier de secrets"
  ansible.builtin.assert:
    that: obs_secrets.stat.exists
    fail_msg: >
      {{ k8s_observability_secrets_env }} est absent. Il est depose par
      playbooks/31-urbanlink-deploy.yml (rsync du depot). Le creer depuis
      kube/urbanlink/secrets.env.example ou lancer scripts/secrets/bootstrap.sh.

# Grafana refuse de demarrer sans compte admin explicite. On reutilise le
# compte HUMAIN commun aux consoles internes plutot que d'en inventer un
# nouveau -- meme couple que Kiali, Temporal, pgAdmin, Argo CD. Voir
# playbooks/34-console-accounts.yml.
# ⚠️ Lecture par `slurp` + `regex_search`, PAS par une boucle `sed` dont on
# lirait `stdout_lines` : une cle absente ne produit aucune ligne, et toutes
# les valeurs suivantes se decalent d'un cran -- le mot de passe SMTP finirait
# dans le nom d'utilisateur. Ici chaque cle est cherchee par son nom, une
# absence rend une chaine vide, et rien ne bouge.
- name: "[obs] Lire le compte console et le SMTP dans secrets.env"
  ansible.builtin.slurp:
    src: "{{ k8s_observability_secrets_env }}"
  register: obs_env_raw
  no_log: true

- name: "[obs] Nommer les valeurs lues"
  ansible.builtin.set_fact:
    console_admin_user: "{{ obs_env | regex_search('^CONSOLE_ADMIN_USER=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
    console_admin_password: "{{ obs_env | regex_search('^CONSOLE_ADMIN_PASSWORD=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
    grafana_smtp_smarthost: "{{ obs_env | regex_search('^GRAFANA_SMTP_SMARTHOST=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
    grafana_smtp_username: "{{ obs_env | regex_search('^GRAFANA_SMTP_USERNAME=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
    grafana_smtp_password: "{{ obs_env | regex_search('^GRAFANA_SMTP_PASSWORD=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
    grafana_pg_password: "{{ obs_env | regex_search('^GRAFANA_PG_PASSWORD=(.*)$', '\\1', multiline=True) | default([], true) | first | default('') | trim }}"
  vars:
    obs_env: "{{ obs_env_raw.content | b64decode }}"
  no_log: true

- name: "[obs] Exiger un compte admin utilisable pour Grafana"
  ansible.builtin.assert:
    that:
      - console_admin_user | length > 0
      - console_admin_password | length >= 8
    fail_msg: >
      CONSOLE_ADMIN_USER / CONSOLE_ADMIN_PASSWORD sont absents ou trop courts
      dans {{ k8s_observability_secrets_env }}. Les generer avec
      scripts/secrets/bootstrap.sh, rejouer
      playbooks/31-urbanlink-deploy.yml, puis relancer ce role.
    success_msg: "Grafana : compte admin {{ console_admin_user }}"

# Alertmanager demarre sans SMTP -- le template n'ecrit alors AUCUN recepteur
# email (un `smarthost` vide l'empecherait de demarrer, cf. le .j2). On le
# signale pour que ce soit un choix, pas un oubli.
- name: "[obs] Avertir si le SMTP d'Alertmanager est vide"
  ansible.builtin.debug:
    msg: >-
      GRAFANA_SMTP_* sont vides : aucune alerte ne partira par courriel.
      Les alertes restent visibles dans Grafana et dans Alertmanager.
      Renseigner dans secrets.env (voir kube/urbanlink/secrets.env.example).
  when: grafana_smtp_smarthost | length == 0

- name: "[obs] Ajouter le depot Helm prometheus-community"
  ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  register: obs_repo
  changed_when: "'has been added' in obs_repo.stdout"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: "[obs] Mettre a jour les depots Helm"
  ansible.builtin.command: helm repo update
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: "[obs] Deposer les valeurs Helm du kube-prometheus-stack"
  ansible.builtin.template:
    src: kube-prometheus-stack-values.yaml.j2
    dest: /root/kube-prometheus-stack-values.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "[obs] Installer le kube-prometheus-stack"
  ansible.builtin.include_tasks: helm_release.yml
  vars:
    hr_name: kube-prometheus-stack
    hr_chart: prometheus-community/kube-prometheus-stack
    hr_namespace: "{{ k8s_observability_namespace }}"
    hr_version: "{{ k8s_kube_prometheus_stack_chart_version }}"
    hr_values: /root/kube-prometheus-stack-values.yaml
    hr_timeout: 15m

# ============================================================================
#  Le role Postgres en LECTURE SEULE de Grafana
# ----------------------------------------------------------------------------
#  POURQUOI UNE SOURCE SQL A COTE DE PROMETHEUS. Prometheus compte des
#  EVENEMENTS : il sait combien d'inscriptions cette heure-ci, pas combien
#  d'inscrits en tout. « La courbe d'inscriptions depuis l'ouverture »,
#  « l'entonnoir », « les annonces par statut » sont des etats cumules que la
#  base porte deja -- les porter en serie temporelle demanderait une jauge
#  remise a jour par un balayage, c'est-a-dire une SECONDE source de verite sur
#  un chiffre existant. Le depot l'interdit.
#
#  ⚠️ NI MIGRATION PRISMA, NI GESTE MANUEL. Une migration Prisma ne peut pas
#  recevoir de variable psql, le mot de passe s'y retrouverait en clair dans le
#  depot, et `migrate dev` est inutilisable sur cette base (derive connue : 12
#  index partiels faits main seraient supprimes). Un geste manuel, lui, ne
#  survit pas a une restauration.
#
#  ⚠️ CE ROLE NE PEUT RIEN ECRIRE, et c'est verifie plus bas par une tentative
#  reelle. Deux protections qui se recouvrent :
#    1. GRANT SELECT seul, jamais INSERT/UPDATE/DELETE ;
#    2. `default_transaction_read_only = on` sur le role -- il survit a un
#       GRANT trop large pose plus tard par distraction.
# ============================================================================
# ⚠️ UNE VARIABLE OUBLIEE DOIT CASSER, VISIBLEMENT.
#
# Sans cette garde, `ALTER ROLE grafana_ro WITH PASSWORD ''` poserait un mot de
# passe VIDE : la source Grafana ne se connecterait pas, le panneau afficherait
# une erreur illisible, et le role Postgres resterait la avec un secret nul.
# Meme raisonnement que `METRICS_TOKEN`, qui FERME l'endpoint plutot que de
# l'ouvrir quand il manque.
- name: "[obs] Exiger le mot de passe Postgres de Grafana"
  ansible.builtin.assert:
    that:
      - grafana_pg_password | length >= 16
    fail_msg: >
      GRAFANA_PG_PASSWORD est absent ou trop court dans
      {{ k8s_observability_secrets_env }}. Le generer avec
      `scripts/secrets/bootstrap.sh` (il ne touche QUE les valeurs vides,
      sans --rotate), rejouer playbooks/31-urbanlink-deploy.yml, puis relancer
      ce role.
    success_msg: "Grafana : mot de passe Postgres present."

- name: "[obs] Le role Postgres en lecture seule de Grafana"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl -n {{ k8s_observability_namespace }} exec -i postgres-0 -- \
        psql -U urbanconnect -d urbanconnect -v ON_ERROR_STOP=1 <<'SQL'
      DO $$ BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'grafana_ro') THEN
          CREATE ROLE grafana_ro LOGIN;
        END IF;
      END $$;
      ALTER ROLE grafana_ro WITH PASSWORD '{{ grafana_pg_password }}';

      GRANT CONNECT ON DATABASE urbanconnect TO grafana_ro;
      GRANT USAGE  ON SCHEMA public TO grafana_ro;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_ro;

      -- ⚠️ `FOR ROLE urbanconnect` est OBLIGATOIRE : sans lui, la regle ne
      -- vaudrait que pour les tables creees par le role qui execute ce bloc.
      -- Les migrations Prisma tournent en `urbanconnect` -- c'est de SES
      -- futures tables qu'il s'agit. Sans ca, une table ajoutee dans six mois
      -- serait invisible a Grafana, et le panneau rendrait « permission
      -- denied » plutot qu'un vide : honnete, mais remarque six mois trop tard.
      ALTER DEFAULT PRIVILEGES FOR ROLE urbanconnect IN SCHEMA public
        GRANT SELECT ON TABLES TO grafana_ro;

      ALTER ROLE grafana_ro SET default_transaction_read_only = on;
      SQL
    executable: /bin/bash
  changed_when: false
  no_log: true          # le mot de passe transite dans la commande

# ⚠️ CETTE VERIFICATION EST LE CŒUR DE LA TACHE PRECEDENTE, pas son ornement.
# Un role de tableau de bord qui peut ecrire dans la base du produit est un
# probleme plus grave que l'absence de tableau de bord. On ne verifie donc pas
# que le GRANT a ete « applique » : on ESSAIE D'ECRIRE, et on exige l'echec.
- name: "[obs] Exiger que grafana_ro ne puisse PAS ecrire"
  ansible.builtin.shell:
    cmd: |
      echo "CREATE TABLE zz_grafana_ro_probe(i int);" | \
        kubectl -n {{ k8s_observability_namespace }} exec -i postgres-0 -- \
          psql -U grafana_ro -d urbanconnect 2>&1 || true
    executable: /bin/bash
  register: grafana_ro_probe
  changed_when: false

- name: "[obs] Le refus d'ecriture doit etre explicite"
  ansible.builtin.assert:
    that:
      - "'read-only transaction' in grafana_ro_probe.stdout"
    fail_msg: >-
      grafana_ro a pu executer un CREATE TABLE, ou a echoue pour une autre
      raison que le mode lecture seule. Sortie : {{ grafana_ro_probe.stdout }}.
      NE PAS CONTINUER : un role de tableau de bord qui ecrit dans la base du
      produit est plus grave que l'absence de tableau de bord.
    success_msg: "grafana_ro est bien en lecture seule (CREATE TABLE refuse)."
