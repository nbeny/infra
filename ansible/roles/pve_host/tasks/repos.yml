---
# Proxmox VE 9 (Debian trixie) utilise le format deb822 (.sources) et non plus
# les anciens fichiers .list.

- name: Desactiver le depot PVE enterprise (necessite un abonnement payant)
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    types: [deb]
    uris: https://enterprise.proxmox.com/debian/pve
    suites: "{{ ansible_distribution_release }}"
    components: [pve-enterprise]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: false
    state: present
  when: pve_disable_enterprise_repo | bool
  notify: Mettre a jour le cache APT

- name: Activer le depot PVE no-subscription
  ansible.builtin.deb822_repository:
    name: proxmox
    types: [deb]
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ ansible_distribution_release }}"
    components: [pve-no-subscription]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: true
    state: present
  when: pve_use_no_subscription_repo | bool
  notify: Mettre a jour le cache APT

- name: Verifier la presence des depots Debian de base
  ansible.builtin.deb822_repository:
    name: debian
    types: [deb]
    uris: http://deb.debian.org/debian/
    suites:
      - "{{ ansible_distribution_release }}"
      - "{{ ansible_distribution_release }}-updates"
    components: [main, contrib, non-free-firmware]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    enabled: true
    state: present
  notify: Mettre a jour le cache APT

- name: Appliquer les changements de depots maintenant
  ansible.builtin.meta: flush_handlers
