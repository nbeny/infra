---
# ============================================================================
#  Mailcow -- les boites de urbanlink.fr
# ----------------------------------------------------------------------------
#  Pourquoi Mailcow et pas Stalwart : l'etat de l'art 2026 donne les deux comme
#  serieux, mais Stalwart est encore en 0.x avec une refonte cassante en v0.16
#  (les noms de comptes deviennent des adresses completes, l'API REST change).
#  Pour une messagerie qui doit tenir des annees sans intervention, la maturite
#  de Postfix + Dovecot + Rspamd l'emporte.
#
#  Le MTA ne decide de rien en delivrabilite -- il decide du confort
#  d'exploitation. La delivrabilite se joue sur l'IP, le PTR, l'authentification
#  et la reputation, c'est-a-dire ailleurs que dans ce role.
# ============================================================================

mailcow_dir: /opt/mailcow-dockerized
mailcow_repo: https://github.com/mailcow/mailcow-dockerized.git
mailcow_branch: master

# Identite SMTP : ce nom est annonce en HELO et doit correspondre au PTR de
# 147.79.102.17. Il resout PUBLIQUEMENT vers le VPS.
mailcow_hostname: mail.urbanlink.fr

# Nom des INTERFACES, distinct du precedent et pas interchangeable avec lui.
# Couvert par le wildcard *.urbanlink.fr -> 192.168.100.50, donc LAN
# uniquement. Sans cette entree dans ADDITIONAL_SERVER_NAMES, le nginx de
# Mailcow rejetterait l'en-tete Host que lui envoie l'openresty du noeud.
mailcow_ui_hostname: webmail.urbanlink.fr

mailcow_timezone: Europe/Paris

# L'UI ne prend pas 80/443 : le TLS est termine par l'openresty du noeud, qui
# detient deja le certificat wildcard.
mailcow_http_port: 8080
mailcow_https_port: 8443

# Reseau Docker, derive de la SOURCE UNIQUE posee dans group_vars/all.yml.
# Le role mail_tunnel route exactement ce prefixe : les deux ne peuvent donc
# plus diverger, ce qui couperait l'emission sans autre symptome qu'une file
# d'attente qui gonfle.
mailcow_ipv4_network: "{{ mail_docker_net_prefix }}"

# ClamAV couterait ~1,5 Go de RAM pour un volume de courrier personnel, alors
# que Rspamd fait deja le gros du filtrage.
mailcow_skip_clamd: "y"

# Certificats fournis par le noeud (wildcard *.urbanlink.fr, DNS-01
# Cloudflare). Un ACME local echouerait de toute facon : le port 80 du nom
# public appartient au VPS, pas a cette VM.
mailcow_skip_letsencrypt: "y"

# Certificat wildcard du noeud, pose par le role tls_certificates. Le nom du
# repertoire est le `--cert-name` de certbot : le changer creerait un doublon
# et laisserait les vhosts pointer sur un chemin mort.
mailcow_cert_source: /etc/letsencrypt/live/urbanlink.fr

# Adresse de la VM, vue depuis le noeud. Le script de distribution tourne la-bas.
mailcow_vm_ip: 10.0.0.140

# --- Comptes ---------------------------------------------------------------
# Fichier de secrets du lab, non versionne, lu sur le NOEUD de controle. Meme
# fichier que celui dont le role edge_urbanlink tire l'authentification des
# consoles : le mot de passe de la messagerie est celui des autres consoles,
# comme Grafana et pgAdmin.
mailcow_secrets_env: "{{ playbook_dir }}/../../kube/urbanlink/secrets.env"

mailcow_dkim_selector: dkim

mailcow_domains_wanted:
  - name: urbanlink.fr
    description: "Courrier humain -- boites perso et adresses de service"
    quota: 10240        # Mo par boite
    maxquota: 10240

mailcow_mailboxes:
  # La boite principale. C'est deja l'identite de l'utilisateur dans le lab
  # (CONSOLE_ADMIN_EMAIL).
  - { local_part: alesio,  domain: urbanlink.fr, name: "Nicolas",                quota: 5120 }
  # Adresse publique, celle que Kratos utilise deja chez Infomaniak : la
  # recreer ici evite de perdre l'adresse que les utilisateurs connaissent.
  - { local_part: contact, domain: urbanlink.fr, name: "Contact UrbanConnect",   quota: 2048 }
  # Boites techniques. Sans elles, les rapports agreges DMARC et les rapports
  # d'echec TLS n'ont nulle part ou arriver -- et on passerait en p=reject sans
  # savoir qui usurpe le domaine.
  - { local_part: dmarc,   domain: urbanlink.fr, name: "Rapports DMARC",         quota: 1024 }
  - { local_part: tlsrpt,  domain: urbanlink.fr, name: "Rapports TLS",           quota: 1024 }

# postmaster@ et abuse@ ne sont pas decoratifs : leur absence est un signal
# negatif pour les grands fournisseurs, et abuse@ est l'adresse qu'un operateur
# utilise pour signaler un probleme AVANT de blacklister l'IP.
mailcow_aliases_wanted:
  - { address: "postmaster@urbanlink.fr", goto: "alesio@urbanlink.fr" }
  - { address: "abuse@urbanlink.fr",      goto: "alesio@urbanlink.fr" }

# --- DNS -------------------------------------------------------------------
# Zone Cloudflare de la messagerie. Le token depose par le role
# tls_certificates y est limite a Zone:DNS:Edit -- il ne peut donc ni lire ni
# changer les reglages de la zone, seulement ses enregistrements.
mailcow_dns_zone: urbanlink.fr
mailcow_cloudflare_credentials: /root/.secrets/cloudflare.ini

# SPF de transition : les deux origines coexistent tant qu'Infomaniak sert.
# `-all` (et non `~all`) parce qu'un SPF permissif n'apporte rien : il indique
# aux recepteurs de ne rien conclure d'un echec, ce qui affaiblit DMARC.
mailcow_spf_content: "v=spf1 ip4:147.79.102.17 include:spf.infomaniak.ch -all"

# --- Observabilite ---------------------------------------------------------
mailcow_sending_ip: "{{ mail_tunnel_public_ip | default('147.79.102.17') }}"
# Repertoire textfile PAR DEFAUT du paquet Debian : le collecteur y lit sans
# qu'on ait rien a passer en argument. Imposer --collector.textfile.directory
# obligerait a redemarrer le service et a esperer que $ARGS soit bien pris --
# une piece mobile de plus pour rien.
mailcow_textfile_dir: /var/lib/prometheus/node-exporter

# Assez frequent pour reagir vite, assez espace pour ne pas marteler les listes.
mailcow_probe_interval: 15min
mailcow_postfix_container: mailcowdockerized-postfix-mailcow-1

# Resolveur RECURSIF, et non un resolveur public : Spamhaus refuse ces
# derniers et repond 127.255.255.254, que l'on confondrait avec une
# inscription. C'est l'unbound de Mailcow, qui sort par le tunnel.
mailcow_dnsbl_resolver: "{{ mail_docker_net_prefix }}.254"

# Les listes qui comptent reellement pour Gmail, Outlook et Yahoo. En ajouter
# davantage produirait du bruit : certaines listes sont si agressives qu'une
# inscription n'y veut rien dire.
mailcow_dnsbl_zones:
  - zen.spamhaus.org
  - b.barracudacentral.org
  - bl.spamcop.net
  - psbl.surriel.com
  - dnsbl.sorbs.net
  - dnsbl-1.uceprotect.net

# --- Sauvegardes -----------------------------------------------------------
# Le parent (/var/backups/mailcow-data) reste en 0700 ; seul le repertoire
# final est ouvert, comme l'exige le script de Mailcow.
mailcow_backup_dir: /var/backups/mailcow-data/store
mailcow_backup_retention_days: 30
# 03h30 : apres la rotation de journaux de la nuit, avant le reveil des
# utilisateurs.
mailcow_backup_schedule: "*-*-* 03:30:00"

# Nom joignable UNIQUEMENT a travers WireGuard. Il resout vers l'adresse du
# tunnel de la VM : le certificat wildcard le couvre, donc aucun avertissement
# de securite sur le telephone.
mailcow_vpn_name: vpn-mail.urbanlink.fr
mailcow_vpn_ip: "{{ mail_tunnel_mail_ip | default('10.88.0.2') }}"

# --- MTA-STS ---------------------------------------------------------------
mailcow_mtasts_host: mta-sts.urbanlink.fr
# ⚠️ A INCREMENTER a chaque modification de la politique servie par le VPS.
# Sans changement d'id, les serveurs emetteurs conservent l'ancienne politique
# jusqu'a max_age -- une semaine.
mailcow_mtasts_id: "20260905140000"

# --- DMARC -----------------------------------------------------------------
# Deux destinataires de rapports : celui de Cloudflare, deja en place et qui
# offre un tableau de bord tout fait, ET une boite a nous -- sans quoi on
# dependrait entierement d'un tiers pour decider du durcissement.
#
# `p=none` EST MAINTENU, et ce n'est pas de la frilosite. Kratos emet encore
# via Infomaniak en tant que contact@urbanlink.fr : si Infomaniak reecrit
# l'adresse d'enveloppe pour ses rebonds, l'alignement SPF echoue et la
# signature DKIM porte leur domaine, pas le notre. En `quarantine`, les mails
# de verification de compte partiraient donc en indesirables -- silencieusement.
#
# Sequence : lire les rapports, migrer Kratos (phase 5), PUIS passer a
# `quarantine`, puis `reject`. Chaque etape sur preuves.
mailcow_dmarc_content: >-
  v=DMARC1; p=none; rua=mailto:f0377b57202644169e025f479791f760@dmarc-reports.cloudflare.net,mailto:dmarc@urbanlink.fr;
  ruf=mailto:dmarc@urbanlink.fr; fo=1
