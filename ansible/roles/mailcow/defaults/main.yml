---
# ============================================================================
#  Mailcow -- les boites de urbanlink.fr
# ----------------------------------------------------------------------------
#  Pourquoi Mailcow et pas Stalwart : l'etat de l'art 2026 donne les deux comme
#  serieux, mais Stalwart est encore en 0.x avec une refonte cassante en v0.16
#  (les noms de comptes deviennent des adresses completes, l'API REST change).
#  Pour une messagerie qui doit tenir des annees sans intervention, la maturite
#  de Postfix + Dovecot + Rspamd l'emporte.
#
#  Le MTA ne decide de rien en delivrabilite -- il decide du confort
#  d'exploitation. La delivrabilite se joue sur l'IP, le PTR, l'authentification
#  et la reputation, c'est-a-dire ailleurs que dans ce role.
# ============================================================================

mailcow_dir: /opt/mailcow-dockerized
mailcow_repo: https://github.com/mailcow/mailcow-dockerized.git
mailcow_branch: master
# Commit EXACT en prod (releve le 2026-10-09, master du 2026-08-18). Sans lui,
# une reconstruction clonerait le master du jour -- autres images, autres
# migrations que ce qui tourne. Vide = tete de mailcow_branch. Apres un
# ./update.sh, reporter ici le nouveau commit (`git -C /opt/mailcow-dockerized
# rev-parse HEAD`).
mailcow_commit: 02552ffefdf0869f988edf4a7e03822e8b467b34

# Identite SMTP : ce nom est annonce en HELO et doit correspondre au PTR de
# 147.79.102.17. Il resout PUBLIQUEMENT vers le VPS.
mailcow_hostname: mail.urbanlink.fr

# Nom des INTERFACES, distinct du precedent et pas interchangeable avec lui.
# Couvert par le wildcard *.urbanlink.fr -> 192.168.100.50, donc LAN
# uniquement. Sans cette entree dans ADDITIONAL_SERVER_NAMES, le nginx de
# Mailcow rejetterait l'en-tete Host que lui envoie l'openresty du noeud.
mailcow_ui_hostname: webmail.urbanlink.fr

mailcow_timezone: Europe/Paris

# L'UI ne prend pas 80/443 : le TLS est termine par l'openresty du noeud, qui
# detient deja le certificat wildcard.
mailcow_http_port: 8080
mailcow_https_port: 8443

# Reseau Docker, derive de la SOURCE UNIQUE posee dans group_vars/all.yml.
# Le role mail_tunnel route exactement ce prefixe : les deux ne peuvent donc
# plus diverger, ce qui couperait l'emission sans autre symptome qu'une file
# d'attente qui gonfle.
mailcow_ipv4_network: "{{ mail_docker_net_prefix }}"

# ClamAV ACTIVE depuis le 2026-10-08. Il etait coupe pour ~1,5 Go de RAM quand
# l'hote etait surengage ; l'hote a depuis 314 Go et la VM ~5,7 Go libres. Coupe,
# il laissait le module antivirus de Rspamd en echec sur chaque message
# (CLAM_VIRUS_FAIL), et contact@ recoit de n'importe qui. Voir tasks/antispam.yml.
mailcow_skip_clamd: "n"

# Seuils d'action de Rspamd (score du message). Par rapport aux defauts Mailcow
# (7 / 8 / 15), on classe en Indesirables plus tot, comme Gmail et Outlook :
# un indesirable range dans Junk ne coute rien, un rejet est definitif -- d'ou
# le seuil de rejet laisse a 15. Les messages au-dessus de `add_header` sont
# deplaces dans Junk par le sieve global de Mailcow ; deplacer un message dans
# ou hors de Junk entraine le filtre bayesien.
mailcow_rspamd_actions:
  greylist: 5
  add_header: 6
  reject: 15

# Certificats fournis par le noeud (wildcard *.urbanlink.fr, DNS-01
# Cloudflare). Un ACME local echouerait de toute facon : le port 80 du nom
# public appartient au VPS, pas a cette VM.
mailcow_skip_letsencrypt: "y"

# Certificat wildcard du noeud, pose par le role tls_certificates. Le nom du
# repertoire est le `--cert-name` de certbot : le changer creerait un doublon
# et laisserait les vhosts pointer sur un chemin mort.
mailcow_cert_source: /etc/letsencrypt/live/urbanlink.fr

# Adresse de la VM, vue depuis le noeud. Le script de distribution tourne la-bas.
mailcow_vm_ip: 10.0.0.140

# --- Comptes ---------------------------------------------------------------
# Fichier de secrets du lab, non versionne, lu sur le NOEUD de controle. Meme
# fichier que celui dont le role edge_urbanlink tire l'authentification des
# consoles : le mot de passe de la messagerie est celui des autres consoles,
# comme Grafana et pgAdmin.
mailcow_secrets_env: "{{ playbook_dir }}/../../kube/urbanlink/secrets.env"

mailcow_dkim_selector: dkim

mailcow_domains_wanted:
  - name: urbanlink.fr
    description: "Courrier humain -- boites perso et adresses de service"
    # Vocabulaire de l'API Mailcow : `quota` = TOTAL du domaine, `maxquota` =
    # plafond d'UNE boite. Releve de 10240 a 20480 le 2026-10-06 : les cinq
    # premieres boites prenaient deja les 10240 Mo, et la VM a ~130 Go libres.
    # Le domaine existant suit grace a « Aligner les quotas des domaines ».
    quota: 20480
    maxquota: 10240

# Champs optionnels par boite :
#   password_env : nom de la variable de {{ mailcow_secrets_env }} qui porte le
#                  mot de passe de CETTE boite (12 caracteres minimum). Absent :
#                  mot de passe des consoles (CONSOLE_ADMIN_PASSWORD). N'est lu
#                  qu'a la CREATION de la boite : changer la variable ensuite
#                  ne fait rien tant que la boite existe deja.
#   ratelimit    : "<nombre>/<s|m|h|d>", limite d'envoi appliquee par Mailcow.
mailcow_mailboxes:
  # La boite principale. C'est deja l'identite de l'utilisateur dans le lab
  # (CONSOLE_ADMIN_EMAIL).
  - { local_part: alesio,  domain: urbanlink.fr, name: "Nicolas",                quota: 5120 }
  # Adresse publique, et expediteur de l'application (backend + Kratos), qui
  # s'authentifie par un mot de passe d'application limite au SMTP.
  - { local_part: contact, domain: urbanlink.fr, name: "Contact UrbanConnect",   quota: 2048 }
  # Prospection de Nicolas (nbeny-sales). Mot de passe SEPARE de celui des
  # consoles : la revoquer ne touche donc pas Grafana, pgAdmin ni les autres
  # boites. Ce role ne pose ce mot de passe qu'A LA CREATION de la boite : pour
  # le changer ensuite, editer dans l'UI Mailcow (Mailboxes -> editer la boite)
  # ou via POST /api/v1/edit/mailbox, PUIS reporter la meme valeur dans
  # %USERPROFILE%\.nbeny-sales\smtp.env sur le poste Windows -- le playbook ne
  # le fait pas pour vous. Limite d'envoi posee cote serveur : un bug de boucle
  # dans la CLI ne peut pas depasser 20 messages par heure, ni abimer la
  # reputation de l'IP.
  # Quota 1024 : le domaine plafonne a 10240 Mo au total et les quatre autres
  # boites en prennent deja 9216. A 2048, Mailcow refusait la creation.
  - { local_part: nicolas, domain: urbanlink.fr, name: "Nicolas BENY",          quota: 1024, password_env: PROSPECTION_MAIL_PASSWORD, ratelimit: "20/h" }
  # Boites techniques. Sans elles, les rapports agreges DMARC et les rapports
  # d'echec TLS n'ont nulle part ou arriver -- et on passerait en p=reject sans
  # savoir qui usurpe le domaine.
  - { local_part: dmarc,   domain: urbanlink.fr, name: "Rapports DMARC",         quota: 1024 }
  - { local_part: tlsrpt,  domain: urbanlink.fr, name: "Rapports TLS",           quota: 1024 }
  # Compte systeme « A decouvrir » de l'application (DISCOVER_ACCOUNT dans
  # backTs/src/modules/discover/discover-account.service.ts) : sans boite, tout
  # courrier adresse a ce compte (Kratos, notifications, comptes ouverts chez
  # les sources de donnees) rebondissait.
  - { local_part: decouvrir, domain: urbanlink.fr, name: "A decouvrir UrbanLink", quota: 1024 }

# postmaster@ et abuse@ ne sont pas decoratifs : leur absence est un signal
# negatif pour les grands fournisseurs, et abuse@ est l'adresse qu'un operateur
# utilise pour signaler un probleme AVANT de blacklister l'IP.
mailcow_aliases_wanted:
  - { address: "postmaster@urbanlink.fr", goto: "alesio@urbanlink.fr" }
  - { address: "abuse@urbanlink.fr",      goto: "alesio@urbanlink.fr" }

# --- DNS -------------------------------------------------------------------
# Zone Cloudflare de la messagerie. Le token depose par le role
# tls_certificates y est limite a Zone:DNS:Edit -- il ne peut donc ni lire ni
# changer les reglages de la zone, seulement ses enregistrements.
mailcow_dns_zone: urbanlink.fr
mailcow_cloudflare_credentials: /root/.secrets/cloudflare.ini

# Seule origine autorisee : l'IP du VPS, par ou sort tout le courrier de Mailcow.
# L'`include:spf.infomaniak.ch` de la transition est tombe le 2026-10-08, quand
# le backend et Kratos sont passes d'Infomaniak a Mailcow -- les rapports DMARC
# ne montraient plus d'autre origine legitime.
# `-all` (et non `~all`) parce qu'un SPF permissif n'apporte rien : il indique
# aux recepteurs de ne rien conclure d'un echec, ce qui affaiblit DMARC.
mailcow_spf_content: "v=spf1 ip4:147.79.102.17 -all"

# --- Observabilite ---------------------------------------------------------
mailcow_sending_ip: "{{ mail_tunnel_public_ip | default('147.79.102.17') }}"

# --- Sonde de l'IP d'emission ----------------------------------------------
# Interroge la decision de routage du noyau pour un paquet venant du reseau
# Docker. Le pont est celui que Mailcow cree pour IPV4_NETWORK ; `iif` est
# OBLIGATOIRE, le trafic des conteneurs etant forwarde et non emis localement.
# L'adresse source n'a qu'a tomber dans le /24 vise par la regle de routage,
# et la destination n'est jamais contactee -- c'est une question au noyau.
mailcow_egress_bridge: br-mailcow
mailcow_egress_probe_src: "{{ mailcow_ipv4_network }}.2"
mailcow_egress_probe_dst: 8.8.8.8
# Repertoire textfile du paquet Debian.
#
# ⚠️ IL EST DESORMAIS IMPOSE, ET CE N'EST PAS UN REVIREMENT GRATUIT.
#
# Ce reglage disait auparavant : « c'est le defaut du paquet, le collecteur y
# lit sans qu'on ait rien a passer ; imposer --collector.textfile.directory
# serait une piece mobile de plus pour rien. » Le raisonnement etait juste le
# jour ou il a ete ecrit. Il a cesse de l'etre sans que rien ne le dise.
#
# Releve le 2026-09-18 sur la VM 140 :
#
#   /etc/default/prometheus-node-exporter
#     ARGS="--collector.textfile.directory=/var/lib/node_exporter/textfile"
#
#   la sonde ecrit dans : /var/lib/prometheus/node-exporter/mail.prom
#   node_exporter lit   : /var/lib/node_exporter/textfile
#
# Les deux ne pointaient plus au meme endroit. La sonde tournait toutes les
# 15 min, sortait en 0, ecrivait son fichier ; node_exporter repondait ;
# `up{job="messagerie"}` valait 1. Et `curl :9100/metrics | grep -c '^mail_'`
# rendait ZERO -- la metrique ne quittait jamais la machine.
#
# ⚠️ Quatre collecteurs etaient muets, pas un : `apt.prom`, `nvme.prom` et
# `smartmon.prom` vivent dans le meme repertoire. Sur un serveur de
# messagerie, la sante SMART des disques etait absente sans que personne ne
# l'ait decide.
#
# Une valeur par defaut n'est pas une garantie : elle est une hypothese sur
# l'etat d'une machine, et une hypothese non verifiee finit par etre fausse.
mailcow_textfile_dir: /var/lib/prometheus/node-exporter

# Assez frequent pour reagir vite, assez espace pour ne pas marteler les listes.
mailcow_probe_interval: 15min
mailcow_postfix_container: mailcowdockerized-postfix-mailcow-1

# Resolveur RECURSIF, et non un resolveur public : Spamhaus refuse ces
# derniers et repond 127.255.255.254, que l'on confondrait avec une
# inscription. C'est l'unbound de Mailcow, qui sort par le tunnel.
mailcow_dnsbl_resolver: "{{ mail_docker_net_prefix }}.254"

# Les listes qui comptent reellement pour Gmail, Outlook et Yahoo. En ajouter
# davantage produirait du bruit : certaines listes sont si agressives qu'une
# inscription n'y veut rien dire.
mailcow_dnsbl_zones:
  - zen.spamhaus.org
  - b.barracudacentral.org
  - bl.spamcop.net
  - psbl.surriel.com
  - dnsbl.sorbs.net
  - dnsbl-1.uceprotect.net

# --- Sauvegardes -----------------------------------------------------------
# Le parent (/var/backups/mailcow-data) reste en 0700 ; seul le repertoire
# final est ouvert, comme l'exige le script de Mailcow.
mailcow_backup_dir: /var/backups/mailcow-data/store
mailcow_backup_retention_days: 30
# 03h30 : apres la rotation de journaux de la nuit, avant le reveil des
# utilisateurs.
mailcow_backup_schedule: "*-*-* 03:30:00"

# Nom joignable UNIQUEMENT a travers WireGuard. Il resout vers l'adresse du
# tunnel de la VM : le certificat wildcard le couvre, donc aucun avertissement
# de securite sur le telephone.
mailcow_vpn_name: vpn-mail.urbanlink.fr
mailcow_vpn_ip: "{{ mail_tunnel_mail_ip | default('10.88.0.2') }}"

# --- MTA-STS ---------------------------------------------------------------
mailcow_mtasts_host: mta-sts.urbanlink.fr
# ⚠️ A INCREMENTER a chaque modification de la politique servie par le VPS.
# Sans changement d'id, les serveurs emetteurs conservent l'ancienne politique
# jusqu'a max_age -- une semaine.
mailcow_mtasts_id: "20260905140000"

# --- DMARC -----------------------------------------------------------------
# Deux destinataires de rapports : celui de Cloudflare, deja en place et qui
# offre un tableau de bord tout fait, ET une boite a nous -- sans quoi on
# dependrait entierement d'un tiers pour decider du durcissement.
#
# `p=none` EST MAINTENU, et ce n'est pas de la frilosite. Kratos emet encore
# via Infomaniak en tant que contact@urbanlink.fr : si Infomaniak reecrit
# l'adresse d'enveloppe pour ses rebonds, l'alignement SPF echoue et la
# signature DKIM porte leur domaine, pas le notre. En `quarantine`, les mails
# de verification de compte partiraient donc en indesirables -- silencieusement.
#
# Sequence : lire les rapports, migrer Kratos (phase 5), PUIS passer a
# `quarantine`, puis `reject`. Chaque etape sur preuves.
mailcow_dmarc_content: >-
  v=DMARC1; p=none; rua=mailto:f0377b57202644169e025f479791f760@dmarc-reports.cloudflare.net,mailto:dmarc@urbanlink.fr;
  ruf=mailto:dmarc@urbanlink.fr; fo=1

# --- Theme de l'interface --------------------------------------------------
# Table de correspondance du theme : quel fichier sert quelles URL, et avec
# quel type MIME. Elle alimente a la fois le depot des fichiers dans
# data/conf/nginx/ et la generation des blocs `location =` qui les publient.
#
# Les URL en double (`/SOGo/...` et `/SOGo.woa/...`) ne sont pas une precaution
# gratuite : SOGo construit les siennes avec `.woa`, tandis que notre amorce
# demande la feuille de style sans. Les deux doivent aboutir au meme fichier.
#
# Le suffixe `.custom` des noms de fichiers est deliberé : il les fait entrer
# dans le motif `data/conf/nginx/*.custom` du .gitignore de Mailcow, donc une
# mise a jour ne les emporte pas. Il ne les fait PAS entrer dans le motif
# d'inclusion nginx, qui est `site.*.custom` : ce sont des donnees, pas de la
# configuration.
mailcow_theme_routes:
  - file: proton-theme.css.custom
    src: sogo-proton.css
    type: text/css
    urls:
      - /SOGo/WebServerResources/css/custom-theme.css
      - /SOGo.woa/WebServerResources/css/custom-theme.css
  - file: proton-theme.js.custom
    src: sogo-proton.js
    type: application/javascript
    urls:
      - /SOGo.woa/WebServerResources/js/theme.js
      - /SOGo/WebServerResources/js/theme.js
  - file: proton-logo-full.svg.custom
    src: logo-full.svg
    type: image/svg+xml
    urls:
      - /SOGo/WebServerResources/img/sogo-full.svg
      - /SOGo.woa/WebServerResources/img/sogo-full.svg
  - file: proton-logo-short.svg.custom
    src: logo-short.svg
    type: image/svg+xml
    urls:
      - /SOGo/WebServerResources/img/sogo-compact.svg
      - /SOGo.woa/WebServerResources/img/sogo-compact.svg
  # Emplacement de logo de l'interface Mailcow (page de connexion, console).
  # L'image d'origine reste intacte dans data/web/img/ : on se contente de
  # servir la notre a cette URL. Retirer cette entree suffit a revenir a la
  # vache de Mailcow.
  - file: proton-logo-portrait.svg.custom
    src: logo-portrait.svg
    type: image/svg+xml
    urls:
      - /img/cow_mailcow.svg
