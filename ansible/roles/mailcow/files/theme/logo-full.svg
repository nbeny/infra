<?xml version="1.0" encoding="UTF-8"?>
<!--
  urbanlink  :  logotype complet du webmail.
  Depose par Ansible sur data/conf/sogo/custom-fulllogo.svg, que Mailcow monte
  deja sur .../img/sogo-full.svg. Pour le remplacer par le votre : ecraser
  ansible/roles/mailcow/files/theme/logo-full.svg et rejouer le playbook.

  Le violet #7c5cff est un compromis DELIBERE : il tient le contraste aussi
  bien sur le fond clair (#edebf5) que sur le fond sombre (#191622) de la
  barre laterale. Une image chargee via <img> n'herite pas des variables CSS
  de la page, donc une seule couleur doit servir aux deux modes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 36" width="184" height="36" role="img" aria-label="urbanlink">
  <defs>
    <linearGradient id="ul-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#c026a8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="4" width="28" height="28" rx="9" fill="url(#ul-g)"/>
  <path d="M9.5 14.2h13v9.6h-13z" fill="none" stroke="#ffffff" stroke-width="1.9"
        stroke-linejoin="round"/>
  <path d="M9.5 14.9l6.5 4.8 6.5-4.8" fill="none" stroke="#ffffff" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="25" fill="#7c5cff"
        font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.5">urbanlink</text>
</svg>
