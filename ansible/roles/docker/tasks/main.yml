---
- name: Creer le repertoire des trousseaux APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Recuperer la cle GPG de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Ajouter le depot Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true
    state: present
  register: docker_repo

- name: Installer Docker Engine et containerd
  ansible.builtin.apt:
    name: "{{ docker_packages + (['docker-compose-plugin'] if docker_compose_plugin | bool else []) }}"
    state: present
    update_cache: "{{ docker_repo.changed }}"
  retries: 3
  delay: 10

- name: Ajouter les utilisateurs au groupe docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

# ---------------------------------------------------------------------------
#  containerd : cgroup driver systemd
# ---------------------------------------------------------------------------
# kubelet tourne sous systemd depuis la v1.22. Si containerd utilise cgroupfs
# alors que kubelet attend systemd, les deux se disputent les cgroups et le
# noeud devient instable sous charge. C'est LE reglage a ne pas rater.
- name: Configurer containerd
  when: docker_containerd_systemd_cgroup | bool
  block:

    - name: Creer /etc/containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verifier si la configuration containerd existe
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Lire la configuration containerd existante
      ansible.builtin.slurp:
        src: /etc/containerd/config.toml
      register: containerd_config_raw
      when: containerd_config.stat.exists

    # Le paquet containerd.io livre un config.toml minimal contenant
    # `disabled_plugins = ["cri"]`. Deux consequences : le plugin CRI est
    # desactive (kubelet ne peut alors pas parler a containerd du tout), et le
    # reglage SystemdCgroup n'existe nulle part. La configuration complete
    # generee par containerd lui-meme corrige les deux.
    - name: Generer la configuration containerd complete
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
        executable: /bin/bash
      when: >-
        not containerd_config.stat.exists
        or 'SystemdCgroup' not in (containerd_config_raw.content | b64decode)
      changed_when: true
      notify: Redemarrer containerd

    - name: Basculer containerd sur le cgroup driver systemd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*=\s*false\s*$'
        replace: '\1SystemdCgroup = true'
      notify: Redemarrer containerd

    - name: Verifier que SystemdCgroup est bien actif
      ansible.builtin.command: grep -c 'SystemdCgroup = true' /etc/containerd/config.toml
      register: containerd_cgroup_check
      changed_when: false
      failed_when: containerd_cgroup_check.stdout | int < 1

    - name: Verifier que le plugin CRI n'est pas desactive
      ansible.builtin.command: grep -E '^disabled_plugins' /etc/containerd/config.toml
      register: containerd_disabled_plugins
      changed_when: false
      failed_when: "'cri' in containerd_disabled_plugins.stdout"

# ============================================================================
#  containerd : registres d'images en clair
# ============================================================================
# Le `config_path` et les `hosts.toml` vivent dans LE MEME bloc, et ce n'est
# pas un rangement de confort : l'un sans l'autre ne produit aucune erreur.
# Ecrire les hosts.toml en laissant config_path vide les rend presents,
# lisibles -- et jamais consultes.
- name: Declarer les registres en clair aupres de containerd
  when:
    - docker_insecure_registries | length > 0
    - docker_containerd_is_cri | bool
  block:

    # ⚠️ SANS CETTE TACHE, TOUT LE RESTE EST IGNORE EN SILENCE.
    # containerd ne lit /etc/containerd/certs.d que si `config_path` l'y
    # envoie ; or `containerd config default` (tache plus haut) laisse ce champ
    # VIDE. Le pull echoue alors sur une erreur TLS qui n'evoque rien du
    # probleme : « server gave HTTP response to HTTPS client ».
    #
    # ⚠️ La section a change de nom en containerd 2.x. Le noeud tourne v2.3.4
    # (releve le 2026-09-01), ou elle s'ecrit
    # [plugins.'io.containerd.cri.v1.images'.registry] -- en guillemets
    # SIMPLES. L'ancienne [plugins."io.containerd.grpc.v1.cri".registry]
    # n'existe plus.
    #
    # ⚠️ Et surtout PAS de `lineinfile` avec un regexp nu : le fichier contient
    # TROIS lignes `config_path` (registre, plugin NRI, plugin de transfert
    # d'images). `lineinfile` remplace la DERNIERE correspondance -- il
    # toucherait celle du transfert. D'ou ce `replace` ancre sur l'en-tete de
    # section, qui ne peut viser qu'elle.
    - name: Faire lire /etc/containerd/certs.d par containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: >-
          (\[plugins\.'io\.containerd\.cri\.v1\.images'\.registry\]\s*\n\s*config_path\s*=\s*)'[^']*'
        replace: "\\1'/etc/containerd/certs.d'"
      notify: Redemarrer containerd

    # Un `replace` qui ne matche rien ne signale RIEN -- il rapporte
    # simplement `changed: false`, indistinguable d'un fichier deja correct.
    # Cette verification transforme ce silence en echec.
    - name: Relire la configuration containerd
      ansible.builtin.slurp:
        src: /etc/containerd/config.toml
      register: containerd_config_after

    - name: Verifier que config_path a bien ete pose
      ansible.builtin.assert:
        that:
          - >-
            containerd_config_after.content | b64decode is search("\[plugins\.'io\.containerd\.cri\.v1\.images'\.registry\]\s*\n\s*config_path\s*=\s*'/etc/containerd/certs\.d'")
        fail_msg: >-
          config_path n'a pas ete pose dans la section registry de
          /etc/containerd/config.toml. L'en-tete de section a probablement
          change de nom avec la version de containerd : verifier
          `grep -n "registry\]" /etc/containerd/config.toml` sur l'hote.
        success_msg: containerd lira /etc/containerd/certs.d

    - name: Creer les repertoires de configuration des registres
      ansible.builtin.file:
        path: "/etc/containerd/certs.d/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ docker_insecure_registries }}"

    # ⚠️ `skip_verify` seul ne suffit PAS : il desactive la verification du
    # certificat, pas le passage en HTTPS. C'est le prefixe `http://` du champ
    # `server` qui fait parler containerd en clair.
    - name: Deposer les hosts.toml
      ansible.builtin.copy:
        dest: "/etc/containerd/certs.d/{{ item }}/hosts.toml"
        owner: root
        group: root
        mode: "0644"
        content: |
          # GERE PAR ANSIBLE -- roles/docker, docker_insecure_registries.
          server = "http://{{ item }}"

          [host."http://{{ item }}"]
            capabilities = ["pull", "resolve"]
            skip_verify = true
      loop: "{{ docker_insecure_registries }}"
      notify: Redemarrer containerd

# ⚠️ containerd NE SUFFIT PAS, et ce bloc-ci n'est pas une redite du precedent.
# containerd gouverne le PULL du cluster ; le PUSH depuis la CI passe par le
# demon Docker, qui tient sa propre liste dans son propre fichier.
#
# Et contrairement a ce qu'on lit souvent, Docker ne traite PAS les adresses
# RFC1918 comme des registres non securises : seul 127.0.0.0/8 l'est
# implicitement. Mesure le 2026-09-01 sur ci-runner (Docker 29.7.2),
# `docker push 10.0.0.130:5000/...` echouait sur « http: server gave HTTP
# response to HTTPS client » -- exactement le meme message que cote containerd,
# pour une cause distincte et un fichier different. De quoi croire que le
# correctif containerd n'a pas pris.
- name: Declarer les registres en clair aupres du demon Docker
  when: docker_insecure_registries | length > 0
  block:

    - name: Lire le daemon.json existant
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_json_raw
      failed_when: false

    # Fusion, jamais ecrasement : ce fichier porte deja la rotation des
    # journaux sur les hotes existants, et la reecrire de zero la perdrait.
    - name: Declarer les registres en clair aupres du demon Docker
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: >-
          {{
            ((docker_daemon_json_raw.content | default('') | b64decode | from_json)
              if (docker_daemon_json_raw.content is defined) else {})
            | combine({'insecure-registries': docker_insecure_registries})
            | to_nice_json
          }}
      notify: Redemarrer Docker

# Les handlers ne se declenchent qu'en fin de play, or le role kubernetes
# s'execute juste apres : containerd doit deja tourner avec la nouvelle
# configuration quand kubeadm demarre.
- name: Appliquer la configuration containerd maintenant
  ansible.builtin.meta: flush_handlers

- name: Activer et demarrer Docker
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd
    - docker

- name: Verifier que Docker repond
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_version
  changed_when: false

- name: Afficher la version de Docker
  ansible.builtin.debug:
    msg: "Docker Engine {{ docker_version.stdout }}"
