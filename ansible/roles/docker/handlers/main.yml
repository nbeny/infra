---
- name: Redemarrer containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
    daemon_reload: true

# ⚠️ Distinct du handler containerd : ce sont deux demons, deux fichiers de
# configuration, et redemarrer l'un ne relit pas la configuration de l'autre.
- name: Redemarrer Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
