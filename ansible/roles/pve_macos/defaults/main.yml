---
# ============================================================================
#  Template macOS sur le noeud Proxmox
# ----------------------------------------------------------------------------
#  ATTENTION -- ce noeud est un Xeon E5-2680 (Sandy Bridge, 2012) : il n'a PAS
#  AVX2. Depuis macOS Ventura (13), le cache dyld d'Apple n'est compile QUE
#  pour AVX2 et QEMU ne sait pas emuler cette seule instruction en gardant le
#  reste en materiel. Ventura et tout ce qui suit sont donc IMPOSSIBLES ici.
#  Monterey (12) est le plafond, et il plafonne lui-meme a Xcode 14.2.
#  Verifier avant de changer `pve_macos_version` :
#      grep -o avx2 /proc/cpuinfo   (aucune sortie = pas d'AVX2)
# ============================================================================

# --- Identite du template ---------------------------------------------------
# 9000/9001 = socles cloud-init, 9100/9101 = golden Packer. 9200 = macOS, qui
# ne passe par aucune de ces deux chaines (ni cloud-init, ni Packer).
pve_macos_vmid: 9200
pve_macos_name: tpl-macos-monterey

# pool1 est vide et dispose de 3,5 To ; pool2 est a 47 %. Une image macOS avec
# Xcode et les simulateurs depasse vite les 150 Go.
pve_macos_storage: pool1

# --- Version de macOS -------------------------------------------------------
#
# NE PAS UTILISER --shortname DE fetch-macOS-v2.py. Sa table interne code en
# dur `os_type: latest` pour l'entree "monterey" : elle demande a Apple LE PLUS
# RECENT systeme que supporte cette carte, pas Monterey. Ecrite a l'epoque ou
# Monterey etait le plus recent, elle a pourri en silence.
#
# Mesure ici le 2026-08-31 : `--shortname monterey` a rendu Sequoia (produit
# 696-28424, Darwin 24.4), qui exige AVX2 -- donc une VM qui affiche la pomme
# puis panique, sans que rien n'annonce la substitution. `--os-type default`
# sur la meme carte rend un autre produit (694-54378).
#
# D'ou : board-id explicite, --os-type default, et verification de la version
# Darwin REELLEMENT telechargee avant de construire quoi que ce soit.
pve_macos_version: monterey

pve_macos_versions:
  big-sur:
    board_id: Mac-2BD1B31983FE1663
    darwin_major: 20
    xcode_max: "13.2.1"
  monterey:
    board_id: Mac-B809C3757DA9BB8D
    darwin_major: 21
    xcode_max: "14.2"
  # Presentes pour que le message d'erreur soit parlant si quelqu'un les
  # demande. Elles exigent AVX2 et le role les refuse sur ce noeud.
  ventura:
    board_id: Mac-4B682C642B45593E
    darwin_major: 22
    xcode_max: "15.2"
  sonoma:
    board_id: Mac-827FAC58A8FDFA22
    darwin_major: 23
    xcode_max: "16.2"

# Darwin 22 (Ventura) est la premiere version dont le cache dyld n'est compile
# que pour AVX2.
pve_macos_avx2_required_from_darwin: 22

# --- OSK --------------------------------------------------------------------
# macOS refuse de demarrer sans le SMC d'Apple, qui repond une cle de 64
# caracteres. Elle s'extrait d'un vrai Mac (voir docs/macos-ci.md) et n'est
# volontairement pas versionnee ici. Sans elle, le role s'arrete.
#
#   ansible-playbook playbooks/11-macos-template.yml -e pve_macos_osk='...'
pve_macos_osk: ""

# --- Sources amont ----------------------------------------------------------
# OpenCore est le bootloader : l'OVMF de Proxmox seul ne sait pas demarrer
# macOS. La version est figee -- une release OpenCore plus recente peut casser
# une version de macOS plus ancienne.
pve_macos_opencore_release: v21
pve_macos_opencore_url: >-
  https://github.com/thenickdude/KVM-Opencore/releases/download/{{ pve_macos_opencore_release }}/OpenCore-{{ pve_macos_opencore_release }}.iso.gz
pve_macos_fetch_script_url: https://raw.githubusercontent.com/kholia/OSX-KVM/master/fetch-macOS-v2.py

# Delai avant que le selecteur OpenCore demarre l'entree par defaut. L'image
# amont sort a 0, qui signifie « attendre indefiniment » : un runner bloque au
# selecteur apres chaque redemarrage.
pve_macos_opencore_timeout: 5

pve_macos_work_dir: /var/lib/vz/template/macos

# --- Dimensionnement du template --------------------------------------------
# macOS veut un nombre de coeurs en puissance de 2 (1, 2, 4, 8) : une valeur
# comme 6 provoque un kernel panic au demarrage.
pve_macos_cores: 4
pve_macos_sockets: 1
pve_macos_memory: 8192

# 64 Go est le minimum pour l'installeur ; Xcode seul pese ~40 Go et chaque
# runtime de simulateur ajoute 8 a 12 Go.
pve_macos_disk_size: 200

# vmxnet3 : mesure le 2026-09-01, l'invite obtient son bail DHCP et sort sur
# Internet des le mode Recovery. macOS embarque bien un pilote VirtIO reseau
# depuis Big Sur, mais l'environnement de recuperation ne le charge pas
# toujours -- et sans interface, l'installeur ne peut rien telecharger.
pve_macos_net_model: vmxnet3

# --- Comportement -----------------------------------------------------------
# `true` detruit et reconstruit le template. Sans effet utile apres
# l'installation graphique : la reconstruction la fait recommencer a zero.
pve_macos_force: false

# --- DHCP du bridge du lab (mode Recovery / installation) -------------------
# L'environnement de recuperation de macOS ne configure une interface que par
# DHCP : il n'a pas d'ecran de reglage IP manuel, et il n'existe pas de
# cloud-init sur macOS. Sans bail, l'installeur ne telecharge rien.
#
# Le role pose donc un dnsmasq. C'est un service qui deborde du perimetre
# macOS : il sert le bridge du lab en entier. Il est en DHCP seul (`port=0`,
# pas de resolveur DNS expose) et la plage evite les IPs statiques deja
# distribuees a la main :
#
#   10.0.0.102  urbanlink (DNAT SSH)
#   10.0.0.111  urbanlink
#   10.0.0.130  ci-runner
#   10.0.0.140  macOS CI (terraform)
#
# Mettre a `false` sur un noeud qui a deja un serveur DHCP sur ce bridge :
# deux DHCP sur le meme segment se marchent dessus.
pve_macos_dhcp_enabled: true
pve_macos_dhcp_interface: "{{ lab_bridge | default('vmbr1') }}"
pve_macos_dhcp_range_start: 10.0.0.200
pve_macos_dhcp_range_end: 10.0.0.250
pve_macos_dhcp_netmask: 255.255.255.0
pve_macos_dhcp_lease_time: 12h
pve_macos_dhcp_gateway: "{{ lab_gateway | default('10.0.0.1') }}"
pve_macos_dhcp_dns: "1.1.1.1,9.9.9.9"
pve_macos_dhcp_network: "{{ lab_subnet | default('10.0.0.0/24') }}"

# --- Boot-args du noyau macOS -----------------------------------------------
# Injectes par OpenCore a chaque demarrage. Vide par defaut : un runner n'a
# personne pour lire un demarrage verbeux. Pour diagnostiquer une panique,
# rejouer le playbook avec :
#
#   -e pve_macos_boot_args='-v debug=0x100 keepsyms=1'
#
# `-v` affiche les logs du noyau, `debug=0x100` empeche le redemarrage
# automatique sur panique, `keepsyms=1` garde les symboles dans la trace.
pve_macos_boot_args: ""
