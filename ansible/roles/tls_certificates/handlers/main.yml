---
# `openresty`, pas `nginx` : nginx.service est inactive et disabled sur ce
# noeud. Recharger le mauvais service ne rechargerait rien -- ou pire,
# demarrerait un second serveur en conflit sur les ports 80 et 443.
- name: reload nginx
  ansible.builtin.systemd_service:
    name: "{{ tls_certificates_service }}"
    state: reloaded
