---
# Secret partage entre l'agent (sur la VM) et l'API locale (sur le VPS). Il est
# genere et conserve sur le NOEUD -- le controleur Ansible -- au meme endroit
# que les cles WireGuard, et n'est jamais ecrit sur le VPS ni sur la VM
# autrement que dans la configuration qui en a besoin.
#
# Ces taches tournent pour les DEUX hotes du play, en deleguant au controleur :
# c'est ce qui rend le meme secret disponible des deux cotes.

- name: Creer le repertoire des secrets sur le controleur
  ansible.builtin.file:
    path: "{{ mail_antiabus_cs_secret_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

# `creates` garantit qu'un rejeu ne regenere pas le mot de passe : le faire
# invaliderait l'enregistrement de l'agent jusqu'a ce que les deux cotes soient
# rejoues ensemble.
- name: Generer le mot de passe de l'agent si absent
  ansible.builtin.shell:
    cmd: "umask 077 && head -c 32 /dev/urandom | base64 | tr -d '=+/' | cut -c1-32 > {{ mail_antiabus_cs_password_file }}"
    creates: "{{ mail_antiabus_cs_password_file }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Relire le mot de passe de l'agent
  ansible.builtin.slurp:
    src: "{{ mail_antiabus_cs_password_file }}"
  delegate_to: localhost
  become: false
  register: mail_antiabus_cs_pw_raw
  no_log: true

- name: Memoriser le mot de passe de l'agent
  ansible.builtin.set_fact:
    mail_antiabus_cs_password: "{{ mail_antiabus_cs_pw_raw.content | b64decode | trim }}"
  no_log: true
