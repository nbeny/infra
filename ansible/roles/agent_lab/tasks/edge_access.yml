---
# Sur le NOEUD : lecture du log d'acces de l'edge par la VM agent-lab.
#
# Utilisateur dedie, pas root : membre de `adm` (proprietaire de groupe des
# logs nginx), cle bridee par `restrict` + `from=` + commande forcee. Meme si
# la VM etait compromise, cette cle ne donne qu'un `cat` du log.
#
# Variables attendues : agent_lab_pubkey (fait du play agent_nodes) et
# agent_lab_ip.

- name: Creer l'utilisateur de lecture du log edge
  ansible.builtin.user:
    name: "{{ agent_lab_edge_user }}"
    system: true
    shell: /bin/sh
    home: "/var/lib/{{ agent_lab_edge_user }}"
    create_home: true
    groups: [adm]
    password: "!"

- name: Poser la commande forcee
  ansible.builtin.template:
    src: agent-lab-edge-log.sh.j2
    dest: /usr/local/bin/agent-lab-edge-log
    owner: root
    group: root
    mode: "0755"

- name: Autoriser la cle de la VM agent-lab, bridee
  ansible.posix.authorized_key:
    user: "{{ agent_lab_edge_user }}"
    key: "{{ agent_lab_pubkey }}"
    key_options: 'restrict,from="{{ agent_lab_ip }}",command="/usr/local/bin/agent-lab-edge-log"'
    exclusive: true
