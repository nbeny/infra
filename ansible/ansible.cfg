[defaults]
inventory            = inventory
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
deprecation_warnings = False
forks                = 10
timeout              = 30
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = facts_cache
fact_caching_timeout  = 3600

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
