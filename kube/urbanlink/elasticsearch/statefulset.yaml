apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: urbanconnect
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # ES exige vm.max_map_count >= 262144. À défaut d'un sysctl posé au niveau
      # du nœud, cet initContainer privilégié le fixe au boot du pod. Si le nœud
      # est déjà configuré (DaemonSet sysctl / node tuning), retirer ce bloc.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            # Mono-nœud (mirroir du docker-compose 10000) — pas de cluster ES
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: ELASTICSEARCH_PASSWORD
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -s -u elastic:$ELASTIC_PASSWORD http://localhost:9200/_cluster/health
                  | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          # ⚠️ **Une sonde HTTP nue ne peut PAS interroger un ES sécurisé.**
          # C'était `httpGet: / :9200`, et `xpack.security.enabled` vaut "true"
          # deux lignes plus haut : un GET non authentifié reçoit **401**, que
          # Kubernetes compte comme un échec au même titre qu'un port fermé.
          # Kubelet tuait donc le conteneur toutes les deux minutes — 168 échecs
          # relevés sur la VM `urbanlink` — sans que rien ne soit en panne : ES
          # démarrait, passait `GREEN`, puis recevait SIGTERM.
          #
          # `httpGet` n'a pas de moyen de s'authentifier depuis un Secret (ses
          # `httpHeaders` sont des littéraux : il faudrait écrire le base64 du
          # mot de passe en clair dans le manifeste). On passe donc en `exec`,
          # qui lit `$ELASTIC_PASSWORD` de l'environnement — exactement ce que
          # fait déjà la sonde de disponibilité juste au-dessus.
          #
          # ⚠️ La vivacité vise `/` et non `_cluster/health` : elle répond à
          # « le processus est-il vivant ? », pas « le cluster est-il sain ? ».
          # Un ES qui passe `RED` doit sortir du Service, pas être redémarré —
          # c'est le rôle de la disponibilité, et les redémarrer aggraverait le
          # cas au lieu de le réparer.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -sf -u elastic:$ELASTIC_PASSWORD http://localhost:9200/ >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
