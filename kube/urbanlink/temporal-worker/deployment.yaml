apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: urbanconnect
  labels:
    app: temporal-worker
spec:
  # Process dédié exécutant les workflows + activités Temporal. Doit rester en
  # cohérence avec le backend (SCHEDULER_BACKEND=temporal) sinon double-exécution
  # des crons. Un seul réplica suffit (Temporal répartit les tasks ; scaler au
  # besoin, les workers sont stateless).
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
    spec:
      containers:
        - name: temporal-worker
          # ⚠️ Image glibc (Debian) dédiée : @temporalio/worker embarque un module
          # natif (core-bridge) incompatible avec musl → NE PAS réutiliser l'image
          # backend prod (Alpine). À construire depuis ./backTs sur base node:20-slim
          # (cf. target à ajouter au Dockerfile) et pousser sous ce tag.
          image: urbanconnect-temporal-worker:prod
          # En prod, remplacer par le registry : registry.urbanconnect.fr/temporal-worker:TAG
          command:
            - sh
            - -c
            - npx prisma generate && npm run temporal:worker:nest
          env:
            - name: NODE_ENV
              value: production
            # Rôle worker : désactive les consumers Kafka (les events restent à l'API)
            - name: APP_ROLE
              value: worker
            # Doit être cohérent avec le backend (sinon double-exécution cron)
            - name: SCHEDULER_BACKEND
              value: temporal
            - name: ASYNC_BACKEND
              value: kafka
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DATABASE_URL
            # Redis
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_URL
            # Kafka (le worker ne consomme pas mais AppModule provisionne le producer)
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: urbanconnect-temporal-worker
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
            # Temporal
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            # --- Traces et journaux OTLP ---------------------------------
            # Meme raison que sur le backend (voir le commentaire la-bas), avec
            # un argument de plus : TOUS les mouvements d'argent pilotes par un
            # balayage tournent ICI -- rapprochement nocturne, versements,
            # execution d'un accord de litige. Un cron qui echoue a mi-parcours
            # ne laisse aujourd'hui qu'une ligne de journal ; une trace dit
            # laquelle des activites a rompu.
            #
            # ⚠️ Cote code, `worker-nest.main.ts` importe `../tracing` en TOUTE
            # PREMIERE ligne. Sans cet import la variable ne servirait a rien --
            # et place apres `AppModule`, les instrumentations arriveraient trop
            # tard pour `pg`, `ioredis` et `kafkajs`.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.urbanconnect.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: urbanconnect-temporal-worker
            - name: TEMPORAL_TASK_QUEUE
              value: urbanconnect
            # Kratos (AppModule bootstrap complet)
            - name: KRATOS_PUBLIC_URL
              value: http://kratos:4433
            - name: KRATOS_ADMIN_URL
              value: http://kratos:4434
            - name: KRATOS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_WEBHOOK_SECRET
            # MinIO / S3
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_BUCKET_NAME
            - name: S3_REGION
              value: eu-west-3
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            # Nominatim
            - name: NOMINATIM_INTERNAL_URL
              value: http://nominatim:8080
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_EXPIRATION
            - name: FRONTEND_URL
              value: "https://urbanlink.fr"
            # Stripe
            # ⚠️ **TEMPORAIRE — à retirer dès que l'image portant le nouveau
            # défaut (20000) est déployée.** Le code avait 1500, ce qui refusait
            # `searchArtefacts` (2 320, et 11 600 à limit=100) et
            # `userArtefacts` (5 200) : la recherche, la carte et la vitrine
            # vendeur rendaient « Erreur de chargement » en production.
            # Posée ici pour rétablir le service en deux minutes au lieu
            # d'attendre une construction d'image. Une fois l'image livrée,
            # cette ligne fait doublon avec le défaut du code — la retirer,
            # sinon deux endroits décideront de la même valeur.
            - name: GRAPHQL_MAX_COMPLEXITY
              value: "20000"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_SECRET_KEY
            # ⚠️ **Sans elle, Stripe Connect tourne en MOCK en production.**
            # `stripe-connect.service.ts` bascule en mode fictif dès que la clé
            # est vide — avec un simple `logger.warn`, jamais une erreur. Le KYC
            # vendeur produit alors des comptes `acct_mock_…`, et le balayage de
            # versement échoue sur « No such destination » sans que rien ne le
            # signale. Elle manquait ici depuis toujours : le mode test ne la
            # réclamait pas, le dev la lisant depuis `backTs/.env`.
            #
            # Même valeur que `STRIPE_SECRET_KEY` : un seul compte Stripe, avec
            # Connect activé dessus (vérifié en live le 2026-09-06).
            - name: STRIPE_CONNECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_SECRET_KEY
            # Instant à partir duquel la plateforme ENTIERCE les fonds au lieu
            # de les router vers le vendeur à la capture. Une vente antérieure
            # se rembourse par `reverse_transfer`, une postérieure par
            # `transfers.createReversal` : le mauvais geste échoue en silence.
            #
            # Date volontairement ANTÉRIEURE à toute vente live : il n'existe
            # aucun paiement en mode live avant la bascule, donc aucune vente
            # ne peut légitimement relever du régime pré-entiercement. Trop
            # tard aurait produit des fonds orphelins que rien ne signale ;
            # trop tôt, ici, ne peut rien produire du tout.
            - name: ESCROW_EPOCH
              value: "2026-09-06T00:00:00.000Z"
            - name: STRIPE_CONNECT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_WEBHOOK_SECRET
            # Mêmes price IDs que le backend (mode LIVE), et c'est le point : le worker
            # démarre sur `AppModule` (`temporal:worker:nest`), il instancie donc
            # `SubscriptionService` lui aussi. Aucune activité ne le sollicite
            # aujourd'hui — mais la divergence Stripe backend/worker est un défaut
            # déjà payé ici (le worker a tourné en mode fictif pendant que le
            # backend parlait au vrai Stripe, sans une erreur). Une activité qui
            # appellerait `getMySubscription` sans ces IDs ne mapperait `priceId`
            # sur aucun plan, et `syncFromStripe` remettrait à zéro les boosts
            # d'un abonné à jour de ses paiements.
            - name: STRIPE_PRICE_STARTER_ID
              value: "price_1UChBkKqEapb7zc8Ai3KMKl7"
            - name: STRIPE_PRICE_PREMIUM_ID
              value: "price_1UChBkKqEapb7zc8iaNahW4f"
            - name: STRIPE_PRICE_ENTERPRISE_ID
              value: "price_1UChBlKqEapb7zc8lzHXgrXb"
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_SECRET
            # Elasticsearch — le worker exécute le cron nocturne de réindexation
            # (SearchReindexService, anti-drift 03:00 UTC) → accès ES requis.
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: ELASTICSEARCH_PASSWORD
            - name: SEARCH_ENGINE
              value: elasticsearch
            # ================================================================
            #  ⚠️ LE WORKER EST LA MEME APPLICATION QUE LE BACKEND
            # ----------------------------------------------------------------
            # Meme image, meme `AppModule`, autre point d'entree. Il instancie
            # donc les MEMES services, et subit les MEMES gardes de demarrage.
            # Son environnement comptait 16 variables de moins que celui du
            # backend, et il mourait sur
            #   « SENDCLOUD_WEBHOOK_SECRET is required in production.
            #     Refusing to start. »
            # -- un garde pose par un module dont le worker n'utilise pourtant
            # aucune route HTTP, mais qu'il charge quand meme.
            #
            # ⚠️ Ce n'est pas qu'une question de demarrage : **tous les
            # mouvements d'argent pilotes par un balayage tournent ici**
            # (rapprochement nocturne, execution d'un accord de litige,
            # versements). Un worker sans identifiants Stripe ou Sendcloud
            # ecrirait en base des remboursements qui ne partent nulle part,
            # sans jamais lever d'erreur.
            #
            # Regle : toute variable ajoutee au backend et lue par un service
            # partage doit etre ajoutee ici aussi.
            # ================================================================
            - name: SENDCLOUD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_WEBHOOK_SECRET
            - name: SENDCLOUD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_PUBLIC_KEY
            - name: SENDCLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: SMSAPI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_TOKEN
            - name: SMSAPI_SENDER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_SENDER
            - name: KLIPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KLIPY_API_KEY
            # ── Fournisseurs de dropshipping ─────────────────────────────
            # ⚠️ **Le NOM vit ici, la valeur dans `secrets.env`** (ignoré par
            # git) puis dans le Secret `urbanconnect-secrets` que l'amorçage
            # Ansible pose. Argo CD ne peut PAS créer ce Secret — il n'applique
            # que la sortie de `kustomize build`.
            #
            # ⚠️ **Declarees dans le backend ET dans le worker Temporal.** Le
            # connecteur travaille des deux cotes : l'API lit le stock, le
            # worker passe les commandes et balaie le catalogue. Dans un seul
            # des deux, un cote fonctionne et l'autre se croit non configure —
            # SANS erreur. C'est le piege vecu avec `STRIPE_SECRET_KEY`, qui
            # faisait tourner le worker en mode simule pendant que le backend
            # parlait au vrai Stripe.
            #
            # ⚠️ `optional: true` : vide = connecteur inactif, et c'est un etat
            # de marche legitime (aucun catalogue importe, aucune commande
            # envoyee). Sans ce drapeau, le pod refuserait de demarrer tant que
            # la cle n'est pas posee — un arret de service pour une integration
            # qu'on n'a pas encore branchee.
            - name: CJ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: CJ_API_KEY
                  optional: true
            - name: MATTERHORN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MATTERHORN_API_KEY
                  optional: true
            - name: VIDAXL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: VIDAXL_API_KEY
                  optional: true
            # Le worker compose des URLs de fichiers dans ses notifications ;
            # sans ceci elles designeraient `localhost:9000`.
            - name: MINIO_PUBLIC_URL
              value: https://urbanlink.fr/api/minio
            # ── Import de CV par agent ─────────────────────────────────
            #
            # ⚠️ **REQUISE, sinon le backend ne DÉMARRE PAS.** `cv-import.module`
            # refuse de se construire sans elle : « CV_AGENT_PROVIDER doit être
            # définie ». Absente lors de la livraison du module le 2026-09-14,
            # elle a mis backend et temporal-worker en CrashLoopBackOff — le
            # site n'est resté debout que parce que le déploiement roulant a
            # gardé les pods précédents.
            #
            # ⚠️ **`opencode` et NON `fake`**, et ce n'est pas un détail : le
            # module documente que retomber sur `fake` ferait tourner de
            # l'extraction factice en production, « remplissant les profils de
            # rien, sans qu'aucune alerte ne se déclenche ». `opencode` valide
            # sa configuration à l'USAGE (`readConfig` dans `extract`), pas au
            # démarrage : tant que `CV_AGENT_COMMAND` et `AI_WORKSPACE_DIR` ne
            # sont pas provisionnés, un import échoue clairement au lieu de
            # fabriquer du faux.
            - name: CV_AGENT_PROVIDER
              value: opencode
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
