apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: urbanconnect
  labels:
    app: kratos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kratos
  template:
    metadata:
      labels:
        app: kratos
    spec:
      containers:
        - name: kratos
          # ⚠️ EPINGLE, et ce n'est pas un detail de version comme un autre.
          #
          # `:latest` change de VERSION a chaque pull, sans qu'aucun fichier de
          # ce depot ne bouge -- Argo affiche "Synced" alors que le binaire qui
          # tourne a change sous ses pieds. Une bascule de version majeure de
          # Kratos change la semantique du cookie de session, la verification
          # CSRF, ET le schema de sa base -- trois choses qui ne se remarquent
          # PAS au demarrage. Le symptome n'est jamais "Kratos refuse de
          # demarrer" : c'est "plus personne ne peut se connecter", un matin,
          # sans le moindre changement applicatif visible.
          #
          # Mesure sur l'environnement de DEV le 2026-09-05 (pas une hypothese) :
          # sa base Kratos avait ete migree vers les migrations de janvier 2026
          # par une image `latest` tiree entre-temps, puis le service a ete
          # repointe sur `v1.3.1` (migrations d'avril 2024, plus ancien que ce
          # que la base portait deja) -- chaque connexion repondait 500,
          # `identities.external_id` present en base mais inconnu du binaire,
          # `session_devices.identity_id` NOT NULL et jamais peuplee par ce
          # binaire-la. Le retablissement a exige de reconstruire la base
          # d'identites -- une option qui n'existe pas en production.
          #
          # ⚠️ `v26.2.0` est ce que `latest` resout AUJOURD'HUI (2026-09-05) :
          # cet epinglage FIGE la production sur ce qu'elle tire deja, il ne la
          # deplace nulle part. **C'est justement le sens inverse qui casse tout** :
          # epingler EN DESSOUS du schema deja applique en base est la panne
          # ci-dessus, pas une precaution. Avant de changer cette valeur,
          # verifier l'alignement binaire/schema :
          #
          #   kubectl -n <ns> exec deploy/kratos -- kratos version
          #   # et, cote base :  SELECT max(version) FROM schema_migration;
          #
          # ⚠️ **`kratos` et `kratos-migrate` (kratos/migrate-job.yaml) DOIVENT
          # porter le MEME tag** -- c'est le second qui pose le schema que le
          # premier suppose deja en place. Les faire diverger reproduirait
          # exactement l'incident du 2026-09-05.
          image: oryd/kratos:v26.2.0
          command:
            - kratos
            - serve
            - -c
            # Le contenu de ce fichier vient de config/<env>/kratos/ du depot
            # APPLICATIF (UrbanConnct), la ConfigMap `kratos-config` etant
            # construite depuis config/common/ plus le repertoire de
            # l'environnement. Le nom ne change pas ; seul le contenu change.
            # Cela compte : les variables d'env ci-dessous surchargent base_url
            # et cookies, mais PAS les `ui_url` -- c'est le fichier qui les
            # porte, et c'est pour ca qu'il doit exister en deux versions.
            - /etc/config/kratos/kratos.yml
            - --watch-courier
          ports:
            - containerPort: 4433
              name: public
            - containerPort: 4434
              name: admin
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_DSN
            - name: LOG_LEVEL
              value: info
            - name: DEFAULT_NETWORK_ID
              value: "00000000-0000-0000-0000-000000000000"
            - name: COURIER_SMTP_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMTP_CONNECTION_URI
            - name: COURIER_SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMTP_FROM_ADDRESS
            - name: COURIER_SMTP_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMTP_FROM_NAME
            - name: SECRETS_COOKIE
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_SECRET
            # Cle DISTINCTE de SECRETS_COOKIE : signer et chiffrer avec le
            # meme secret est une faiblesse, et les contraintes different --
            # le cipher doit faire EXACTEMENT 32 caracteres, le cookie au
            # moins 32. Une seule cle de 40 faisait echouer Kratos au
            # demarrage : "length must be <= 32, but got 40".
            - name: SECRETS_CIPHER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_CIPHER_SECRET
            # ⚠️ **Ici vivaient `GOOGLE_CLIENT_ID` et `GOOGLE_CLIENT_SECRET`,
            # et Kratos ne les lisait PAS.** Il ne prend une variable
            # d'environnement en compte que si son nom decrit un CHEMIN de sa
            # configuration ; ces deux noms n'en decrivent aucun. Elles etaient
            # donc parfaitement inertes : la configuration montee gardait
            # `client_id: CHANGE_ME.apps.googleusercontent.com`, et l'ecran
            # repondait « Impossible d'initier la connexion Google ». Mesure sur
            # le cluster — le pod voyait bien les deux variables.
            #
            # Le seul override qui fonctionne est le bloc `providers` ENTIER, en
            # JSON brut. `31-urbanlink-deploy.yml` le derive de
            # `config/<env>/kratos/kratos.yml` en y substituant les deux vrais
            # identifiants, et le depose sous la cle `KRATOS_OIDC_PROVIDERS`.
            # C'est la meme mecanique qu'en developpement
            # (`gen-google-oidc-env.mjs`), a ceci pres que la source est le
            # Secret du cluster et non un fichier pose a cote.
            #
            # ⚠️ `optional: true` : sans identifiants Google renseignes, le
            # playbook ne cree pas la cle. Sans ce drapeau, TOUT Kratos
            # refuserait de demarrer — donc l'inscription par mot de passe
            # aussi — pour une connexion tierce facultative.
            - name: SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_OIDC_PROVIDERS
                  optional: true
            - name: SELFSERVICE_DEFAULT_BROWSER_RETURN_URL
              value: "https://urbanlink.fr"
            - name: SERVE_PUBLIC_BASE_URL
              value: "https://auth.urbanlink.fr"
            - name: COOKIES_DOMAIN
              value: "urbanlink.fr"
            - name: COOKIES_SAME_SITE
              value: "Lax"
          volumeMounts:
            - name: kratos-config
              mountPath: /etc/config/kratos
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4433
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4433
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # Créer avec : kubectl create configmap kratos-config \
        #   --from-file=./kratos/ -n urbanconnect
        - name: kratos-config
          configMap:
            name: kratos-config
