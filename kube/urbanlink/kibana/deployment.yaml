apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: urbanconnect
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          ports:
            - containerPort: 5601
          env:
            # Kibana reclame l'URL par laquelle un navigateur l'atteint, et la
            # deduire lui est impossible derriere une passerelle Istio : il ne
            # voit que `kibana:5601`. Sans elle il avertit a chaque demarrage
            # (« In a production environment, it is recommended that you
            # configure server.publicBaseUrl ») et tout ce qui fabrique un lien
            # absolu -- liens courts « Share », rapports, alertes -- rend une
            # URL interne que le destinataire ne peut pas ouvrir.
            #
            # ⚠️ Doit suivre l'hote du VirtualService `uc-kibana`
            # (ingress/virtualservices.yaml). Le TLS est termine par
            # l'openresty du noeud Proxmox, d'ou `https` alors que la
            # passerelle, elle, parle en clair.
            - name: SERVER_PUBLICBASEURL
              value: https://kibana.urbanlink.fr
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KIBANA_SYSTEM_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
