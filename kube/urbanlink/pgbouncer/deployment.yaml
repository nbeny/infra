apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: urbanconnect
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 6432
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_PASSWORD
            - name: LISTEN_PORT
              value: "6432"
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_TIMEOUT
              value: "5"
            - name: SERVER_IDLE_TIMEOUT
              value: "600"
            - name: CLIENT_IDLE_TIMEOUT
              value: "600"
            - name: LOG_CONNECTIONS
              value: "0"
            - name: LOG_DISCONNECTIONS
              value: "0"
            - name: LOG_POOLER_ERRORS
              value: "1"
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: ADMIN_USERS
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
