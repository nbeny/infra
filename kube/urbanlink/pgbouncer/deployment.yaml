apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: urbanconnect
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 6432
          # Reglages de pool : ConfigMap `pgbouncer-config`, construite par
          # playbooks/31-urbanlink-deploy.yml depuis config/prod/pgbouncer/
          # du depot APPLICATIF -- le meme fichier que lit docker compose en
          # developpement, a l'environnement pres.
          #
          # ⚠️ L'image edoburu/pgbouncer GENERE son pgbouncer.ini au demarrage
          # a partir de ces variables. Elle ne lit aucun .ini monte -- c'est ce
          # qui rendait `pgbouncer/pgbouncer.ini` du depot applicatif
          # totalement inerte, alors qu'il annoncait `auth_type = trust` quand
          # le vivant disait `scram-sha-256`. Fichier supprime.
          #
          # `envFrom` est evalue AVANT `env` : les quatre identifiants
          # ci-dessous gagnent sur toute homonymie dans la ConfigMap. C'est ce
          # qui permet de versionner les reglages sans jamais y mettre un
          # secret.
          envFrom:
            - configMapRef:
                name: pgbouncer-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_PASSWORD
            # Les quinze reglages de pool qui vivaient ici (DB_HOST, DB_PORT,
            # POOL_MODE, MAX_CLIENT_CONN, DEFAULT_POOL_SIZE, AUTH_TYPE…) sont
            # partis dans config/prod/pgbouncer/pgbouncer.env. Ils dupliquaient
            # mot pour mot le bloc `environment:` du docker compose, sans
            # qu'aucun des deux ne sache que l'autre existait.
            - name: ADMIN_USERS
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
