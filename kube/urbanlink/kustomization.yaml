# Ne pas appliquer ce kustomize à la main : **Argo CD le fait**, en suivant
# `master` de ce dépôt avec `selfHeal: true` et `prune: true`. Un `apply -k`
# manuel serait annulé en moins de trois minutes.
#
# ⚠️ Corollaire : un changement ici n'a AUCUN effet tant qu'il n'est pas poussé
# sur `master`. Pour forcer la resynchronisation au lieu d'attendre le cycle :
#   kubectl -n argocd patch application urbanlink --type merge \
#     -p '{"operation":{"sync":{}}}'
#
# Ce que playbooks/31-urbanlink-deploy.yml amorce à côté, et qu'Argo ne peut
# pas reprendre :
#   1. Secret urbanconnect-secrets, depuis un secrets.env NON VERSIONNÉ.
#      Voir secrets.env.example. Le playbook refuse un fichier contenant
#      encore des CHANGE_ME.
#   2. ingress/authorization.yaml, qui doit vivre dans le namespace
#      istio-ingress alors que ce fichier force `namespace: urbanconnect`.
#
# ⚠️ **Les ConfigMaps de configuration ne sont PLUS dans cette liste**, et c'est
# le changement du 2026-09-01. Elles étaient créées par le playbook, avec deux
# conséquences : Argo affichait « Synced » alors qu'un changement de `config/`
# n'avait pas été appliqué, et modifier une ConfigMap en place ne redémarrait
# aucun pod. Elles sont désormais générées par le `configMapGenerator` en bas
# de ce fichier, depuis `config/` — voir le commentaire qui l'introduit.
#
# ⚠️ `config/` de ce dépôt est une COPIE, écrite par la CI du dépôt applicatif
# à chaque push sur `main`. La source de vérité reste `config/` d'UrbanConnct,
# à côté du docker-compose.yml qui monte les mêmes fichiers en dev — c'est ce
# qui empêche un réglage de diverger entre les deux environnements. **Ne rien y
# éditer à la main** : le `rsync --delete` de la prochaine livraison l'écrasera.
# Carte complète : config/README.md du dépôt applicatif.
#
# ⚠️ La copie est un MIROIR de `config/`, pas une sélection : elle porte aussi
# des fichiers que rien ne monte (observability/, kratos/email/, kratos/scripts/,
# nominatim/fetch-pbf.sh, kibana/build-dashboards.mjs). C'est délibéré — le
# `rsync` de la CI copie tout, et une divergence entre ce qu'il dépose et ce que
# ce fichier déclare serait une source de confusion pire que le surplus. Ce qui
# part réellement dans le cluster est ce que le `configMapGenerator` liste,
# et rien d'autre.
#
# Ingress = Istio en mode ambient. Le TLS n'est PAS terminé par la passerelle
# mais par l'openresty du nœud Proxmox, avec un certificat wildcard
# *.urbanlink.fr — voir ansible/roles/edge_urbanlink.
#
# Ordre de déploiement recommandé :
#   1. namespace → secrets
#   2. postgres (instance unique app+kratos+temporal), postgres-nominatim,
#      redis, minio, kafka, elasticsearch
#   3. pgbouncer (après postgres)
#   4. kratos-migrate (après postgres), minio-init (après minio),
#      elasticsearch-setup (après elasticsearch — fixe le mdp kibana_system)
#   5. kratos (après kratos-migrate), temporal (auto-setup après postgres)
#   6. oathkeeper (après kratos), nominatim, kafka-ui, temporal-ui,
#      kibana (après elasticsearch-setup), puis kibana-setup (après kibana —
#      il attend lui-même que le statut passe à `available`)
#   7. backend (après pgbouncer, redis, kratos, minio, kafka, temporal, elasticsearch)
#   8. temporal-worker (image glibc dédiée, cohérent SCHEDULER_BACKEND avec backend)
#      opencode (image dédiée portant `opencode` ; consomme la table
#      `cv_import_jobs`, donc après la migration du backend)
#   9. frontend (après backend)
#  10. coturn (DaemonSet hostNetwork sur nœuds publics), geoipupdate, pgadmin
#  11. ingress Istio — Gateway (les 16 hosts) puis VirtualServices, et
#      l'AuthorizationPolicy appliquée à part dans istio-ingress
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: urbanconnect

  # Foundation
  # secrets.yaml a ete retire : un Secret en clair dans un depot est une bombe
  # a retardement, et .gitignore ne couvrait que `secrets.yml` -- une lettre
  # d'ecart suffisait a le laisser passer. Le Secret `urbanconnect-secrets`
  # est desormais cree par playbooks/31-urbanlink-deploy.yml avec
  # `kubectl create secret generic --from-env-file`, depuis un secrets.env
  # non versionne. Voir kube/urbanlink/secrets.env.example.

  # Databases

  # Connection pooler

  # Cache

  # Couche async — Kafka (événementiel / fanout) + Temporal (workflows durables)

  # Recherche & feeds — Elasticsearch (index de lecture) + Kibana (exploration)

  # Object storage

  # Auth

  # Access proxy — Oathkeeper (forward-auth Kratos à l'edge)
  # oathkeeper/middleware.yaml retiré : c'était un Middleware Traefik.
  # Son équivalent est l'AuthorizationPolicy de ingress/authorization.yaml.

  # Geocoding

  # GeoIP

  # Admin tools

  # Application
  # ⚠️ Le Job de migration doit rester liste ICI : depuis qu'il existe, les
  # replicas du backend ne migrent plus. L'oublier ferait demarrer le backend
  # sur un schema perime sans rien dire. Voir l'en-tete du fichier.

  # WebRTC (appels) — STUN/TURN sur les nœuds publics (hostNetwork)

  # Edge security — CrowdSec
  #   crowdsec/middleware.yaml est retiré : c'était le câblage du plugin
  #   bouncer de Traefik, qui n'a pas d'équivalent portable sur Istio.
  #   CrowdSec reste actif sur le nginx du nœud Proxmox — la vraie porte
  #   d'entrée Internet. Détail et justification dans
  #   ingress/authorization.yaml.

  # Ingress — Istio (Gateway + VirtualService + AuthorizationPolicy)
  #   Remplace le pattern master/children de Traefik :
  #     Gateway             <- entryPoints + TLSOption
  #     VirtualService      <- IngressRoute (routage seul)
  #     AuthorizationPolicy <- Middleware (politique seule)
  #
  #   Les manifests Traefik (master.yaml, child-public.yaml,
  #   child-internal.yaml) ont ete supprimes : ils n'etaient plus appliques
  #   et leurs CRD ne sont meme plus installees sur le cluster.
  #
  #   ingress/authorization.yaml n'est PAS liste ici : le champ
  #   `namespace: urbanconnect` en tete de ce fichier s'applique a toutes les
  #   ressources, or l'AuthorizationPolicy doit vivre dans `istio-ingress`,
  #   aupres des pods de la passerelle -- c'est le seul endroit ou l'ext_authz
  #   L7 s'applique en mode ambient (ztunnel ne fait que du L4). Elle est
  #   appliquee separement par playbooks/31-urbanlink-deploy.yml.
# ⚠️ Ces deux Services n'existent QUE pour rendre les metriques des workers
# decouvrables : un ServiceMonitor decouvre les ENDPOINTS d'un Service, jamais
# les pods d'un Deployment. Sans eux, cinq metriques d'argent et d'import de CV
# s'ecrivaient dans un processus que personne ne scrapait.
resources:
- namespace.yaml
- postgres/statefulset.yaml
- postgres/service.yaml
- postgres-nominatim/statefulset.yaml
- postgres-nominatim/service.yaml
- pgbouncer/deployment.yaml
- pgbouncer/service.yaml
- redis/statefulset.yaml
- redis/service.yaml
- kafka/statefulset.yaml
- kafka/service.yaml
- kafka-ui/deployment.yaml
- kafka-ui/service.yaml
- temporal/deployment.yaml
- temporal/service.yaml
- temporal-ui/deployment.yaml
- temporal-ui/service.yaml
- elasticsearch/statefulset.yaml
- elasticsearch/service.yaml
- elasticsearch/setup-job.yaml
- kibana/deployment.yaml
- kibana/service.yaml
- kibana/setup-job.yaml
- minio/statefulset.yaml
- minio/service.yaml
- minio/init-job.yaml
- imgproxy/deployment.yaml
- imgproxy/service.yaml
- kratos/migrate-job.yaml
- kratos/deployment.yaml
- kratos/service.yaml
- oathkeeper/configmap.yaml
- oathkeeper/deployment.yaml
- oathkeeper/service.yaml
- nominatim/statefulset.yaml
- nominatim/service.yaml
- geoipupdate/pvc.yaml
- geoipupdate/cronjob.yaml
- pgadmin/deployment.yaml
- pgadmin/service.yaml
- backend/migrate-job.yaml
- backend/deployment.yaml
- backend/service.yaml
- backend/hpa.yaml
- temporal-worker/deployment.yaml
- temporal-worker/service.yaml
- opencode/serviceaccount.yaml
- opencode/authorization.yaml
- opencode/deployment.yaml
- opencode/service.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- frontend/hpa.yaml
- coturn/daemonset.yaml
- ingress/gateway.yaml
- ingress/virtualservices.yaml
- observability/otel-collector/deployment.yaml
- observability/otel-collector/service.yaml
- observability/tempo/statefulset.yaml
- observability/tempo/service.yaml
- observability/loki/statefulset.yaml
- observability/loki/service.yaml
- observability/prometheus-alias.yaml
- observability/ingress/grafana-virtualservice.yaml
- observability/ingress/alertmanager-virtualservice.yaml
- observability/prometheus-alerts.yaml
- observability/servicemonitors.yaml

  # Observability — OTel Collector + Tempo + Loki + Prometheus (kube-stack)
  #   Le kube-prometheus-stack (Prometheus, Alertmanager, Grafana) est deploie
  #   par Ansible (helm_release), PAS par Argo (chart externes/non-Kustomizable).
  #   OTel, Tempo et Loki vivent ici, a cote des configs observability-config.
  #   prometheus-alias.yaml expose kube-prometheus-stack sous l'ancien nom
  #   `prometheus.urbanconnect.svc.cluster.local:9090` (compat datasources).
  #   prometheus-alerts.yaml = PrometheusRule selectionne par kube-stack.
  #   ingress/grafana-virtualservice.yaml = expose Grafana (tier internal).

# ============================================================================
#  ConfigMaps de configuration applicative
# ============================================================================
# Les fichiers de config/ viennent du depot APPLICATIF (UrbanConnct), a cote
# du docker-compose.yml qui monte les memes en dev. C'est ce qui empeche un
# reglage de diverger entre les deux environnements -- il n'existe qu'une fois.
# La CI de ce depot-la les recopie ici a chaque livraison sur main.
#
# ⚠️ **Le suffixe de hash est le mecanisme, pas un effet de bord.** Le nom
# genere depend du CONTENU (kratos-config-7f3d9k) : changer un fichier change
# le nom, kustomize reecrit toutes les references dans le meme build, la spec
# des Deployments change, et les pods redemarrent. C'est la seule facon
# d'obtenir un redemarrage automatique -- modifier une ConfigMap en place n'en
# provoque aucun.
#
# ⚠️ Consequence a connaitre AVANT de toucher a ces fichiers : un changement
# dans postgres-init redemarre Postgres, un changement dans nominatim.env
# redemarre Nominatim (33 Go d'OSM importes, le PVC est conserve mais le
# redemarrage est long).
#
# ⚠️ **`envs:` et non `files:` pour les deux fichiers d'environnement.**
# pgbouncer et nominatim les consomment par `envFrom: configMapRef:`, qui
# attend une ConfigMap dont CHAQUE CLE est une variable. `files:` produirait
# une cle unique nommee comme le fichier, contenant tout son texte : le pod
# echoue alors sur une variable absente alors qu'elle figure bien dedans.
# Mesure sur la VM : pgbouncer refusait de demarrer sur « DB_HOST: Setup
# pgbouncer config error! » avec DB_HOST=postgres present dans le fichier.
#
# ⚠️ **Liste explicite, kustomize n'acceptant pas de repertoire.** Deux ecarts
# assumes par rapport a ce que produisait 31-urbanlink-deploy.yml, tous deux
# sans effet fonctionnel :
#   - CLAUDE.md n'entre plus dans kratos-config. Il y etait par accident,
#     `--from-file=<repertoire>` prenant tout ce qu'il trouve.
#   - Les sous-repertoires common/kratos/{email,email-templates,scripts}
#     restent exclus. Ils l'etaient deja : --from-file ne recurse pas.
# Une garde cote depot applicatif echouera si un fichier apparait dans config/
# sans etre liste ici -- sans elle, l'ajout d'un fichier le laisserait
# silencieusement hors du cluster.
  # ⚠️ `options.labels` et NON `labels` a la racine du generateur. Le champ
  # court n'existe que depuis kustomize v5.5 ; le repo-server d'Argo CD
  # embarque la v5.4.3 (mesure le 2026-09-01) et refuse TOUT le build :
  #   « invalid Kustomization: json: unknown field "labels" ».
  # Ce n'est pas une erreur partielle -- l'Application entiere passe en
  # ComparisonError et plus RIEN ne se deploie. `options.labels` est accepte
  # par les deux versions, il n'y a donc aucune raison de prendre le risque.
  # Meme raison que ci-dessus : `options.labels`, pas `labels`.
# Tableau de bord de la MESSAGERIE, volontairement separe des precedents :
# ceux-ci viennent du depot APPLICATIF via la CI (rsync de config/), tandis que
# la messagerie est un objet d'infrastructure. Le poser dans config/ le ferait
# dependre d'une CI qui ne le concerne pas -- et qui est aujourd'hui rouge.
# ⚠️ RETIRER UN FICHIER D'ICI NE SUFFIT PAS A FAIRE DISPARAITRE LE TABLEAU.
# Le provisionnement Grafana par sidecar est ADDITIF : il insere et met a jour,
# il ne supprime pas ce qui a ete pose auparavant. Les quatre entrees
# renommees ci-dessous (01-backend, 02-platform, 03-mesh, 04-observability)
# gardent leurs `uid` d'origine, donc Grafana les met a jour au lieu d'en
# creer de nouvelles -- c'est voulu : un `uid` est ce que portent les liens et
# les signets. Verifier apres deploiement qu'il y a bien SIX entrees et pas
# dix.
    # 239 Ko de JSON : en client-side apply, l'annotation last-applied depasse
    # la limite de 256 Kio et la synchro Argo ENTIERE echoue (constate le
    # 2026-10-08). L'apply cote serveur n'ecrit pas cette annotation.
configMapGenerator:
- files:
  - config/common/kratos/identity.schema.json
  - config/common/kratos/oidc.google.jsonnet
  - config/prod/kratos/kratos.yml
  name: kratos-config
- files:
  - config/common/postgres-init/create-databases.sh
  - config/common/postgres-init/init-db.sql
  name: postgres-init
- envs:
  - config/prod/pgbouncer/pgbouncer.env
  name: pgbouncer-config
- envs:
  - config/prod/nominatim/nominatim.env
  name: nominatim-config
- envs:
  - config/common/imgproxy/imgproxy.env
  name: imgproxy-config
- files:
  - config/common/kibana/dashboards.ndjson
  name: kibana-dashboards
- files:
  - config/prod/observability/otel-collector-config.yaml
  - config/common/observability/tempo.yaml
  - config/common/observability/loki.yaml
  name: observability-config
- files:
  - config/prod/observability/grafana-dashboards/00-overview.json
  - config/prod/observability/grafana-dashboards/01-produit.json
  - config/prod/observability/grafana-dashboards/02-ce-qui-casse.json
  - config/prod/observability/grafana-dashboards/03-backend.json
  - config/prod/observability/grafana-dashboards/04-plateforme.json
  - config/prod/observability/grafana-dashboards/05-maillage-et-chaine.json
  name: grafana-dashboards
  options:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
    labels:
      grafana_dashboard: "1"
- files:
  - observability/dashboards/05-messagerie.json
  name: grafana-dashboard-messagerie
  options:
    labels:
      grafana_dashboard: "1"
- files:
  - config/prod/observability/grafana-datasources.yaml
  name: grafana-datasources
  options:
    labels:
      grafana_datasource: "1"
  # ⚠️ Tag DIFFERENT des trois autres, et volontairement : cette image n'existe
  # qu'a partir de `e2ceada8` du depot applicatif, le commit qui l'a ajoutee a la
  # matrice de construction de la CI. Les tags anterieurs (`sha-91c78863` et
  # avant) n'ont jamais ete construits pour elle -- les y pointer donnerait un
  # ImagePullBackOff.
  #
  # ⚠️ NON VERIFIE depuis le poste de developpement : le registre `10.0.0.130:5000`
  # n'est joignable que depuis le lab. Si la CI de `e2ceada8` a echoue, ce pod
  # restera en ImagePullBackOff -- visible dans Argo, sans effet sur les autres
  # services (un seul replica, aucun PDB, aucune dependance de l'API a ce worker).
  # Verification : `curl http://10.0.0.130:5000/v2/urbanconnect-opencode/tags/list`
  #
  # La prochaine livraison applicative realignera les QUATRE images sur le meme
  # sha : cette divergence est transitoire par construction.
images:
- name: urbanconnect-backend
  newName: 10.0.0.130:5000/urbanconnect-backend
  newTag: sha-ad18a504
- name: urbanconnect-frontend
  newName: 10.0.0.130:5000/urbanconnect-frontend
  newTag: sha-ad18a504
- name: urbanconnect-opencode
  newName: 10.0.0.130:5000/urbanconnect-opencode
  newTag: sha-ad18a504
- name: urbanconnect-temporal-worker
  newName: 10.0.0.130:5000/urbanconnect-temporal-worker
  newTag: sha-ad18a504
