apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: urbanconnect
  labels:
    app: temporal
spec:
  replicas: 1
  # Recreate : le frontend Temporal ne doit pas coexister en double pendant l'auto-setup.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      # Attendre que postgres accepte les connexions avant l'auto-setup.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Attente de postgres..."
                sleep 2
              done
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2
          ports:
            - containerPort: 7233
              name: grpc
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: TEMPORAL_DB_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: TEMPORAL_DB_PASSWORD
            # Crée la namespace `default` au premier boot (idempotent).
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - temporal operator cluster health --address temporal:7233
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - temporal operator cluster health --address temporal:7233
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
