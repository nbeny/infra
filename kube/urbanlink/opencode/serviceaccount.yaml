# ============================================================================
#  opencode -- identite propre du pod qui lance l'agent
# ----------------------------------------------------------------------------
#  Jusqu'ici tous les pods du namespace tournaient sous `default`, donc sous la
#  MEME identite SPIFFE dans le maillage ambient : aucune AuthorizationPolicy
#  ne pouvait distinguer le pod opencode du backend. C'est cette identite qui
#  rend `authorization.yaml` possible.
#
#  `automountServiceAccountToken: false` : ce pod n'appelle pas l'API
#  Kubernetes, et un agent detourne n'a aucune raison de trouver un jeton du
#  cluster dans /var/run/secrets.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode
  namespace: urbanconnect
  labels:
    app: opencode
automountServiceAccountToken: false
