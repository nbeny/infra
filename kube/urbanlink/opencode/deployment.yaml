# ============================================================================
#  opencode -- les instances opencode (import de document, annonce par IA,
#  traduction des fiches fournisseurs)
# ----------------------------------------------------------------------------
#  Troisieme point d'entree du backend, apres l'API et le worker Temporal :
#  meme code, meme AppModule, autre `CMD`. Il est SEUL a lancer `opencode`, et
#  seul a reclamer la file `cv_import_jobs`.
#
#  ⚠️ **PAS de NetworkPolicy ici, et ce n'est pas un oubli.**
#
#  La specification en prevoyait une, pour interdire a l'agent de joindre
#  Postgres, Redis, MinIO et Kafka. Elle serait INERTE dans ce cluster : le CNI
#  est **flannel** (`ansible/inventory/group_vars/debian_nodes.yml`,
#  `k8s_cni: flannel`), qui n'implemente PAS `NetworkPolicy` -- l'objet est
#  accepte par l'API server et ignore par le reseau. Deployer un manifeste qui
#  ne filtre rien serait pire que de ne rien deployer.
#
#  Le namespace EST enrole dans le maillage ambient
#  (`ansible/inventory/host_vars/urbanlink.yml`, `k8s_istio_namespaces`) --
#  l'ancienne version de ce commentaire disait le contraire. D'ou
#  `authorization.yaml` : ce pod (identite `sa/opencode`) n'atteint plus l'API
#  admin de Kratos. Pour Postgres/Redis/MinIO, une politique L4 n'aide pas : le
#  worker, dans le MEME pod, en a besoin.
#
#  **Ce qui protege reellement l'agent (audit 2026-10-09) :**
#    - le bac a sable d'opencode, pose par le lanceur
#      (`common/opencode-runner/opencode-runner.ts`, `buildPermissionConfig`) :
#      pas de terminal, pas de web (sauf le releve de tarifs), aucune lecture
#      hors du repertoire du job -- `/proc/<pid du worker>/environ`, qui porte
#      tous les secrets ci-dessous, est donc hors d'atteinte ;
#    - l'environnement en LISTE BLANCHE du process `opencode` ;
#    - l'utilisateur non privilegie de l'image, sans escalade ni capacites.
#  ⚠️ L'agent tourne sous le MEME uid que le worker : sans le bac a sable, la
#  liste blanche ne protegerait rien (voir `backTs/Dockerfile.opencode`).
#
#  **Pour filtrer la SORTIE de ce pod** (Internet public seulement, aucune
#  plage privee hors des services dont le worker a besoin), il faudrait un CNI
#  qui applique `NetworkPolicy` : passer `k8s_cni` a `cilium` (la variable
#  l'admet deja). Hors de ce lot, il touche tout le cluster.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: urbanconnect
  labels:
    app: opencode
spec:
  # Process dedie qui lance `opencode` sur les CV televerses. UN SEUL replica,
  # et c'est une decision, pas un defaut de dimensionnement : la file est servie
  # par `FOR UPDATE SKIP LOCKED`, donc plusieurs replicas seraient corrects --
  # mais chaque agent tient plusieurs centaines de Mo et un coeur pendant une a
  # trois minutes, sur une machine dont la RAM est deja surengagee. Monter a
  # deux se decide en regardant `urbanconnect_cv_import_queue_depth`, pas par
  # precaution.
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      # Identite propre (cf. serviceaccount.yaml) : c'est elle que vise
      # `authorization.yaml`. Sans jeton Kubernetes monte.
      serviceAccountName: opencode
      automountServiceAccountToken: false
      containers:
        - name: opencode
          # Image DEDIEE : elle embarque le binaire `opencode` (plusieurs
          # dizaines de Mo), que l'image de l'API n'a aucune raison de porter.
          # Construite par la CI du depot applicatif depuis
          # `backTs/Dockerfile.opencode`.
          image: urbanconnect-opencode:prod
          # L'image tourne deja en `agent`, non privilegie. Sans
          # `runAsNonRoot` : l'utilisateur est cree par `useradd --system`,
          # sans uid fixe, et `runAsNonRoot` exige un `runAsUser` numerique
          # que ce depot ne peut pas connaitre. Le reste interdit a un agent
          # detourne de regagner des privileges (setuid) ou des capacites.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            # Le seul port de ce processus : `GET /metrics`. Il ne sert
            # rien d'autre -- le worker n'a aucune raison d'exposer
            # GraphQL, les televersements ou les webhooks.
            - name: metrics
              containerPort: 4002
          env:
            - name: NODE_ENV
              value: production
            # Rôle worker : désactive les consumers Kafka (les events restent à l'API)
            - name: APP_ROLE
              value: worker
            # Doit être cohérent avec le backend (sinon double-exécution cron)
            - name: SCHEDULER_BACKEND
              value: temporal
            - name: ASYNC_BACKEND
              value: kafka
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DATABASE_URL
            # Redis
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_URL
            # Kafka (le worker ne consomme pas mais AppModule provisionne le producer)
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: urbanconnect-opencode
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
            # Temporal
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            # --- Traces et journaux OTLP ---------------------------------
            # Meme raison que sur le backend (voir le commentaire la-bas), avec
            # un argument de plus : TOUS les mouvements d'argent pilotes par un
            # balayage tournent ICI -- rapprochement nocturne, versements,
            # execution d'un accord de litige. Un cron qui echoue a mi-parcours
            # ne laisse aujourd'hui qu'une ligne de journal ; une trace dit
            # laquelle des activites a rompu.
            #
            # ⚠️ Cote code, `worker-nest.main.ts` importe `../tracing` en TOUTE
            # PREMIERE ligne. Sans cet import la variable ne servirait a rien --
            # et place apres `AppModule`, les instrumentations arriveraient trop
            # tard pour `pg`, `ioredis` et `kafkajs`.
            # --- Exposition des metriques ----------------------------------
            # ⚠️ SANS CE JETON, LA COLLECTE CASSE -- et c'est le comportement
            # VOULU. `verdictAccesMetriques` (backTs, common/metrics) ferme
            # l'endpoint en 403 quand NODE_ENV=production et qu'aucun jeton
            # n'est defini : une variable oubliee doit casser la collecte,
            # visiblement et reparablement, plutot qu'exposer en silence la
            # forme interne de l'application.
            #
            # `optional: true` comme pour le backend : le Secret peut ne pas
            # porter la cle sur un environnement de bac a sable.
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: METRICS_TOKEN
                  optional: true
            - name: METRICS_PORT
              value: "4002"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.urbanconnect.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: urbanconnect-opencode
            - name: TEMPORAL_TASK_QUEUE
              value: urbanconnect
            # Kratos (AppModule bootstrap complet)
            - name: KRATOS_PUBLIC_URL
              value: http://kratos:4433
            - name: KRATOS_ADMIN_URL
              value: http://kratos:4434
            - name: KRATOS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_WEBHOOK_SECRET
            # MinIO / S3
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_BUCKET_NAME
            - name: S3_REGION
              value: eu-west-3
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            # Nominatim
            - name: NOMINATIM_INTERNAL_URL
              value: http://nominatim:8080
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_EXPIRATION
            - name: FRONTEND_URL
              value: "https://urbanlink.fr"
            # Stripe
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_SECRET_KEY
            # ⚠️ **Sans elle, Stripe Connect tourne en MOCK en production.**
            # `stripe-connect.service.ts` bascule en mode fictif dès que la clé
            # est vide — avec un simple `logger.warn`, jamais une erreur. Le KYC
            # vendeur produit alors des comptes `acct_mock_…`, et le balayage de
            # versement échoue sur « No such destination » sans que rien ne le
            # signale. Elle manquait ici depuis toujours : le mode test ne la
            # réclamait pas, le dev la lisant depuis `backTs/.env`.
            #
            # Même valeur que `STRIPE_SECRET_KEY` : un seul compte Stripe, avec
            # Connect activé dessus (vérifié en live le 2026-09-06).
            - name: STRIPE_CONNECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_SECRET_KEY
            # Instant à partir duquel la plateforme ENTIERCE les fonds au lieu
            # de les router vers le vendeur à la capture. Une vente antérieure
            # se rembourse par `reverse_transfer`, une postérieure par
            # `transfers.createReversal` : le mauvais geste échoue en silence.
            #
            # Date volontairement ANTÉRIEURE à toute vente live : il n'existe
            # aucun paiement en mode live avant la bascule, donc aucune vente
            # ne peut légitimement relever du régime pré-entiercement. Trop
            # tard aurait produit des fonds orphelins que rien ne signale ;
            # trop tôt, ici, ne peut rien produire du tout.
            - name: ESCROW_EPOCH
              value: "2026-09-06T00:00:00.000Z"
            - name: STRIPE_CONNECT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_WEBHOOK_SECRET
            # Mêmes price IDs que le backend (mode LIVE), et c'est le point : le worker
            # démarre sur `AppModule` (`temporal:worker:nest`), il instancie donc
            # `SubscriptionService` lui aussi. Aucune activité ne le sollicite
            # aujourd'hui — mais la divergence Stripe backend/worker est un défaut
            # déjà payé ici (le worker a tourné en mode fictif pendant que le
            # backend parlait au vrai Stripe, sans une erreur). Une activité qui
            # appellerait `getMySubscription` sans ces IDs ne mapperait `priceId`
            # sur aucun plan, et `syncFromStripe` remettrait à zéro les boosts
            # d'un abonné à jour de ses paiements.
            - name: STRIPE_PRICE_STARTER_ID
              value: "price_1UChBkKqEapb7zc8Ai3KMKl7"
            - name: STRIPE_PRICE_PREMIUM_ID
              value: "price_1UChBkKqEapb7zc8iaNahW4f"
            - name: STRIPE_PRICE_ENTERPRISE_ID
              value: "price_1UChBlKqEapb7zc8lzHXgrXb"
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_SECRET
            # Elasticsearch — le worker exécute le cron nocturne de réindexation
            # (SearchReindexService, anti-drift 03:00 UTC) → accès ES requis.
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: ELASTICSEARCH_PASSWORD
            - name: SEARCH_ENGINE
              value: elasticsearch
            # ================================================================
            #  ⚠️ LE WORKER EST LA MEME APPLICATION QUE LE BACKEND
            # ----------------------------------------------------------------
            # Meme image, meme `AppModule`, autre point d'entree. Il instancie
            # donc les MEMES services, et subit les MEMES gardes de demarrage.
            # Son environnement comptait 16 variables de moins que celui du
            # backend, et il mourait sur
            #   « SENDCLOUD_WEBHOOK_SECRET is required in production.
            #     Refusing to start. »
            # -- un garde pose par un module dont le worker n'utilise pourtant
            # aucune route HTTP, mais qu'il charge quand meme.
            #
            # ⚠️ Ce n'est pas qu'une question de demarrage : **tous les
            # mouvements d'argent pilotes par un balayage tournent ici**
            # (rapprochement nocturne, execution d'un accord de litige,
            # versements). Un worker sans identifiants Stripe ou Sendcloud
            # ecrirait en base des remboursements qui ne partent nulle part,
            # sans jamais lever d'erreur.
            #
            # Regle : toute variable ajoutee au backend et lue par un service
            # partage doit etre ajoutee ici aussi.
            # ================================================================
            - name: SENDCLOUD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_WEBHOOK_SECRET
            - name: SENDCLOUD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_PUBLIC_KEY
            - name: SENDCLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: SMSAPI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_TOKEN
            - name: SMSAPI_SENDER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_SENDER
            - name: KLIPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KLIPY_API_KEY
            # Le worker compose des URLs de fichiers dans ses notifications ;
            # sans ceci elles designeraient `localhost:9000`.
            - name: MINIO_PUBLIC_URL
              value: https://urbanlink.fr/api/minio
            # ================================================================
            #  L'agent d'import de CV
            # ----------------------------------------------------------------
            - name: CV_AGENT_PROVIDER
              value: opencode
            - name: OPENCODE_COMMAND
              value: opencode
            - name: OPENCODE_ARGS
              value: '["run","-m","{model}"]'
            # Modele LIBRE : aucune accreditation n'est necessaire pour les
            # `opencode/*-free` (verifie dans cancerWeb/docs/ai-cli-smoke-test.md,
            # opencode 1.18.18). C'est ce qui permet de deployer ce worker sans
            # ajouter un secret au cluster.
            # ⚠️ `mimo-v2.5-free` a DISPARU du catalogue opencode : l'import de CV
            # echouait avec lui. `mimo-v2.6-flash-free` verifie DEPUIS CE POD
            # (opencode 1.18.25) le 2026-09-27.
            - name: CV_AGENT_MODEL
              value: opencode/mimo-v2.6-flash-free
            # Traduction en francais des fiches fournisseurs du dropshipping
            # (CJdropshipping n'a pas de francais). Sans elle, les articles CJ
            # restent hors ligne (`TRADUCTION_EN_ATTENTE`, loi Toubon) — aucune
            # erreur ailleurs : surveiller `urbanconnect_supplier_translation_queue_depth`.
            # Pas d'agent factice possible : une fausse traduction mettrait en
            # ligne un texte non francais.
            - name: SUPPLIER_TRANSLATION_MODEL
              value: opencode/mimo-v2.6-flash-free
            # Releve des tarifs « A decouvrir » sur les pages officielles
            # (file `discover_price_jobs`, deposee par l'enrichissement du worker
            # Temporal). Le modele doit avoir recherche + lecture web : mesure le
            # 2026-10-01, mimo-v2.6-flash-free (gratuit) les a. Surveiller
            # `urbanconnect_discover_price_queue_depth`.
            - name: DISCOVER_PRICE_MODEL
              value: opencode/mimo-v2.6-flash-free
            # 8 min : mesure le 2026-10-02, 100 des 205 premiers releves
            # depassaient 300 s (AGENT_TIMEOUT) : 5 min ne suffisent pas pour
            # lire deux ou trois pages officielles.
            - name: DISCOVER_PRICE_TIMEOUT_MS
              value: "480000"
            # ⚠️ VOLONTAIREMENT VIDE. Aucun modele `*-free` documente ne VOIT les
            # images ; vide, le processeur refuse png et jpeg par
            # UNSUPPORTED_TYPE. Renseigner un modele vision sans en verifier les
            # capacites ferait pire que rien : l'agent inventerait un profil
            # entier a partir d'une image qu'il ne lit pas.
            - name: CV_AGENT_VISION_MODEL
              value: ""
            # Filet de securite contre un agent muet -- PAS le mode nominal : la
            # fin est detectee par la stabilite d'`output.json`.
            - name: CV_AGENT_TIMEOUT_MS
              value: "300000"
            - name: OPENCODE_POLL_INTERVAL_MS
              value: "250"
            - name: CV_IMPORT_DAILY_QUOTA
              value: "5"
            - name: CV_IMPORT_IDLE_POLL_MS
              value: "3000"
            # Repertoires de job, sur l'emptyDir monte plus bas.
            - name: AI_WORKSPACE_DIR
              value: /workspace
            # ⚠️ `opencode` ecrit son etat sous $HOME. L'image cree ce home et
            # l'attribue a l'utilisateur `agent` ; sans un HOME inscriptible,
            # l'agent meurt au premier lancement.
            - name: HOME
              value: /home/agent
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            # Bornes OBLIGATOIRES, et serrees : la RAM du T620 est deja
            # surengagee (114 Go promis pour 110 physiques). Un agent qui fuit
            # sans limite emporterait des voisins avec lui.
            #
            # 1,5 Go : `opencode` tient quelques centaines de Mo, et le process
            # Node qui l'heberge charge le meme AppModule que l'API. La limite
            # CPU laisse un coeur entier a l'agent pendant qu'il travaille, sans
            # lui permettre d'en prendre deux.
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        # ⚠️ emptyDir et JAMAIS un volume persistant : un repertoire de job
        # contient le CV d'une personne, et n'a aucune raison de survivre au pod.
        # `sizeLimit` compte : sans lui, des documents de 5 Mo accumules par des
        # jobs qui echouent rempliraient le disque du noeud -- l'emptyDir puise
        # dans le systeme de fichiers de l'hote.
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
