apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: urbanconnect
  labels:
    app: directus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      containers:
        - name: directus
          image: directus/directus:latest
          ports:
            - containerPort: 8055
          env:
            - name: DIRECTUS_DATABASE_CLIENT
              value: postgres
            - name: DIRECTUS_DATABASE_HOST
              value: postgres
            - name: DIRECTUS_DATABASE_PORT
              value: "5432"
            - name: DIRECTUS_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_USER
            - name: DIRECTUS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_PASSWORD
            - name: DIRECTUS_DATABASE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_NAME
            - name: DIRECTUS_STORAGE_LOCATIONS__default__driver
              value: s3
            - name: DIRECTUS_STORAGE_LOCATIONS__default__key
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: DIRECTUS_STORAGE_LOCATIONS__default__secret
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: DIRECTUS_STORAGE_LOCATIONS__default__bucket
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_BUCKET_NAME
            - name: DIRECTUS_STORAGE_LOCATIONS__default__endpoint
              value: http://minio:9000
            - name: DIRECTUS_STORAGE_LOCATIONS__default__use_ssl
              value: "false"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_ADMIN_PASSWORD
            - name: PUBLIC_URL
              value: "https://directus.urbanlink.fr"
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_SECRET
            - name: TZ
              value: Europe/Paris
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # ⚠️ **`/server/health` est un point d'ADMINISTRATION, pas de santé.**
          # Il repond 403 a une requete non authentifiee -- mesure sur la VM
          # `urbanlink` : `GET /server/health 403 16ms` dans le journal de
          # Directus, alors que le serveur venait d'annoncer « Server started at
          # http://0.0.0.0:8055 ». Le service allait bien ; c'est la sonde qui
          # demandait un detail reserve a un administrateur. Kubelet comptait le
          # 403 comme un echec et redemarrait le pod -- 45 fois.
          #
          # Une sonde ne doit jamais avoir besoin d'identifiants : `/server/ping`
          # est le point public prevu par Directus pour cet usage, il repond
          # `pong` en 200 sans authentification.
          livenessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            initialDelaySeconds: 10
            periodSeconds: 10
