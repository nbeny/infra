apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: urbanconnect
  labels:
    app: directus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      containers:
        - name: directus
          image: directus/directus:latest
          ports:
            - containerPort: 8055
          env:
            # ================================================================
            #  ⚠️⚠️ LE PREFIXE `DIRECTUS_` N'EXISTE PAS. Mesure du 31/08/2026.
            # ----------------------------------------------------------------
            # Ces variables s'appelaient `DIRECTUS_DATABASE_*` et
            # `DIRECTUS_STORAGE_LOCATIONS__default__*`. L'image officielle ne
            # lit AUCUN de ces noms : elle lit `DB_*` et `STORAGE_*` bruts. Ce
            # prefixe est une convention de chart Helm, pas du produit -- et le
            # detail qui trahissait l'erreur etait juste en dessous, ADMIN_EMAIL
            # et ADMIN_PASSWORD n'en ayant jamais eu.
            #
            # Consequence, constatee sur le cluster : `env` dans le pod montrait
            # `DB_CLIENT=sqlite3` et `DB_FILENAME=/directus/database/database.sqlite`
            # -- les DEFAUTS de l'image -- a cote des six DIRECTUS_DATABASE_*
            # ignorees. Directus tournait donc sur un SQLite pose dans la couche
            # inscriptible du conteneur, SANS volume : zero table dans la base
            # PostgreSQL `directus` qui l'attendait, et la totalite de son
            # contenu -- comptes, collections, reglages -- effacee a chaque
            # redemarrage de pod. `directus bootstrap` repondait « Database
            # already initialized » en parlant du SQLite.
            #
            # Le meme prefixe rendait la configuration S3 inerte : les fichiers
            # televerses allaient dans /directus/uploads, ephemere lui aussi, au
            # lieu de MinIO.
            # ================================================================
            - name: DB_CLIENT
              value: pg
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_DB_NAME
            # `STORAGE_LOCATIONS` nomme les emplacements ; chacun se configure
            # ensuite sous son propre prefixe, d'ou `STORAGE_S3_*`.
            - name: STORAGE_LOCATIONS
              value: s3
            - name: STORAGE_S3_DRIVER
              value: s3
            - name: STORAGE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: STORAGE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_BUCKET_NAME
            - name: STORAGE_S3_ENDPOINT
              value: http://minio:9000
            # MinIO n'a pas de region, mais le SDK AWS en EXIGE une : sans elle
            # le client refuse de signer la requete.
            - name: STORAGE_S3_REGION
              value: us-east-1
            # Indispensable avec MinIO : sans lui le SDK construit des URL de
            # type `http://<bucket>.minio:9000`, un nom d'hote qui n'existe pas.
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_ADMIN_PASSWORD
            - name: PUBLIC_URL
              value: "https://directus.urbanlink.fr"
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DIRECTUS_SECRET
            - name: TZ
              value: Europe/Paris
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # ⚠️ **`/server/health` est un point d'ADMINISTRATION, pas de santé.**
          # Il repond 403 a une requete non authentifiee -- mesure sur la VM
          # `urbanlink` : `GET /server/health 403 16ms` dans le journal de
          # Directus, alors que le serveur venait d'annoncer « Server started at
          # http://0.0.0.0:8055 ». Le service allait bien ; c'est la sonde qui
          # demandait un detail reserve a un administrateur. Kubelet comptait le
          # 403 comme un echec et redemarrait le pod -- 45 fois.
          #
          # Une sonde ne doit jamais avoir besoin d'identifiants : `/server/ping`
          # est le point public prevu par Directus pour cet usage, il repond
          # `pong` en 200 sans authentification.
          livenessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            initialDelaySeconds: 10
            periodSeconds: 10
