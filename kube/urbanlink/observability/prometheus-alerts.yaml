# ============================================================================
#  PrometheusRule -- alertes UrbanLink
# ----------------------------------------------------------------------------
#  CRD appliquee par kube-prometheus-stack. Le Prometheus du chart la selec-
#  tionne via le label `release: kube-prometheus-stack` (regle par defaut du
#  chart). Les alertes resolues partent dans Alertmanager, route email.
#
#  Metriques sources :
#    - urbanconnect_*          : backend NestJS (additionalScrapeConfigs)
#    - kube_*                  : kube-state-metrics
#    - otelcol_*               : collecteur OTel
#
#  L'alerte ne vaut que si la metrique existe. Les metriques redis_*/pg_* ne
#  sont PAS scrapees (aucun exporter) -- pas de regle les concernant. Pour la
#  meme raison, il n'y a aucune regle sur les certificats : ils sont renouveles
#  par certbot sur le noeud Proxmox, pas par cert-manager, et
#  `certmanager_certificate_expiration_timestamp_seconds` n'existe nulle part
#  dans ce cluster.
#
#  ⚠️ Une regle FAUSSE ne se voit pas. Deux pieges rencontres ici :
#    - un nom de metrique inexistant ne leve aucune erreur : l'expression rend
#      un vecteur vide, et l'alerte ne part simplement jamais ;
#    - un `on(pod)` entre deux series qui ont plusieurs conteneurs par pod
#      echoue a CHAQUE evaluation (« multiple matches for labels »), et
#      l'erreur ne se lit que dans l'onglet Rules de Prometheus.
#  D'ou l'appariement complet `on(namespace, pod, container)` plus bas.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: urbanlink-alerts
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    # --- Disponibilite --------------------------------------------------------
    - name: urbanlink.availability
      rules:
        - alert: PodCrashLooping
          # kube-state-metrics expose `_restarts_total`, pas `_restarting_total` :
          # ce dernier n'existe pas et l'alerte n'aurait jamais tire.
          expr: >-
            increase(kube_pod_container_status_restarts_total{
              namespace="urbanconnect"
            }[10m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} en CrashLoop ({{ $value | humanize }} restarts/10min)"

        - alert: PodNotReady
          expr: >-
            kube_pod_status_ready{
              namespace="urbanconnect",
              condition="false"
            } == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} not ready depuis 5min"

        - alert: DeploymentReplicasMismatch
          expr: >-
            kube_deployment_spec_replicas{namespace="urbanconnect"}
            != kube_deployment_status_ready_replicas{namespace="urbanconnect"}
          for: 10m
          labels:
            severity: warning
          annotations:
            # Pas de `query` imbriquant `{{ $labels.deployment }}` dans sa
            # chaine : le template Go ne re-evalue pas l'interieur d'un
            # litteral, la requete partait avec « {{ $labels.deployment }} »
            # ecrit tel quel et l'annotation echouait a l'expansion.
            summary: >-
              Deployment {{ $labels.deployment }} : le nombre de replicas prets
              ne correspond pas au nombre desire depuis 10 minutes

    # --- Ressources -----------------------------------------------------------
    - name: urbanlink.resources
      rules:
        - alert: HighCPUUsage
          # `on(namespace, pod, container)` : avec `on(pod)` seul, un pod a
          # plusieurs conteneurs (backend + sidecar) donne plusieurs series a
          # droite pour la meme cle, et Prometheus refuse l'appariement a chaque
          # evaluation. `container!=""` ecarte en plus la serie agregee du
          # sandbox, qui n'a pas de limite en face.
          expr: >-
            (rate(container_cpu_usage_seconds_total{
              namespace="urbanconnect", container!=""
            }[5m])
            / on(namespace, pod, container) group_left()
            kube_pod_container_resource_limits{
              resource="cpu", namespace="urbanconnect"
            }) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} CPU > 80% ({{ $value | humanizePercentage }})"

        - alert: HighMemoryUsage
          # Meme appariement complet que HighCPUUsage, pour la meme raison.
          expr: >-
            (container_memory_working_set_bytes{
              namespace="urbanconnect", container!=""
            }
            / on(namespace, pod, container) group_left()
            kube_pod_container_resource_limits{
              resource="memory", namespace="urbanconnect"
            }) > 0.85
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} memoire > 85% ({{ $value | humanizePercentage }})"

        - alert: PVCNearFull
          expr: >-
            kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PVC {{ $labels.persistentvolumeclaim }} plein a
              {{ $value | humanizePercentage }}

        - alert: OOMKillDetected
          # `OOMKilled` est une VALEUR DE LABEL, pas la valeur de la serie
          # (qui vaut 1). PromQL n'autorise pas la comparaison a une chaine :
          # `== "OOMKilled"` est une erreur de syntaxe, et le webhook
          # d'admission du prometheus-operator refuse alors TOUT le
          # PrometheusRule -- donc les vingt autres alertes avec.
          expr: >-
            kube_pod_container_status_last_terminated_reason{
              namespace="urbanconnect", reason="OOMKilled"
            } == 1
          labels:
            severity: critical
          annotations:
            summary: "OOMKill sur {{ $labels.pod }}"

    # --- Backend NestJS -------------------------------------------------------
    - name: urbanlink.backend
      rules:
        - alert: BackendHighErrorRate
          expr: >-
            rate(urbanconnect_http_requests_total{status=~"5.."}[5m])
            / rate(urbanconnect_http_requests_total[5m]) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backend 5xx > 1% ({{ $value | humanizePercentage }})"

        - alert: BackendHighLatency
          expr: >-
            histogram_quantile(0.99,
              rate(urbanconnect_http_request_duration_seconds_bucket[5m])
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Backend p99 latency > 2s ({{ $value }}s)"

        - alert: GraphQLErrorsSpike
          expr: >-
            rate(urbanconnect_graphql_operations_total{
              outcome="error"
            }[5m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GraphQL errors > 5/s ({{ $value }}/s)"

    # --- Kafka / Outbox -------------------------------------------------------
    - name: urbanlink.kafka
      rules:
        - alert: KafkaDLQMessages
          expr: >-
            rate(urbanconnect_kafka_messages_total{outcome="dlq"}[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Messages en DLQ sur topic {{ $labels.topic }}"

        - alert: OutboxPoisoned
          expr: urbanconnect_outbox_pending{state="poisoned"} > 0
          labels:
            severity: critical
          annotations:
            summary: "Outbox poisoned (evenements en erreur permanente)"

    # --- OTel Collector -------------------------------------------------------
    #
    # Noms releves sur /metrics du collecteur 0.108 reellement deploye, pas
    # deduits de la documentation. La telemetrie interne passe par le SDK
    # OpenTelemetry-Go (bloc `readers` de otel-collector-config.yaml), qui
    # n'expose PAS la meme chose que l'ancien exporteur :
    #   - `otelcol_process_*` est absent -- l'alerte memoire qui s'y appuyait
    #     ne pouvait pas tirer. La memoire du pod est de toute facon deja
    #     couverte par HighMemoryUsage, qui vaut pour tout le namespace ;
    #   - `otelcol_processor_send_failed_spans_total` n'existe pas. Le compteur
    #     reel des spans perdus est cote EXPORTEUR.
    - name: urbanlink.otel
      rules:
        - alert: OTelCollectorDrops
          expr: >-
            increase(otelcol_exporter_send_failed_spans_total[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: >-
              OTel Collector : {{ $value | humanize }} spans non exportes vers
              {{ $labels.exporter }} en 5 min

        # La file d'export qui se remplit precede la perte : c'est le signal
        # qu'on veut voir AVANT que les spans commencent a tomber.
        - alert: OTelQueueNearFull
          expr: >-
            otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              OTel Collector : file d'export {{ $labels.exporter }} pleine a
              {{ $value | humanizePercentage }}

    # --- TLS / Certificats ----------------------------------------------------
    #
    # AUCUNE regle ici, et c'est deliberé. Le groupe portait une alerte sur
    # `certmanager_certificate_expiration_timestamp_seconds` : cert-manager
    # n'est pas installe sur ce cluster -- le wildcard *.urbanlink.fr est
    # obtenu et renouvele par CERTBOT sur le noeud Proxmox (role
    # tls_certificates), hors de portee de ce Prometheus. La metrique n'existe
    # donc nulle part, et l'alerte donnait l'illusion d'une surveillance qui
    # n'aurait jamais tire, meme un certificat expire.
    #
    # Surveiller reellement cette expiration demande une sonde depuis le noeud
    # (blackbox exporter sur le vhost, ou un check du systemd timer certbot) :
    # un chantier distinct, pas une ligne a rajouter ici.