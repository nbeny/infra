# ============================================================================
#  PrometheusRule -- alertes UrbanLink
# ----------------------------------------------------------------------------
#  CRD appliquee par kube-prometheus-stack. Le Prometheus du chart la selec-
#  tionne via le label `release: kube-prometheus-stack` (ruleSelector des
#  valeurs Helm). Les alertes partent dans Alertmanager, expose sur
#  alertmanager.urbanlink.fr.
#
#  ─────────────────────────────────────────────────────────────────────────
#  UNE ALERTE QUI NE PEUT PAS TIRER EST PIRE QU'UNE ALERTE ABSENTE
#  ─────────────────────────────────────────────────────────────────────────
#  Elle donne l'illusion d'une surveillance. Six regles etaient dans ce cas
#  avant le 2026-09-02, et rien ne le disait :
#
#    OTelCollectorDrops           `otelcol_exporter_send_failed_spans_total`
#                                 n'existe pas -- le collecteur n'expose que
#                                 TROIS metriques `otelcol_*`. SUPPRIMEE.
#    DeploymentReplicasMismatch   `kube_deployment_status_ready_replicas`
#                                 n'existe pas ; le vrai nom est
#                                 `..._status_replicas_ready` (deux derniers
#                                 mots inverses). L'expression rendait
#                                 0 serie, toujours. CORRIGEE.
#    PVCNearFull                  `kubelet_volume_stats_*` est absent de ce
#                                 cluster : les 12 PVC sont en `local-path`,
#                                 dont les volumes sont des chemins de l'hote
#                                 -- le kubelet n'en produit aucune
#                                 statistique. SUPPRIMEE, remplacee par
#                                 NodeDiskFillingUp sur `/`, qui les porte
#                                 tous.
#    GraphQLErrorsSpike           seuil absolu `> 5 erreurs/s` sur un trafic
#                                 mesure a moins d'UNE requete/s : jamais
#                                 atteignable. Devenue GraphQLErrorRatio.
#    IstioCertExpiringSoon        seuil a 7 jours sur des certificats dont la
#                                 duree de vie est de 24 h : elle aurait tire
#                                 en PERMANENCE. Devenue IstioCertNotRotating,
#                                 seuil 1 h.
#    (et le groupe otel entier)   voir urbanlink.telemetry plus bas.
#
#  CHAQUE regle ci-dessous est adossee a une metrique dont la presence a ete
#  VERIFIEE sur ce cluster, et chaque seuil est pose au regard de la ligne de
#  base mesuree le 2026-09-02 : 16 coeurs, charge 5 min a 2,16, RAM a 17 %,
#  disque `/` a 34,6 %, moins d'une requete/s.
#
#  La porte qui l'a permis : `scripts/observability/check-queries.py`, qui
#  execute chaque expression de ce fichier contre le Prometheus reel et refuse
#  ce qui ne peut pas fonctionner. NE PAS MODIFIER CE FICHIER SANS LA REJOUER.
#
#  ⚠️ TROIS pieges PromQL rencontres ici, qui ne se voient PAS a la lecture --
#  les trois produisent une alerte muette, aucun ne produit d'erreur :
#
#    1. un nom de metrique inexistant rend un vecteur vide. C'est le mecanisme
#       des six lignes ci-dessus ;
#
#    2. un APPARIEMENT VECTORIEL qui ne trouve aucune paire rend un vecteur
#       vide lui aussi -- alors que les deux metriques existent, et que
#       l'expression se lit parfaitement. Deux regles de ce fichier en sont
#       mortes, toutes deux trouvees par la porte le 2026-09-02 :
#         · OTelQueueNearFull -- `queue_size` porte une etiquette `data_type`
#           que `queue_capacity` n'a pas ;
#         · NodeHighLoad -- `node_load5` porte sept etiquettes, le denominateur
#           `count(count by (cpu) (...))` n'en porte aucune.
#       Remede : `on(...)` / `ignoring(...)`, ou `scalar()` quand le
#       denominateur est un nombre. Les deux cas sont documentes sur place ;
#
#    3. un `on(pod)` entre deux series qui ont plusieurs conteneurs par pod
#       echoue a CHAQUE evaluation (« multiple matches for labels »). Celui-la
#       au moins laisse une trace -- dans l'onglet Rules de Prometheus, et
#       desormais sur le tableau de bord « 04 — Chaine d'observabilite »,
#       panneau « Regles en echec ». D'ou l'appariement complet
#       `on(namespace, pod, container)` plus bas.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: urbanlink-alerts
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    # =======================================================================
    #  PRODUIT -- ce qui casse sans rien dire
    # -----------------------------------------------------------------------
    #  Groupe NEUF (2026-09-18). Toutes ces regles s'adossent a des metriques
    #  posees par la meme livraison : elles ne pouvaient pas exister avant.
    #
    #  ⚠️ CHAQUE RATIO PORTE UN PLANCHER DE VOLUME. La lecon est ecrite dans ce
    #  depot au prix d'une fausse alerte : le 2026-09-02, GraphQLErrorRatio a
    #  tire parce que le trafic s'etait ETEINT -- le denominateur valait
    #  presque zero et les erreurs residuelles donnaient 100 %. Une alerte qui
    #  se declenche parce que plus personne n'utilise le produit dit l'inverse
    #  de ce qu'on lui demande.
    #
    #  ⚠️ AUCUNE ALERTE DU TYPE « plus aucune inscription depuis N jours ». La
    #  production compte UN utilisateur : elle tirerait en permanence, et une
    #  alerte qui ne s'eteint jamais apprend a ignorer la page des alertes.
    # =======================================================================
    - name: urbanlink.produit
      rules:
        - alert: SearchFellBackToPostgres
          # Le disjoncteur ouvert, la recherche CONTINUE DE REPONDRE : pas
          # d'erreur, pas de 5xx, pas de latence anormale, juste des resultats
          # moins bons. La seule autre trace est une ligne de journal, et
          # personne ne lit un journal pour un evenement qui n'arrive jamais --
          # jusqu'au jour ou il arrive.
          expr: max(urbanconnect_search_circuit_open) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Disjoncteur Elasticsearch OUVERT depuis 10 min : la recherche est
              servie par Postgres, en degrade, sans que rien d'autre ne le dise

        - alert: SearchEngineFailingBelowThreshold
          # ⚠️ LE REPLI LE PLUS SOURNOIS, et celui que la jauge ci-dessus ne
          # voit PAS. Elasticsearch est retenu, la requete echoue en vol,
          # l'appelant retombe sur Postgres -- et comme on reste SOUS le seuil
          # d'ouverture du disjoncteur, ni la jauge ni le compteur de decision
          # ne bougent. Cela peut durer indefiniment.
          #
          # ⚠️ Cette serie peut accuser Elasticsearch d'une panne de POSTGRES :
          # le `try` des appelants enveloppe aussi les hydratations Prisma. Une
          # montee ici SANS montee des erreurs Prisma designe bien ES.
          expr: >-
            sum(increase(urbanconnect_search_engine_failures_total[30m])) > 5
            and max(urbanconnect_search_circuit_open) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value | humanize }} requetes Elasticsearch echouees en 30 min
              SANS ouverture du disjoncteur -- la recherche degrade en silence

        - alert: StripeWebhooksFailing
          expr: >-
            sum(increase(urbanconnect_stripe_webhooks_total{
              outcome=~"retry|permanent_error"
            }[30m])) > 3
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value | humanize }} webhooks Stripe en echec sur 30 min --
              paiements, abonnements et litiges ne sont plus projetes en base

        - alert: PaymentsFailingRatio
          # Plancher a 0,002/s, soit ~7 paiements par heure. Sous ce volume, un
          # seul refus donnerait un ratio affolant sans rien signifier.
          expr: >-
            (
              sum(rate(urbanconnect_payments_total{outcome="failed"}[30m]))
              /
              sum(rate(urbanconnect_payments_total[30m]))
            ) > 0.3
            and sum(rate(urbanconnect_payments_total[30m])) > 0.002
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              Plus de 30 % des paiements echouent sur 30 min (volume suffisant
              pour que le ratio veuille dire quelque chose)

        - alert: SignupsNotProjected
          # ⚠️ LE DEFAUT QUE `signups_total` EXISTE POUR ATTRAPER : Kratos a
          # cree une identite, et le webhook n'a pas su l'ecrire en base. Le
          # compte existe cote authentification et NULLE PART chez nous.
          # L'utilisateur, lui, croit s'etre inscrit.
          #
          # Seuil a 1 : ce n'est pas un taux, c'est un compte perdu. Distinct
          # de `rejected`, qui accuse le format du corps recu.
          expr: >-
            sum(increase(urbanconnect_signups_total{outcome="error"}[1h])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value | humanize }} inscription(s) non projetee(s) en base sur
              1 h -- Kratos a cree l'identite, nous n'avons pas su l'ecrire

        - alert: NotificationsUndelivered
          expr: >-
            sum(increase(urbanconnect_notifications_delivered_total{
              outcome="failed"
            }[1h])) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value | humanize }} notifications perdues en 1 h -- elles
              n'arrivent pas, et personne ne s'en plaint puisque personne ne
              les attendait

        - alert: SellerPayoutsStuck
          # `HELD` qui monte sans que `released` ne bouge : plus personne n'est
          # paye. L'exemple meme de la panne qui ne leve rien -- aucun vendeur
          # ne signale un virement qu'il n'attendait pas encore.
          #
          # ⚠️ Cette alerte etait STRUCTURELLEMENT MUETTE jusqu'au 2026-09-18,
          # et pas a cause de son expression : la serie s'ecrit dans le worker
          # Temporal, qui n'exposait aucun /metrics. Elle ne pouvait pas
          # atteindre Prometheus. Voir servicemonitors.yaml.
          expr: >-
            max(urbanconnect_seller_payouts_pending{status="HELD"}) > 5
            and sum(increase(urbanconnect_seller_payouts_total{outcome="released"}[6h])) == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $value | humanize }} versements en attente et AUCUN libere
              depuis 6 h -- le balayage ne paie plus personne

        - alert: KratosLoginFailureRatio
          # ⚠️ `exported_endpoint`, et NON `endpoint`. L'operateur Prometheus
          # pose son propre `endpoint` valant le NOM DU PORT du Service, soit
          # `admin` ; le chemin de Kratos survit prefixe. Une regle ecrite
          # naturellement rendrait le vide, sans erreur, et ne tirerait jamais.
          expr: >-
            (
              sum(rate(http_requests_total{job="kratos", exported_endpoint="/self-service/login", method="post", code!~"3.."}[30m]))
              /
              sum(rate(http_requests_total{job="kratos", exported_endpoint="/self-service/login", method="post"}[30m]))
            ) > 0.5
            and sum(rate(http_requests_total{job="kratos", exported_endpoint="/self-service/login", method="post"}[30m])) > 0.005
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Plus d'une connexion sur deux echoue sur 30 min -- regression du
              formulaire, ou tentative de bourrage d'identifiants

        - alert: BackendReplicasNotScraped
          # ⚠️ `scalar()` AU DENOMINATEUR, ET CE N'EST PAS DU STYLE.
          # `kube_deployment_...` porte `namespace` et `deployment` ;
          # `count(up{...} == 1)` n'en porte AUCUNE. Un appariement direct ne
          # trouve aucune paire, rend le vide, et se lit parfaitement -- c'est
          # le piege n°2 de l'en-tete de ce fichier, qui a deja tue deux regles.
          #
          # Le defaut qu'elle attrape, mesure le 2026-09-18 : 3 pods backend en
          # Running, 2 cibles dans Prometheus. Tous les `sum(rate(...))`
          # sous-comptaient d'un tiers. La serie `up` ne peut PAS valoir 0 pour
          # une cible jamais decouverte : rien d'autre ne pouvait le dire.
          expr: >-
            kube_deployment_status_replicas_ready{
              namespace="urbanconnect", deployment="backend"
            } - scalar(count(up{job="urbanconnect-backend"} == 1)) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value }} replica(s) backend pret(s) mais non scrape(s) --
              tous les taux sur urbanconnect_* sous-comptent en silence
    # =======================================================================
    #  META -- la surveillance se surveille elle-meme
    # -----------------------------------------------------------------------
    #  Groupe NEUF. Il n'existait pas, et c'est ce qui a permis aux six regles
    #  mortes de le rester : rien ne surveillait le surveillant.
    # =======================================================================
    - name: urbanlink.meta
      rules:
        - alert: PrometheusTargetDown
          # Une cible muette ne produit pas d'erreur : elle produit un GRAPHE
          # PLAT, qui se lit exactement comme un systeme calme. C'est la seule
          # alerte qui distingue « tout va bien » de « je ne sais plus rien ».
          expr: up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Cible {{ $labels.job }} ({{ $labels.instance }}) muette depuis
              10 minutes -- les panneaux qui en dependent affichent un plat,
              pas une erreur

        - alert: PrometheusRuleFailures
          # ⚠️ L'ALERTE QUI AURAIT DU EXISTER EN PREMIER. Une regle dont
          # l'expression est invalide echoue silencieusement a chaque
          # evaluation : l'alerte ne tire jamais et rien ne le dit ailleurs
          # que dans l'onglet Rules. Un `on(pod)` ambigu a vecu ainsi.
          expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Groupe de regles {{ $labels.rule_group }} : l'evaluation echoue.
              Les alertes de ce groupe NE TIRERONT PAS -- voir l'onglet Rules
              de Prometheus pour l'erreur exacte

        - alert: AlertmanagerNotificationsFailing
          expr: increase(alertmanager_notifications_failed_total[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Alertmanager n'arrive pas a livrer vers {{ $labels.integration }}
              -- les alertes tirent mais personne ne les recoit

        - alert: PrometheusTSDBGrowth
          # Seuil pose a 2,5x la ligne de base mesuree (80 632 series). Une
          # etiquette a cardinalite non bornee -- un identifiant, une URL brute
          # -- multiplie ce chiffre en quelques heures et finit par faire
          # tomber Prometheus lui-meme.
          expr: max(prometheus_tsdb_head_series) > 200000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Prometheus : {{ $value | humanize }} series actives (base
              habituelle ~80 000). Chercher une etiquette a cardinalite non
              bornee

    # =======================================================================
    #  DISPONIBILITE
    # =======================================================================
    - name: urbanlink.availability
      rules:
        - alert: NodeNotReady
          # Cluster MONO-NOEUD : sa chute emporte tout. Cette alerte inhibe
          # toutes les autres dans Alertmanager (inhibit_rules des valeurs
          # Helm) -- sans quoi une seule panne en declencherait trente, qui
          # disent la meme chose.
          expr: >-
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Noeud {{ $labels.node }} NOT READY -- tout le cluster est dessus"

        - alert: BackendNoReplicas
          # Le cas ou tout est mort. Distinct de DeploymentReplicasMismatch
          # (degradation) : ici il n'y a plus personne pour repondre, et 2 min
          # suffisent -- attendre 10 comme pour une degradation serait absurde.
          expr: >-
            kube_deployment_status_replicas_ready{
              namespace="urbanconnect", deployment="backend"
            } == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Backend : PLUS AUCUN replica pret -- l'API ne repond plus"

        - alert: PodCrashLooping
          # kube-state-metrics expose `_restarts_total`, pas `_restarting_total` :
          # ce dernier n'existe pas et l'alerte n'aurait jamais tire.
          expr: >-
            increase(kube_pod_container_status_restarts_total{
              namespace="urbanconnect"
            }[10m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} en CrashLoop ({{ $value | humanize }} redemarrages/10min)"

        - alert: PodNotReady
          # ⚠️ `unless` sur les pods TERMINES, sans quoi la regle est fausse en
          # permanence : un pod de Job qui a fini avec succes garde
          # `Ready=false` pour toujours. Mesure le 2026-09-02, quatre alertes
          # actives et definitives -- geoipupdate (deux executions),
          # elasticsearch-setup et minio-init, tous `Completed`. Une alerte qui
          # ne s'eteint jamais apprend a ignorer la page des alertes.
          expr: >-
            kube_pod_status_ready{
              namespace="urbanconnect",
              condition="false"
            } == 1
            unless on(namespace, pod)
            kube_pod_status_phase{namespace="urbanconnect", phase="Succeeded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} pas pret depuis 5 min"

        - alert: DeploymentReplicasMismatch
          # ⚠️ `kube_deployment_status_replicas_ready` -- PAS
          # `kube_deployment_status_ready_replicas`, qui n'existe pas chez
          # kube-state-metrics. Avec l'ancien nom, le membre droit du `!=`
          # etait un vecteur vide : l'expression rendait 0 serie a chaque
          # evaluation. Verifie le 2026-09-02, l'alerte etait muette depuis sa
          # creation.
          expr: >-
            kube_deployment_spec_replicas{namespace="urbanconnect"}
            != kube_deployment_status_replicas_ready{namespace="urbanconnect"}
          for: 10m
          labels:
            severity: warning
          annotations:
            # Pas de `query` imbriquant `{{ $labels.deployment }}` dans sa
            # chaine : le template Go ne re-evalue pas l'interieur d'un
            # litteral, la requete partait avec « {{ $labels.deployment }} »
            # ecrit tel quel et l'annotation echouait a l'expansion.
            summary: >-
              Deployment {{ $labels.deployment }} : le nombre de replicas prets
              ne correspond pas au nombre desire depuis 10 minutes

    # =======================================================================
    #  RESSOURCES
    # =======================================================================
    - name: urbanlink.resources
      rules:
        - alert: HighCPUUsage
          # `on(namespace, pod, container)` : avec `on(pod)` seul, un pod a
          # plusieurs conteneurs (backend + sidecar) donne plusieurs series a
          # droite pour la meme cle, et Prometheus refuse l'appariement a chaque
          # evaluation. `container!=""` ecarte en plus la serie agregee du
          # sandbox, qui n'a pas de limite en face.
          expr: >-
            (rate(container_cpu_usage_seconds_total{
              namespace="urbanconnect", container!=""
            }[5m])
            / on(namespace, pod, container) group_left()
            kube_pod_container_resource_limits{
              resource="cpu", namespace="urbanconnect"
            }) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.pod }}/{{ $labels.container }} : CPU a
              {{ $value | humanizePercentage }} de sa limite -- il est etrangle
              par le noyau, pas tue

        - alert: HighMemoryUsage
          # Meme appariement complet que HighCPUUsage, pour la meme raison.
          # Seuil sous la barre fatale : depasser la limite memoire TUE le
          # conteneur, contrairement au CPU.
          expr: >-
            (container_memory_working_set_bytes{
              namespace="urbanconnect", container!=""
            }
            / on(namespace, pod, container) group_left()
            kube_pod_container_resource_limits{
              resource="memory", namespace="urbanconnect"
            }) > 0.85
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.pod }}/{{ $labels.container }} : memoire a
              {{ $value | humanizePercentage }} de sa limite -- au-dela, le
              conteneur est tue

        - alert: OOMKillDetected
          # `OOMKilled` est une VALEUR DE LABEL, pas la valeur de la serie
          # (qui vaut 1). PromQL n'autorise pas la comparaison a une chaine :
          # `== "OOMKilled"` est une erreur de syntaxe, et le webhook
          # d'admission du prometheus-operator refuse alors TOUT le
          # PrometheusRule -- donc les trente autres alertes avec.
          expr: >-
            kube_pod_container_status_last_terminated_reason{
              namespace="urbanconnect", reason="OOMKilled"
            } == 1
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} tue faute de memoire"

        - alert: NodeDiskFillingUp
          # ⚠️ CETTE REGLE REMPLACE PVCNearFull, et couvre davantage.
          #
          # Il n'existe AUCUNE mesure d'occupation par PVC sur ce cluster :
          # `kubelet_volume_stats_*` est absent, les 12 revendications etant en
          # `local-path` (volumes = chemins de l'hote, dont le kubelet ne
          # produit pas de statistiques). L'ancienne alerte visait ces
          # metriques : elle n'a jamais pu tirer.
          #
          # Or les 12 PVC vivent sur `/dev/sda1`, le seul systeme de fichiers
          # du noeud. Le surveiller les couvre tous.
          #
          # `predict_linear` plutot qu'un seuil fixe : un seuil dit « c'est
          # plein », une projection dit « ce sera plein demain » -- la seule
          # des deux qui laisse le temps d'agir.
          expr: >-
            predict_linear(
              node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}[6h],
              24 * 3600
            ) < 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Disque / du noeud : plein dans moins de 24 h au rythme actuel.
              Les 12 PVC du cluster sont dessus

        - alert: NodeDiskAlmostFull
          # Le filet de securite du precedent : une saturation brutale (un
          # journal qui s'emballe) ne laisse pas six heures d'historique a
          # `predict_linear` pour etablir une pente.
          expr: >-
            (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) > 0.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Disque / plein a {{ $value | humanizePercentage }}"

        - alert: NodeMemoryPressure
          # `MemAvailable` et non `MemFree` : le cache et les tampons sont
          # recuperables a la demande. Alerter sur `MemFree` ferait tirer en
          # permanence sur une machine qui se porte bien.
          expr: >-
            node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Noeud : moins de 10 % de memoire disponible
              ({{ $value | humanizePercentage }}) -- le tueur OOM va choisir
              lui-meme qui s'arrete

        - alert: NodeHighLoad
          # Normalise par le nombre de coeurs, sinon le seuil depend de la
          # machine. Base mesuree : 16 coeurs, load5 a 2,16, soit 0,14 par
          # coeur. Le seuil a 2 laisse une marge de plus de dix fois.
          #
          # ⚠️ `scalar(...)` EST OBLIGATOIRE AU DENOMINATEUR, et l'oublier
          # produit une alerte parfaitement muette.
          #
          # `node_load5` porte sept etiquettes (instance, job, pod, namespace,
          # container, endpoint, service) ; `count(count by (cpu) (...))` n'en
          # porte AUCUNE. L'appariement vectoriel par defaut exige des jeux
          # d'etiquettes compatibles : il n'y a aucune paire, le resultat est
          # vide, et PromQL ne s'en plaint pas.
          #
          # `scalar()` transforme le denominateur en nombre : la division
          # vecteur/scalaire conserve alors les etiquettes de gauche. Mesure le
          # 2026-09-02 -- sans `scalar()` : 0 serie ; avec : 0,085 par coeur.
          #
          # ⚠️ Le panneau « Charge / coeur » du tableau de bord Plateforme
          # n'a PAS besoin de `scalar()`, et ce n'est pas une incoherence : il
          # ecrit `avg(node_load5)`, dont le resultat n'a lui non plus aucune
          # etiquette. Les deux cotes s'apparient alors. Meme calcul, deux
          # ecritures, un seul piege.
          expr: >-
            node_load5
            / scalar(count(count by (cpu) (node_cpu_seconds_total)))
            > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Charge du noeud a {{ $value | humanize }} par coeur -- des
              processus attendent le processeur

    # =======================================================================
    #  BACKEND NESTJS
    # -----------------------------------------------------------------------
    #  ⚠️ Ces regles n'etaient PAS FIABLES avant le 2026-09-02, meme
    #  correctement ecrites. Le job scrapait le ClusterIP `backend:4000` pour
    #  un Deployment a 2 replicas : une seule serie, alimentee alternativement
    #  par deux compteurs desynchronises. Chaque descente etait lue comme une
    #  remise a zero, et `rate()` ajoutait la valeur entiere -- les taux
    #  etaient gonfles. Corrige par le ServiceMonitor
    #  (observability/servicemonitors.yaml), qui decouvre les Endpoints.
    # =======================================================================
    - name: urbanlink.backend
      rules:
        - alert: BackendDown
          # `absent()` et non `up == 0` : si la CIBLE elle-meme disparait de la
          # decouverte de service (Service supprime, selecteur casse), il n'y a
          # plus de serie `up` du tout -- et `up == 0` ne rend rien. Les deux
          # cas se ressemblent depuis l'exterieur et doivent alerter pareil.
          expr: >-
            absent(up{job="urbanconnect-backend"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Aucun replica backend ne repond au scrape -- soit ils sont morts,
              soit la cible a disparu de la decouverte

        - alert: BackendHighErrorRate
          expr: >-
            sum(rate(urbanconnect_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(urbanconnect_http_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backend : {{ $value | humanizePercentage }} de reponses 5xx"

        - alert: BackendHighLatency
          # `sum by (le)` avant `histogram_quantile` : sans lui, le quantile se
          # calcule par serie source -- donc par pod depuis le ServiceMonitor
          # -- et non sur la population totale.
          expr: >-
            histogram_quantile(0.99,
              sum by (le) (rate(urbanconnect_http_request_duration_seconds_bucket[5m]))
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Backend : latence p99 a {{ $value | humanize }}s"

        - alert: GraphQLErrorRatio
          # ⚠️ RATIO, pas seuil absolu. L'ancienne regle exigeait
          # « > 5 erreurs/s » sur un trafic mesure a moins d'UNE requete par
          # seconde : elle ne pouvait pas tirer, quel que soit le taux d'echec.
          #
          # ⚠️ MAIS UN RATIO SEUL EST FAUX AUSSI, DE L'AUTRE COTE. Premiere
          # version de cette regle, deployee le 2026-09-02 : elle a tire dans
          # l'heure, et le diagnostic a montre DEUX defauts de conception, tous
          # deux corriges ici.
          #
          # 1. LE SEUIL ETAIT SOUS LE SOCLE DE L'APPLICATION. Mesure sur 6 h :
          #    `error` oscille entre 3 et 6 op/s pour 15 a 34 op/s au total,
          #    soit un socle STABLE de 15 a 20 %. Un seuil a 5 % aurait tire en
          #    permanence -- le defaut exact reproche a IstioCertExpiringSoon.
          #    Le seuil est porte a 35 %, nettement au-dessus du socle mesure,
          #    pour signaler une DEVIATION et non l'etat normal.
          #
          #    ⚠️ Ce socle est lui-meme un probleme produit, pas une fatalite :
          #    il vient de trois requetes de sondage du frontend
          #    (`pendingQuoteRequestsCount`, `pendingOffersCount`,
          #    `pendingContactRequests`, ~9 900 echecs/h a elles trois). Le
          #    jour ou elles cesseront d'echouer, ce seuil devra redescendre.
          #
          # 2. UN RATIO N'A PAS DE SENS A VOLUME NUL. Quand le trafic s'est
          #    eteint, `ok` est tombe a 0 et les 0,08 erreur/s residuelles ont
          #    fait un ratio de 100 %. Une alerte qui se declenche parce que
          #    PLUS PERSONNE n'utilise le produit dit l'inverse de ce qu'on lui
          #    demande. D'ou le plancher de volume : sous 1 operation/s, la
          #    question n'est pas posee.
          expr: >-
            (
              sum(rate(urbanconnect_graphql_operations_total{outcome="error"}[15m]))
              / sum(rate(urbanconnect_graphql_operations_total[15m])) > 0.35
            )
            and
            sum(rate(urbanconnect_graphql_operations_total[15m])) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              GraphQL : {{ $value | humanizePercentage }} d'operations en erreur
              (socle habituel 15-20 %) -- voir la table « Operations en erreur »
              du tableau de bord Backend

        - alert: BackendEventLoopBlocked
          # LE symptome d'un Node sature, et le seul que ni le CPU ni la
          # memoire ne montrent : la boucle d'evenements attend son tour. Une
          # requete arrivee pendant ce retard le paie integralement, avant
          # meme d'etre traitee. Un pod peut etre a 30 % de CPU et pourtant
          # incapable de repondre.
          expr: >-
            urbanconnect_nodejs_eventloop_lag_p99_seconds > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Backend {{ $labels.pod }} : boucle d'evenements bloquee
              {{ $value | humanize }}s au p99

        - alert: BackendHeapNearLimit
          expr: >-
            urbanconnect_nodejs_heap_size_used_bytes
            / urbanconnect_nodejs_heap_size_total_bytes > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Backend {{ $labels.pod }} : tas V8 a
              {{ $value | humanizePercentage }} -- une fuite finit en OOMKill

        - alert: BackendFileDescriptorsHigh
          # Une fuite de sockets (client HTTP jamais ferme, connexion Postgres
          # non rendue) se voit ici bien avant de se voir ailleurs : l'API
          # continue de repondre jusqu'a l'epuisement, puis refuse tout d'un
          # coup.
          expr: >-
            urbanconnect_process_open_fds / urbanconnect_process_max_fds > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Backend {{ $labels.pod }} : {{ $value | humanizePercentage }} des
              descripteurs de fichiers ouverts

    # =======================================================================
    #  TEMPORAL -- LES CRONS DURABLES
    # -----------------------------------------------------------------------
    #  Depuis le 2026-09-16, `ensureSchedule` n'interrompt plus le demarrage du
    #  backend quand Temporal est indisponible : dix-huit des dix-neuf
    #  schedulers l'appellent sans `try`, et une erreur qui remonte tuait le
    #  processus, figeait le rollout, et le laissait fige derriere des anciens
    #  replicas qui continuaient de servir -- sans aucune etape rouge.
    #
    #  Le prix de ce choix est qu'un cron peut desormais ne PAS etre pose sans
    #  que rien ne casse : pas d'erreur utilisateur, pas de requete en echec.
    #  C'est exactement le genre de panne qu'une alerte doit porter, parce que
    #  rien d'autre ne le fera.
    #
    #  ⚠️ La jauge est SANS ETIQUETTE a dessein : une metrique etiquetee
    #  n'exporte aucune serie tant qu'elle n'a pas ete observee une fois, et
    #  l'alerte serait muette le jour ou elle devrait tirer. Le detail (quel
    #  Schedule, quel motif) est dans le journal du pod, qui le nomme.
    # =======================================================================
    - name: urbanlink.temporal
      rules:
        - alert: TemporalSchedulesNotInstalled
          # `max` et non `sum` : la jauge est par instance, et les trois
          # replicas posent les MEMES Schedules. Sommer multiplierait par trois
          # un seul echec.
          expr: max(urbanconnect_temporal_schedules_failed) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $value }} Schedule(s) Temporal non pose(s) au demarrage du
              backend -- les balayages correspondants ne tournent pas. Le nom du
              Schedule et le motif sont dans le journal du pod :
              `kubectl -n urbanconnect logs -l app=backend | grep "non pose"`.
              Un redemarrage du pod les repose si Temporal est revenu.

    # =======================================================================
    #  KAFKA / BOITE D'ENVOI
    # -----------------------------------------------------------------------
    #  Kafka n'est PAS bloquant pour la readiness : tous les producteurs
    #  passent par la boite d'envoi (Postgres). Un broker mort ne casse aucune
    #  requete -- les evenements s'accumulent. C'est donc `outbox_pending`
    #  qu'il faut surveiller, pas la sante du broker.
    # =======================================================================
    - name: urbanlink.kafka
      rules:
        - alert: KafkaDLQMessages
          expr: >-
            increase(urbanconnect_kafka_messages_total{outcome="dlq"}[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: >-
              Messages abandonnes en DLQ sur {{ $labels.topic }}. Les lire avec
              `npm run kafka:dlq -- --peek`, corriger la cause AVANT de rejouer

        - alert: OutboxPoisoned
          expr: urbanconnect_outbox_pending{state="poisoned"} > 0
          labels:
            severity: critical
          annotations:
            summary: >-
              Boite d'envoi : {{ $value }} evenements en erreur permanente --
              ils ne repartiront pas seuls

        - alert: OutboxBacklogGrowing
          # Le signal que le relais ne suit plus, ou que Kafka est injoignable.
          # Rien ne casse cote HTTP, et c'est justement pourquoi il faut une
          # alerte : sans elle, l'accumulation est invisible.
          expr: urbanconnect_outbox_pending{state="pending"} > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Boite d'envoi : {{ $value }} evenements en attente depuis 15 min
              -- le relais ne suit plus ou le broker est injoignable

    # =======================================================================
    #  MAILLAGE ISTIO
    # -----------------------------------------------------------------------
    #  Groupe NEUF. ⚠️ Le maillage tourne en mode AMBIENT : ztunnel ne fait que
    #  du L4. Les metriques HTTP (`istio_requests_total`) ne viennent QUE de
    #  l'istio-ingressgateway, qui est un proxy L7. Une regle sur le L7 d'un
    #  workload interne -- `backend` par exemple -- ne rendrait jamais rien :
    #  verifie, `destination_workload="backend"` ne porte AUCUNE serie L7.
    # =======================================================================
    - name: urbanlink.mesh
      rules:
        - alert: IngressHighErrorRate
          expr: >-
            sum(rate(istio_requests_total{
              source_workload="istio-ingressgateway", reporter="source",
              response_code=~"5.."
            }[5m]))
            / sum(rate(istio_requests_total{
              source_workload="istio-ingressgateway", reporter="source"
            }[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Passerelle d'entree : {{ $value | humanizePercentage }} de 5xx.
              A croiser avec BackendHighErrorRate -- un ecart designe un
              probleme AVANT l'application

        - alert: IngressUpstreamFailures
          # ⚠️ La seule regle qui distingue deux 503 qui n'ont rien a voir.
          # `UF` connexion amont impossible, `UH` aucun hote sain, `UO` circuit
          # ouvert, `NR` aucune route configuree. Ces quatre-la ne viennent
          # PAS de l'application : elle n'a jamais ete jointe. Un 503 emis par
          # le backend lui-meme porte `response_flags="-"` et n'entre pas ici.
          #
          # `DC` (connexion coupee par le client) est volontairement exclu :
          # c'est le comportement normal d'un flux long -- SSE, WebSocket --
          # et il est present en continu sur ce cluster.
          expr: >-
            sum by (destination_workload, response_flags) (
              rate(istio_requests_total{
                source_workload="istio-ingressgateway", reporter="source",
                response_flags=~"UF|UH|UO|NR"
              }[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.destination_workload }} injoignable depuis la
              passerelle ({{ $labels.response_flags }}) -- le service n'a pas
              repondu, ce n'est pas une erreur applicative

        - alert: MeshTCPConnectionFailures
          # Le plan L4 est le SEUL ou `backend`, `postgres`, `redis`, `kafka` et
          # `elasticsearch` sont visibles en mode ambient. Une connexion
          # refusee y precede toujours l'erreur applicative.
          expr: >-
            sum by (destination_workload) (
              rate(istio_tcp_connections_failed_total{reporter="destination"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Connexions TCP refusees vers {{ $labels.destination_workload }}
              ({{ $value | humanize }}/s)

        - alert: IstioCertNotRotating
          # ⚠️ SEUIL A UNE HEURE, ET C'EST DELIBERE.
          #
          # Ce ne sont PAS les certificats publics `*.urbanlink.fr` (renouveles
          # par certbot sur le noeud Proxmox, hors de portee de ce Prometheus).
          # Ce sont les certificats de charge de travail d'Istio : duree de vie
          # 24 h, renouvelement a mi-parcours. Valeur relevee le 2026-09-02 :
          # 76 385 s, soit 21 h -- l'etat NORMAL.
          #
          # Un seuil a sept jours, le reflexe qu'appelle un certificat public,
          # aurait tire EN PERMANENCE sur les cinq proxies. Sous une heure
          # restante, en revanche, la rotation a reellement echoue.
          expr: istio_agent_cert_expiry_seconds < 3600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Certificat Istio de {{ $labels.pod }} expire dans
              {{ $value | humanizeDuration }} : la rotation a echoue

    # =======================================================================
    #  CHAINE DE TELEMETRIE
    # -----------------------------------------------------------------------
    #  ⚠️ REMPLACE le groupe `urbanlink.otel`, dont la regle principale
    #  (OTelCollectorDrops) visait `otelcol_exporter_send_failed_spans_total`
    #  -- une metrique qui N'EXISTE PAS sur ce cluster. Le collecteur n'en
    #  expose que TROIS : `exporter_queue_size`, `exporter_queue_capacity`,
    #  `processor_batch_metadata_cardinality`.
    #
    #  La cause est instructive : le SDK OpenTelemetry-Go n'instancie un
    #  instrument qu'au PREMIER enregistrement. Aucun span n'ayant jamais
    #  transite -- le backend n'avait pas `OTEL_EXPORTER_OTLP_ENDPOINT` --
    #  aucun compteur n'a jamais ete cree. La regle surveillait l'absence de
    #  pertes dans un tuyau vide.
    # =======================================================================
    - name: urbanlink.telemetry
      rules:
        - alert: TelemetryPipelineSilent
          # ⚠️ LE `or absent(...)` EST LE COEUR DE LA REGLE, pas une precaution.
          #
          # Sans lui, `sum(rate(metrique_inexistante[15m])) == 0` rend un
          # VECTEUR VIDE : la comparaison ne produit aucune serie et l'alerte
          # ne tire pas. C'est precisement le mecanisme qui a laisse la chaine
          # OTel morte pendant des semaines sans un mot.
          #
          # Cette regle est ecrite pour etre VRAIE AVANT que la metrique
          # n'existe. C'est le seul moyen de detecter un pipeline qui n'a
          # jamais demarre, par opposition a un pipeline qui s'est arrete.
          #
          # ⚠️ LE SILENCE SEUL NE PROUVE RIEN : sans trafic, il n'y a rien a
          # tracer, et `/health` comme `/metrics` sont volontairement exclus de
          # l'instrumentation. Une nuit calme aurait donc declenche cette
          # alerte. Le second membre exige qu'il y ait REELLEMENT des requetes a
          # tracer -- hors sondes -- avant de conclure que le tuyau est casse.
          expr: >-
            (
              sum(rate(tempo_distributor_spans_received_total[30m])) == 0
              and
              sum(rate(urbanconnect_http_requests_total{
                route!~"/health.*|/metrics"
              }[30m])) > 0.05
            )
            or absent(tempo_distributor_spans_received_total)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Des requetes arrivent mais aucune trace n'atteint Tempo depuis
              30 min. Verifier OTEL_EXPORTER_OTLP_ENDPOINT sur backend et
              temporal-worker, et que `import '../tracing'` est bien la
              PREMIERE ligne de leur point d'entree

        - alert: LogPipelineSilent
          # Les journaux passent par le pont `otel-log-bridge.ts` : `sdk-node`
          # n'instrumente pas `process.stdout`, et sans ce pont Loki demarre et
          # ne recoit JAMAIS rien -- un second silence possible, distinct du
          # precedent.
          #
          # ⚠️ ICI, `absent()` SEUL -- PAS DE DETECTION D'ARRET, et c'est
          # delibere. Contrairement aux traces, les journaux sont filtres par
          # NIVEAU (`OTEL_LOGS_MIN_LEVEL`, defaut `log`) : un backend qui se
          # porte bien n'ecrit rien apres son demarrage. Mesure le 2026-09-02,
          # une heure et demie apres le deploiement : 394 lignes ingerees au
          # boot, puis ZERO pendant plus de 30 minutes -- pendant que Tempo
          # recevait 0,42 span/s en continu. Le tuyau etait sain ; une regle
          # « zero ligne pendant 30 min » aurait crie tous les jours.
          #
          # Il n'existe pas de correlat fiable cote journaux (aucune metrique
          # ne dit « il aurait DU y avoir une ligne ici »). On surveille donc
          # ce qu'on sait affirmer : la metrique n'a jamais ete instanciee,
          # c'est-a-dire que Loki n'a JAMAIS rien recu -- exactement la panne
          # qui a dure des semaines sans un mot.
          expr: absent(loki_distributor_lines_received_total)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Loki n'a jamais recu la moindre ligne : le pont OTel des journaux
              n'a pas demarre. Verifier otel-log-bridge.ts,
              OTEL_EXPORTER_OTLP_ENDPOINT et OTEL_LOGS_MIN_LEVEL

        - alert: OTelQueueNearFull
          # La file d'export qui se remplit PRECEDE la perte : c'est le signal
          # qu'on veut voir avant que les spans commencent a tomber. Ses deux
          # metriques, elles, existent -- ce sont des jauges, toujours
          # rapportees.
          #
          # ⚠️ `on(exporter) group_left()` EST OBLIGATOIRE, et son absence est
          # un piege parfait. Les deux metriques existent, la division est
          # syntaxiquement valide, PromQL ne se plaint pas -- et le resultat
          # est vide, donc l'alerte muette.
          #
          # La cause : `otelcol_exporter_queue_size` porte une etiquette
          # `data_type` (`traces`, `logs`) que `otelcol_exporter_queue_capacity`
          # n'a PAS. L'appariement vectoriel par defaut exige des jeux
          # d'etiquettes identiques : aucune paire ne correspond.
          #
          # Releve le 2026-09-02 : l'expression sans `on(...)` rend 0 serie
          # alors que chaque metrique en porte 2. Le defaut etait present dans
          # la version precedente de ce fichier et n'avait jamais ete vu --
          # c'est la porte `check-queries.py` qui l'a nomme.
          expr: >-
            otelcol_exporter_queue_size
            / on(exporter) group_left()
            otelcol_exporter_queue_capacity
            > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Collecteur OTel : file d'export {{ $labels.exporter }} pleine a
              {{ $value | humanizePercentage }}

        - alert: TempoFlushFailing
          # Un flush qui echoue, c'est un bloc DEJA ACCEPTE qui n'atteindra
          # jamais le disque. L'ingestion peut donc etre verte pendant que la
          # donnee se perd -- d'ou une regle distincte des deux precedentes.
          expr: increase(tempo_ingester_failed_flushes_total[15m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Tempo : {{ $value | humanize }} ecritures de blocs echouees --
              des traces acceptees sont perdues

        - alert: LokiChunkFlushFailing
          expr: increase(loki_ingester_chunks_flush_failures_total[15m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Loki : {{ $value | humanize }} ecritures de chunks echouees --
              des journaux acceptes sont perdus

    # =======================================================================
    #  MESSAGERIE -- urbanlink.fr
    # -----------------------------------------------------------------------
    #  Cible statique `messagerie` (VM 140, hors cluster). Les metriques
    #  mail_* viennent d'une sonde locale posee par le role Ansible `mailcow`,
    #  qui tourne toutes les 15 minutes.
    #
    #  Ces six regles repondent a l'exigence qui a fait naitre ce chantier :
    #  ne pas se faire blacklister, et le SAVOIR immediatement si ca arrive.
    #
    #  ⚠️ Les deux dernieres ont ete ajoutees le 2026-09-20, APRES sept jours de
    #  panne que les quatre premieres n'ont pas vues. La lecon tient en une
    #  ligne : elles surveillaient toutes l'IP qu'on ESPERE utiliser, aucune
    #  l'IP qu'on utilise VRAIMENT.
    # =======================================================================
    - name: urbanlink.messagerie
      rules:
        - alert: MailIPBlacklisted
          # Une seule zone suffit a declencher : les grands fournisseurs
          # consultent plusieurs listes, et Spamhaus a lui seul ferme la porte
          # d'une bonne moitie d'Internet. `for: 10m` evite de tirer sur une
          # reponse DNS aberrante isolee.
          expr: max(mail_dnsbl_listed) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              L'IP d'emission de la messagerie est LISTEE en liste noire --
              le courrier sortant part en spam ou en rejet des maintenant
            description: >-
              Zone(s) concernee(s) : voir mail_dnsbl_listed. Demander le
              delistage sur le site de la liste, et chercher la cause AVANT
              (compte compromis, relais ouvert, plainte utilisateur).

        - alert: MailDNSBLProbeUnhealthy
          # Une sonde qui repond « propre » sans avoir pu interroger les listes
          # est pire qu'une sonde absente : elle rassure a tort. Le cas
          # concret est Spamhaus qui refuse les resolveurs publics et repond
          # 127.255.255.254 -- une reponse qui RESSEMBLE a une inscription.
          expr: mail_dnsbl_probe_healthy == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              La sonde des listes noires n'obtient plus de reponse exploitable
              -- la surveillance du blacklistage est AVEUGLE

        - alert: MailProbeStale
          # Sans cette regle, la sonde peut cesser de tourner sans que rien ne
          # le dise : les series gardent leur derniere valeur, rassurante.
          expr: time() - mail_dnsbl_last_check_timestamp_seconds > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              La sonde de la messagerie ne rend plus de resultat depuis plus
              d'une heure (minuteur mail-metrics.timer sur la VM 140)

        - alert: MailEgressIPWrong
          # ⚠️ L'ALERTE QUI MANQUAIT. Le 2026-09-13 a 06h54, un redemarrage de
          # systemd-networkd a efface les `ip rule` du tunnel : les conteneurs
          # Mailcow sont retombes sur la route par defaut du lab et ont emis
          # depuis l'IP de la maison, en liste noire Spamhaus.
          #
          # Les quatre regles ci-dessus sont TOUTES restees vertes pendant sept
          # jours. Le tunnel etait UP. La file etait vide -- Gmail acceptait les
          # messages, il les classait simplement en indesirables. Et
          # `mail_dnsbl_listed` interrogeait l'IP du VPS, restee propre, alors
          # que plus un seul courrier n'en partait.
          #
          # La panne a ete decouverte a la main, en lisant les en-têtes d'un
          # message recu. C'est exactement ce qu'une supervision doit eviter.
          # DEUX signaux, et l'ordre compte. `mail_egress_route_ok` interroge la
          # decision de routage du noyau : exact, sans cache, et TESTABLE --
          # retirer la regle le fait basculer dans la seconde. C'est lui qui
          # porte l'alerte. `mail_egress_ip_correct` mesure l'IP vue par le
          # monde : il attrape en plus un SNAT casse sur le VPS, mais il passe
          # par un resolveur qui met en cache, donc il peut retarder.
          expr: mail_egress_route_ok == 0 or mail_egress_ip_correct == 0
          # Court, et c'est delibere : chaque minute passee dans cet etat est du
          # courrier rejete par Outlook et classe en indesirables par Gmail. La
          # sonde tourne toutes les 15 min, donc `for` ne lisse rien de plus.
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: >-
              La messagerie n'emet PLUS par le VPS -- Outlook rejette et Gmail
              classe en indesirables des maintenant
            description: >-
              Voir mail_egress_ip_info pour l'adresse reellement utilisee.
              Cause la plus probable : les regles de routage par politique ont
              ete effacees sur la VM 140. Remede immediat
              `systemctl start mail-tunnel-rules`, puis verifier que
              /etc/systemd/networkd.conf.d/10-regles-etrangeres.conf est bien
              en place et que networkd a ete redemarre depuis son depot.

        - alert: MailEgressProbeUnhealthy
          # Meme raisonnement que MailDNSBLProbeUnhealthy : une sonde qui ne
          # mesure plus ne doit pas se taire. Sans cette regle,
          # `mail_egress_ip_correct` disparaitrait des series et l'alerte
          # ci-dessus cesserait simplement de se declencher -- en silence.
          expr: mail_egress_probe_healthy == 0
          for: 45m
          labels:
            severity: warning
          annotations:
            summary: >-
              La sonde ne peut plus determiner l'IP d'emission reelle de la
              messagerie -- la surveillance de la fuite de routage est AVEUGLE

        - alert: MailQueueNotDraining
          # Le premier symptome d'un tunnel WireGuard coupe, ou d'un grand
          # fournisseur qui refuse les remises. Rien ne casse visiblement --
          # les messages s'accumulent en silence, et c'est pour cela qu'il
          # faut une alerte.
          expr: mail_queue_size > 50 or mail_queue_deferred > 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              La file d'attente de la messagerie ne s'ecoule pas
              ({{ $value }} messages) -- verifier le tunnel vers le VPS et les
              journaux de postfix-mailcow
    # =======================================================================
    #  CE QUI N'EST DELIBEREMENT PAS SURVEILLE
    # -----------------------------------------------------------------------
    #  Ces absences sont des DECISIONS, pas des oublis. Les ecrire evite qu'on
    #  ajoute un jour une regle sur une metrique qui n'existe pas -- l'erreur
    #  que ce fichier corrige.
    #
    #  1. LES BANQUES DE DONNEES. Ni Postgres, ni Redis, ni Kafka, ni
    #     Elasticsearch n'exposent de metriques a ce Prometheus : aucun
    #     exporter n'est deploye. Aucune regle ne peut donc parler de
    #     connexions saturees, de retard de consommateur Kafka ou de sante de
    #     shard. Trois exporters a deployer : un chantier distinct.
    #     Ce qu'on a en attendant : leur presence L4 dans le maillage
    #     (MeshTCPConnectionFailures) et leurs ressources conteneur
    #     (HighMemoryUsage, OOMKillDetected).
    #
    #  2. LE PLAN DE CONTROLE. `etcd`, `kube-controller-manager`,
    #     `kube-scheduler` et `kube-proxy` n'ecoutent que sur la boucle locale
    #     du noeud (verifie dans /etc/kubernetes/manifests). Leurs
    #     ServiceMonitors sont desactives dans les valeurs Helm, sans quoi
    #     quatre cibles seraient DOWN en permanence -- et PrometheusTargetDown
    #     tirerait en continu, rendant le reste illisible.
    #
    #  3. LE CERTIFICAT PUBLIC `*.urbanlink.fr`. Obtenu et renouvele par
    #     CERTBOT sur le noeud Proxmox (role tls_certificates), hors de portee
    #     de ce Prometheus. `certmanager_certificate_expiration_timestamp_seconds`
    #     n'existe nulle part ici -- cert-manager n'est pas installe. Une regle
    #     dessus donnerait l'illusion d'une surveillance qui n'aurait jamais
    #     tire, meme un certificat expire. Le surveiller vraiment demande une
    #     sonde depuis le noeud (blackbox exporter sur le vhost, ou un controle
    #     du timer systemd de certbot).
    #     ⚠️ Ne pas confondre avec IstioCertNotRotating, qui porte sur les
    #     certificats INTERNES du maillage.
    #
    #  4. L'OCCUPATION PAR PVC. Impossible a mesurer : voir NodeDiskFillingUp.
    # =======================================================================
