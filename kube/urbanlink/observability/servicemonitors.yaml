# ============================================================================
#  ServiceMonitor -- collecte des services applicatifs par kube-prometheus-stack
# ----------------------------------------------------------------------------
#  Ces quatre objets REMPLACENT les `additionalScrapeConfigs` du meme nom qui
#  vivaient dans les valeurs Helm du chart.
#
#  POURQUOI CE CHANGEMENT. Un `static_configs` sur `backend.urbanconnect.svc:4000`
#  vise le ClusterIP : UNE cible, que kube-proxy repartit entre les replicas. Le
#  Deployment `backend` en a DEUX. Prometheus atteignait donc un pod tire au sort
#  a chaque scrape, et lisait une seule serie alimentee alternativement par deux
#  compteurs desynchronises. Releve le 2026-09-02 sur `/graphql` 200, pas de 30 s :
#
#    2531 -> 2511 -> 2535 -> 2514 -> 2541 -> 2532 -> 2581 -> 2604 -> 2567 -> 2606
#
#  Chaque descente est lue par PromQL comme une remise a zero de compteur, et
#  `rate()` ajoute alors la valeur ENTIERE au lieu de la difference. Tout ce qui
#  derivait d'un compteur `urbanconnect_*` etait donc gonfle : debit de requetes,
#  taux d'erreur 5xx, debit Kafka, requetes Prisma -- et l'alerte
#  BackendHighErrorRate avec.
#
#  Un ServiceMonitor decouvre les ENDPOINTS du Service, pas son ClusterIP :
#  un pod = une cible = une serie. C'est le seul correctif ; augmenter
#  l'intervalle ou lisser la fenetre n'y aurait rien change.
#
#  ⚠️ LE LABEL `release: kube-prometheus-stack` EST OBLIGATOIRE. C'est le
#  `serviceMonitorSelector` par defaut du chart. Sans lui l'objet est cree, Argo
#  l'affiche « Synced » et « Healthy », et Prometheus l'ignore -- exactement le
#  silence decrit dans prometheus-alias.yaml a propos du selecteur du Service.
#
#  ⚠️ L'operateur pose lui-meme un label `service` valant le nom du Service. Le
#  backend expose deja un label `service="urbanconnect-backend"` (prom-client) :
#  il y a collision, et la cible gagne. La valeur de l'application survit sous
#  `exported_service`. Aucune requete de ce depot ne s'appuie sur `service` --
#  toutes filtrent sur `job`, pose explicitement ci-dessous.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: urbanconnect-backend
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      # `GET /metrics` du backend exige un Bearer et repond 403 sans lui
      # (MetricsController : « l'absence de jeton FERME l'endpoint plutot que de
      # l'ouvrir »). L'operateur resout cette reference au moment d'ecrire la
      # configuration -- plus de `credentials_file` dont le chemin de montage
      # devait etre devine.
      #
      # ⚠️ Le Secret doit vivre dans le MEME namespace que ce ServiceMonitor.
      # Les deux sont dans `urbanconnect`.
      authorization:
        type: Bearer
        credentials:
          name: urbanconnect-secrets
          key: METRICS_TOKEN
      relabelings:
        # L'operateur pose `job` = nom du Service, soit « backend ». On garde le
        # nom historique : c'est celui qu'interrogent les alertes et les
        # tableaux de bord.
        - targetLabel: job
          replacement: urbanconnect-backend
        # Explicite plutot qu'implicite : c'est ce label qui permet de dire
        # LEQUEL des deux replicas derive.
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: otel-collector
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: otel-collector
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tempo
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: tempo
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: loki
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: loki
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
# ============================================================================
#  Kratos -- les connexions et les inscriptions, sans une ligne de code
# ----------------------------------------------------------------------------
#  Kratos compte DEJA tout ce qu'on voulait mesurer, sur son port ADMIN (4434),
#  chemin `/metrics/prometheus`. Releve dans le pod le 2026-09-18 :
#
#    POST /self-service/login        303  connexion reussie
#    POST /self-service/login        400  identifiants refuses
#    POST /self-service/registration 303  inscription
#    GET  /self-service/methods/oidc/callback/{param}  passage par Google
#
#  Il n'etait pas scrape. Aucune de ces series n'existait dans Prometheus, et
#  aucun tableau de bord ne pouvait dire combien de gens se connectent.
#
#  ⚠️ LE PIEGE EST DANS LES ETIQUETTES, PAS DANS LE SCRAPE.
#  Kratos attache `buildTime`, `hash` et `version` a CHAQUE serie. Elles
#  changent a chaque montee de version : sans le `metricRelabelings` ci-dessous,
#  chaque mise a jour de Kratos creerait un jeu de series entierement neuf, les
#  anciennes resteraient en memoire pour toujours, et un `rate()` sur une
#  fenetre couvrant la montee de version rendrait n'importe quoi -- l'ancienne
#  serie s'arrete, la nouvelle repart de zero, et PromQL lit une remise a zero
#  de compteur sur une serie qui n'a pas redemarre.
#
#  C'est exactement la regle que `metrics.registry.ts` s'impose cote applicatif.
#  Elle vaut pour ce qu'on SCRAPE autant que pour ce qu'on ECRIT.
#
#  ⚠️⚠️ **LE CHEMIN SE LIT SOUS `exported_endpoint`, PAS SOUS `endpoint`.**
#  Verifie sur le cluster le 2026-09-18, apres deploiement :
#
#      endpoint          = "admin"                 <- pose par l'operateur,
#                                                     c'est le NOM DU PORT du
#                                                     Service. Aucun interet.
#      exported_endpoint = "/self-service/login"   <- ce que Kratos expose,
#                                                     et ce qu'on veut lire.
#
#  Meme collision que pour `service`, decrite en tete de ce fichier : la cible
#  gagne, la valeur de l'application survit prefixee. Une requete ecrite
#  naturellement -- `endpoint="/self-service/login"` -- rend donc LE VIDE, sans
#  erreur, et le panneau se lit comme un systeme calme.
#
#  ⚠️ Aucune relabelisation n'a ete posee pour « reparer » ce nom. Le depot a
#  deja choisi, pour `service`, d'assumer la collision et de la documenter
#  plutot que de la contourner : une regle de plus qui reecrit des etiquettes
#  est une regle de plus qui peut rater en silence. La porte
#  `check-queries.py` refuse une expression qui rend le vide -- c'est elle qui
#  attrapera un `exported_` oublie.
#
#  ⚠️ `http_requests_total` est un nom GENERIQUE, sans prefixe `kratos_`. Toute
#  requete portant sur ces series DOIT filtrer sur `job="kratos"` : sans ce
#  filtre, elle agregerait silencieusement les series homonymes d'un autre
#  exportateur pose plus tard.
#
#  ⚠️ Le port 4434 est l'API d'ADMINISTRATION de Kratos, non authentifiee. Ce
#  ServiceMonitor n'y ouvre RIEN de nouveau : il n'atteint que le chemin
#  `/metrics/prometheus`, en lecture, depuis l'interieur du cluster. Le Service
#  `kratos` exposait deja ce port ; c'est sa protection reseau, et non ce
#  fichier, qui repond de son acces.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kratos
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kratos
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    # Port NOMME `admin` dans le Service (4433 = `public`, qui n'expose aucune
    # metrique). Verifie le 2026-09-18 : `kubectl get svc kratos` rend bien
    # `public -> 4433` et `admin -> 4434`.
    - port: admin
      path: /metrics/prometheus
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: kratos
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
      metricRelabelings:
        - action: labeldrop
          regex: (buildTime|hash|version)
