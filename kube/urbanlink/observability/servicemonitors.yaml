# ============================================================================
#  ServiceMonitor -- collecte des services applicatifs par kube-prometheus-stack
# ----------------------------------------------------------------------------
#  Ces quatre objets REMPLACENT les `additionalScrapeConfigs` du meme nom qui
#  vivaient dans les valeurs Helm du chart.
#
#  POURQUOI CE CHANGEMENT. Un `static_configs` sur `backend.urbanconnect.svc:4000`
#  vise le ClusterIP : UNE cible, que kube-proxy repartit entre les replicas. Le
#  Deployment `backend` en a DEUX. Prometheus atteignait donc un pod tire au sort
#  a chaque scrape, et lisait une seule serie alimentee alternativement par deux
#  compteurs desynchronises. Releve le 2026-09-02 sur `/graphql` 200, pas de 30 s :
#
#    2531 -> 2511 -> 2535 -> 2514 -> 2541 -> 2532 -> 2581 -> 2604 -> 2567 -> 2606
#
#  Chaque descente est lue par PromQL comme une remise a zero de compteur, et
#  `rate()` ajoute alors la valeur ENTIERE au lieu de la difference. Tout ce qui
#  derivait d'un compteur `urbanconnect_*` etait donc gonfle : debit de requetes,
#  taux d'erreur 5xx, debit Kafka, requetes Prisma -- et l'alerte
#  BackendHighErrorRate avec.
#
#  Un ServiceMonitor decouvre les ENDPOINTS du Service, pas son ClusterIP :
#  un pod = une cible = une serie. C'est le seul correctif ; augmenter
#  l'intervalle ou lisser la fenetre n'y aurait rien change.
#
#  ⚠️ LE LABEL `release: kube-prometheus-stack` EST OBLIGATOIRE. C'est le
#  `serviceMonitorSelector` par defaut du chart. Sans lui l'objet est cree, Argo
#  l'affiche « Synced » et « Healthy », et Prometheus l'ignore -- exactement le
#  silence decrit dans prometheus-alias.yaml a propos du selecteur du Service.
#
#  ⚠️ L'operateur pose lui-meme un label `service` valant le nom du Service. Le
#  backend expose deja un label `service="urbanconnect-backend"` (prom-client) :
#  il y a collision, et la cible gagne. La valeur de l'application survit sous
#  `exported_service`. Aucune requete de ce depot ne s'appuie sur `service` --
#  toutes filtrent sur `job`, pose explicitement ci-dessous.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: urbanconnect-backend
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      # `GET /metrics` du backend exige un Bearer et repond 403 sans lui
      # (MetricsController : « l'absence de jeton FERME l'endpoint plutot que de
      # l'ouvrir »). L'operateur resout cette reference au moment d'ecrire la
      # configuration -- plus de `credentials_file` dont le chemin de montage
      # devait etre devine.
      #
      # ⚠️ Le Secret doit vivre dans le MEME namespace que ce ServiceMonitor.
      # Les deux sont dans `urbanconnect`.
      authorization:
        type: Bearer
        credentials:
          name: urbanconnect-secrets
          key: METRICS_TOKEN
      relabelings:
        # L'operateur pose `job` = nom du Service, soit « backend ». On garde le
        # nom historique : c'est celui qu'interrogent les alertes et les
        # tableaux de bord.
        - targetLabel: job
          replacement: urbanconnect-backend
        # Explicite plutot qu'implicite : c'est ce label qui permet de dire
        # LEQUEL des deux replicas derive.
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: otel-collector
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: otel-collector
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tempo
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: tempo
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: urbanconnect
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: loki
  namespaceSelector:
    matchNames: [urbanconnect]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: loki
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
