apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: urbanconnect
  labels:
    app: tempo
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args:
            - -config.file=/etc/tempo.yaml
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
              readOnly: true
            - name: tempo-data
              mountPath: /var/tempo
          env:
            # Le tas Go grossit jusqu'a la limite du cgroup avant que le
            # ramasse-miettes ne se presse : sans plafond logiciel, c'est le
            # noyau qui tranche (exit 137). ~85 % de la limite ci-dessous.
            - name: GOMEMLIMIT
              value: "1300MiB"
          resources:
            # 512Mi ne tenait pas : 824 redemarrages en 36 jours, tous des
            # OOM du cgroup (anon-rss ~519 Mo). Le compacteur charge en
            # memoire des traces geantes (« max size of trace exceeded »,
            # 3439 spans jetes sur une seule trace sans racine).
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: observability-config
            items:
              - key: tempo.yaml
                path: tempo.yaml
  volumeClaimTemplates:
    - metadata:
        name: tempo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi