# Service d'alias vers le Prometheus de kube-prometheus-stack.
#
# kube-prometheus-stack nomme son Service `prometheus-kube-prometheus-prometheus`
# dans le namespace urbanconnect. Les datasources provisionnees
# (grafana-datasources.yaml, source de verite) pointent pourtant sur
# `prometheus.urbanconnect.svc.cluster.local:9090` -- la convention historique
# du Prometheus applicatif standalone. Ce Service d'alias garde ces URLs stables
# sans rien changer aux datasources : il selectionne les memes pods.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: urbanconnect
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kube-prometheus-stack
spec:
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kube-prometheus-stack
  ports:
    - name: http
      port: 9090
      targetPort: 9090