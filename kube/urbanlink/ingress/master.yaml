# ============================================================================
# « MASTER » — politique d'edge partagée (équivalent Traefik du master nginx).
# ----------------------------------------------------------------------------
# Traefik n'a pas de master/minion. Le rôle « master » (concerns transverses :
# sécurité edge + TLS) est ici centralisé dans des objets réutilisables que les
# child IngressRoutes référencent :
#
#   - Middleware `uc-edge`       : chaîne appliquée à TOUTES les routes → crowdsec
#   - Middleware `uc-edge-auth`  : chaîne pour l'API → crowdsec + oathkeeper-auth
#   - TLSOption   `uc-tls`       : politique TLS commune (versions/ciphers)
#
# Ajouter/retirer un child = créer/supprimer un IngressRoute qui pointe vers ces
# objets — sans toucher au master. Modifier la sécurité globale = éditer `uc-edge`
# ici, tous les children en héritent.
# ============================================================================

# ------------------------------------------------------------ Chaîne edge de base
# crowdsec (bouncer + AppSec WAF) devant TOUT. Référencée par les routes publiques
# et internes qui n'ont pas besoin d'auth applicative Kratos.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uc-edge
  namespace: urbanconnect
spec:
  chain:
    middlewares:
      - name: crowdsec
---
# --------------------------------------------------- Chaîne edge + auth (API)
# crowdsec PUIS oathkeeper-auth : on rejette les IP/requêtes malveillantes avant
# de dépenser un appel de validation de session Kratos.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uc-edge-auth
  namespace: urbanconnect
spec:
  chain:
    middlewares:
      - name: crowdsec
      - name: oathkeeper-auth
---
# --------------------------------------------------------- Politique TLS commune
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: uc-tls
  namespace: urbanconnect
spec:
  minVersion: VersionTLS12
  sniStrict: true
