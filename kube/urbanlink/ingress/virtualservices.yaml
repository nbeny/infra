# ----------------------------------------- interne : Kiali (graphe du mesh)
#  Kiali et Prometheus vivent dans istio-system, pas dans urbanconnect. Un
#  `destination.host` en FQDN complet traverse les namespaces : Istio l'admet
#  tant que le Service n'a pas d'`exportTo` restrictif, ce qui est le cas ici.
#
#  Ils tournaient depuis l'installation d'Istio (k8s_istio_observability) mais
#  n'etaient joignables que par `kubectl port-forward`.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: uc-kiali
  namespace: urbanconnect
  labels:
    uc.ingress/tier: internal
spec:
  hosts:
    - "kiali.urbanlink.fr"
  gateways:
    - uc-gateway
  http:
    - route:
        - destination:
            host: kiali.istio-system.svc.cluster.local
            port:
              number: 20001
---
# -------------------------------------------------- interne : Prometheus
#  ⚠️ IL N'Y A PLUS QU'UN SEUL PROMETHEUS, depuis le 2026-09-02. Ce nom
#  desservait l'addon d'Istio (istio-system), qui ne portait que la telemetrie
#  du mesh -- et jamais les metriques metier `urbanconnect_*` ni les alertes.
#  Chercher une metrique applicative ici etait une perte de temps garantie.
#
#  L'addon a ete supprime, sa collecte reprise par le kube-prometheus-stack
#  (job `kubernetes-pods`, cf. kube-prometheus-stack-values.yaml.j2). Ce nom
#  pointe donc maintenant sur le Prometheus consolide, qui porte les DEUX
#  familles de metriques.
#
#  Le Service `prometheus` de istio-system existe toujours, mais en
#  `ExternalName` vers celui-ci : Kiali et la source de donnees Grafana
#  « mesh » le nomment en dur. On ne passe PAS par lui ici -- router un
#  VirtualService vers un ExternalName ajoute une indirection pour rien.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: uc-prometheus
  namespace: urbanconnect
  labels:
    uc.ingress/tier: internal
spec:
  hosts:
    - "prometheus.urbanlink.fr"
  gateways:
    - uc-gateway
  http:
    - route:
        - destination:
            # Service d'alias, cf. observability/prometheus-alias.yaml.
            host: prometheus.urbanconnect.svc.cluster.local
            port:
              number: 9090
---
# --------------------------------------------- interne : Argo CD (GitOps)
#  Meme figure que Kiali : le Service vit dans un autre namespace (`argocd`),
#  le FQDN complet traverse la frontiere.
#
#  ⚠️ PORT 80, PAS 443. Le Service argocd-server publie les deux, mais ils
#  pointent le MEME port de conteneur (8080) : c'est le serveur qui detecte le
#  protocole. Viser 443 en clair depuis la passerelle lui enverrait du HTTP sur
#  un port qu'il traite en TLS.
#
#  ⚠️ Et ce nom ne repond correctement que si argocd-server tourne en
#  `--insecure` (server.insecure dans argocd-cmd-params-cm, pose par
#  playbooks/32-argocd.yml). Sinon il repond 307 vers https://argo.urbanlink.fr
#  a chaque requete -- or nginx a DEJA termine le TLS et relaie en clair, donc
#  la requete suivante est identique : boucle de redirection, sans erreur nulle
#  part dans les journaux.
#
#  Le client `argocd` en ligne de commande passe par ce meme nom, mais son gRPC
#  ne survit pas au relais HTTP/1.1 de nginx : utiliser `--grpc-web`.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: uc-argocd
  namespace: urbanconnect
  labels:
    uc.ingress/tier: internal
spec:
  hosts:
    - "argo.urbanlink.fr"
  gateways:
    - uc-gateway
  http:
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80
