# ============================================================================
#  Routes -- remplacent les 8 IngressRoute Traefik
# ----------------------------------------------------------------------------
#  Un IngressRoute Traefik melange le routage et la politique edge. Istio
#  separe les deux : le VirtualService route, l'AuthorizationPolicy applique la
#  politique (voir authorization.yaml). C'est pour cela qu'il n'y a plus de
#  reference aux chaines `uc-edge` / `uc-edge-auth` ici.
# ============================================================================

# ------------------------------------------------------- public : frontend
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: uc-frontend
  namespace: urbanconnect
  labels:
    uc.ingress/tier: public
spec:
  hosts:
    - "urbanlink.fr"
    - "www.urbanlink.fr"
  gateways:
    - uc-gateway
  http:
    - route:
        - destination:
            host: frontend.urbanconnect.svc.cluster.local
            port:
              number: 3000
---
# ------------------------------------------------------------ public : API
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: uc-api
  namespace: urbanconnect
  labels:
    uc.ingress/tier: public
spec:
  hosts:
    - "api.urbanlink.fr"
  gateways:
    - uc-gateway
  http:
    # La regle Traefik etait :
    #   Host(`api.urbanlink.fr`) && !PathPrefix(`/metrics`) && !PathPrefix(`/health`)
    # Le `!PathPrefix` retirait ces chemins de la ROUTE : ils n'etaient pas
    # servis publiquement du tout. Istio n'a pas de negation dans un match,
    # d'ou ces deux regles placees AVANT la route par defaut -- l'ordre est
    # significatif, la premiere qui correspond gagne.
    - match:
        - uri:
            prefix: /metrics
        - uri:
            prefix: /health
      directResponse:
        status: 404
        body:
          string: "not exposed publicly\n"
    - route:
        - destination:
            host: backend.urbanconnect.svc.cluster.local
            port:
              number: 4000
---
