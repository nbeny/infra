apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nominatim
  namespace: urbanconnect
  labels:
    app: nominatim
spec:
  serviceName: nominatim
  replicas: 1
  selector:
    matchLabels:
      app: nominatim
  template:
    metadata:
      labels:
        app: nominatim
    spec:
      # ⚠️ 30 s (le defaut) NE SUFFISENT PAS a arreter proprement ces 95 Go.
      # `service postgresql stop` fait un checkpoint d'arret ; passe le delai,
      # le kubelet envoie SIGKILL et la base repart SALE. Au demarrage suivant,
      # PostgreSQL fsync alors CHAQUE fichier du repertoire de donnees
      # (« syncing data directory (fsync) ») -- des minutes sur le disque a
      # plateaux qui porte pool2 -- pendant que `pg_ctl` renonce au bout de 60 s
      # sur « server did not start in time ». Le conteneur sort en 1, le kubelet
      # le relance, et l'arret brutal suivant reconduit la panne : c'est une
      # BOUCLE, pas un incident. Mesuree 9 fois entre le 04/09 et le 07/09/2026.
      terminationGracePeriodSeconds: 600
      # Nominatim a besoin de beaucoup de RAM pour l'import initial
      # En prod : utiliser une image pré-construite avec les données déjà importées
      # plutôt que de relancer l'import au démarrage (PBF_URL télécharge ~30Go)
      containers:
        - name: nominatim
          image: mediagis/nominatim:5.2
          ports:
            - containerPort: 8080
          # Parametres d'import : ConfigMap `nominatim-config`, construite par
          # playbooks/31-urbanlink-deploy.yml depuis config/prod/nominatim/ du
          # depot APPLICATIF. C'est la que vivent PBF_URL, REPLICATION_URL,
          # IMPORT_*, UPDATE_MODE et THREADS -- avec, en commentaire, ce que
          # chacun coute en temps, en disque et en memoire.
          #
          # ⚠️ Changer PBF_URL sur un PVC deja importe ne reimporte RIEN :
          # l'image ne lance l'import que sur une base vide. Basculer de region
          # suppose de supprimer le PVC.
          envFrom:
            - configMapRef:
                name: nominatim-config
          env:
            # Le filet de securite de l'autre bout : si la base repart quand
            # meme sale (arret non gracieux, coupure de courant), il lui faut le
            # temps de rejouer. Lu par `pg_ctl` LUI-MEME, pas par
            # `pg_ctlcluster` -- inutile de chercher la variable dans son code,
            # elle n'y est pas. Defaut : 60 s, d'ou l'echec.
            - name: PGCTLTIMEOUT
              value: "1800"
            # Seul le mot de passe reste ici : le reste est versionne.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: NOMINATIM_DB_PASSWORD
          volumeMounts:
            - name: nominatim-data
              mountPath: /var/lib/postgresql/16/main
            # Shared memory simulée en K8s (équivalent shm_size: 20gb)
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 4000m
              # ⚠️ 16Gi NE SUFFIT PAS a l'import de l'Europe. Mesure le
              # 31/08/2026 : `osm2pgsql` a ete tue par le OOM killer du cgroup a
              # 01:10 avec 14,2 Go de RSS, et le conteneur relance est reste
              # colle a 16383 Mo -- exactement son plafond -- pendant des heures.
              #
              # Ce n'etait pas une pression memoire de la machine : la VM a 94 Go
              # dont 80 disponibles. C'est la limite du conteneur, et elle seule,
              # qui tuait l'import.
              #
              # Cette meme saturation explique les 89 et 93 redemarrages du
              # kube-controller-manager et du kube-scheduler sur la meme periode :
              # sous la pression, l'apiserver ne repondait plus dans les 5 s du
              # renouvellement de bail, les deux perdaient l'election et
              # sortaient en `leaderelection lost`.
              #
              # ⚠️ Modifier ce bloc RECREE le pod, donc REPART L'IMPORT DE ZERO
              # (plusieurs heures). Pour relever la limite d'un import en cours,
              # passer par le redimensionnement a chaud, qui ne redemarre pas le
              # conteneur :
              #   kubectl -n urbanconnect patch pod nominatim-0 \
              #     --subresource resize --type merge \
              #     -p '{"spec":{"containers":[{"name":"nominatim",
              #          "resources":{"limits":{"memory":"32Gi"}}}]}}'
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /search?q=paris&format=json
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
      volumes:
        # Shared memory (équivalent de shm_size: 20gb dans docker-compose)
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
  volumeClaimTemplates:
    - metadata:
        name: nominatim-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi  # Europe OSM + index PostgreSQL
