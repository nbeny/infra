version: v1.0.0

# ============================================================================
# Configuration Kratos — PRODUCTION (Kubernetes, urbanlink.fr)
# ----------------------------------------------------------------------------
# ⚠️ **CE FICHIER EST LE SEUL DE config/ QUI NE SE PROPAGE PAS ENTIÈREMENT.**
#
# Son contenu part bien dans la ConfigMap `kratos-config` à chaque push sur
# `main` : la CI le recopie dans `nbeny/infra`, le `configMapGenerator` en
# change le hash, Argo CD redéploie, le pod redémarre.
#
# Mais le bloc `selfservice.methods.oidc.config.providers` ci-dessous sert
# AUSSI de gabarit à la variable `KRATOS_OIDC_PROVIDERS` du Secret
# `urbanconnect-secrets` : le playbook `31-urbanlink-deploy.yml` du dépôt infra
# lit cette structure et y injecte les vrais identifiants Google. Un Secret ne
# vient jamais de git — donc jamais de la CI.
#
# ⇒ Modifier les FOURNISSEURS (en ajouter un, changer un `id`) impose de
#   rejouer `ansible-playbook playbooks/31-urbanlink-deploy.yml`. Tout le reste
#   du fichier se propage tout seul.
#
# ⚠️ Et l'oubli est MUET : Kratos démarre, tout fonctionne, seule la connexion
# du fournisseur concerné répond « Impossible d'initier la connexion ».
# ----------------------------------------------------------------------------
# Le pendant de `config/dev/kratos/kratos.yml`, avec TOUTES les URLs pointant
# sur urbanlink.fr. Le nom du fichier ne change pas d'un environnement à
# l'autre, seul son contenu : le manifest qui le monte n'a donc jamais à
# savoir où il tourne.
#
# ⚠️ Ces URLs ne se surchargent PAS par variable d'environnement. Kratos sait
# reconnaître `SERVE_PUBLIC_BASE_URL` ou `COURIER_SMTP_*`, mais pas les
# `ui_url` des flows self-service, qui vivent sous un champ imbriqué. C'est
# donc CE fichier qui décide où le navigateur est redirigé — changer l'env ne
# suffira jamais.
#
#   - Front public   : https://urbanlink.fr
#   - Kratos public  : https://auth.urbanlink.fr   (Istio → service kratos:4433)
#   - Kratos admin   : http://kratos:4434          (interne au cluster, jamais exposé)
#
# Monté sous /etc/config/kratos/kratos.yml par la ConfigMap `kratos-config`,
# construite depuis config/common/kratos/ + config/prod/kratos/ par le
# playbook de déploiement du dépôt infra.
#
# ⚠️ Google OAuth : l'URI de redirection à déclarer dans la Google Console est
#   https://auth.urbanlink.fr/self-service/methods/oidc/callback/google
# ============================================================================

dsn: env://DSN

serve:
  public:
    base_url: https://auth.urbanlink.fr/
    cors:
      enabled: true
      allowed_origins:
        - https://urbanlink.fr
        - https://api.urbanlink.fr
        - https://auth.urbanlink.fr
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-CSRF-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

cookies:
  path: /
  same_site: Lax
  # Cookies de session valables sur tous les sous-domaines urbanlink.fr
  domain: urbanlink.fr

selfservice:
  default_browser_return_url: https://urbanlink.fr/
  allowed_return_urls:
    - https://urbanlink.fr
    - https://urbanlink.fr/auth/callback
    - https://urbanlink.fr/profile/settings/two-factor

  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: UrbanConnect
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          # ⚠️ SECRET — NE JAMAIS committer le vrai client_secret ici.
          # Kratos ne sait PAS lire une valeur env pour un champ imbriqué de
          # provider oidc (env://GOOGLE_CLIENT_SECRET est un no-op, et
          # GOOGLE_CLIENT_ID/SECRET n'est reconnu par rien). Le seul override
          # qui atteint réellement le provider est le bloc `providers` ENTIER,
          # passé en JSON **BRUT** dans SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS.
          #
          # ⚠️ PAS en base64 : Kratos v26 ne le décode pas, et le YAML garde
          # alors son placeholder — Google répond `invalid_client` sans que rien
          # d'autre ne bouge. Ce fichier a longtemps annoncé « JSON base64 »,
          # ce qui était faux ; le compose, lui, le disait juste.
          #
          # Détail et générateur : config/common/kratos/CLAUDE.md et
          # config/common/kratos/scripts/gen-google-oidc-env.mjs.
          # La valeur ci-dessous est un PLACEHOLDER inopérant.
          - id: google
            provider: google
            client_id: CHANGE_ME.apps.googleusercontent.com
            client_secret: GOCSPX-REPLACE_VIA_ENV
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: true
                given_name:
                  essential: true

  flows:
    error:
      ui_url: https://urbanlink.fr/auth/error
    recovery:
      enabled: true
      ui_url: https://urbanlink.fr/auth/recovery
      use: code
      after:
        default_browser_return_url: https://urbanlink.fr/auth/resetPassword/success
    verification:
      enabled: true
      ui_url: https://urbanlink.fr/auth/verificationEmail
      use: code
      after:
        default_browser_return_url: https://urbanlink.fr/auth/verificationEmail/Sent/success
    logout:
      after:
        default_browser_return_url: https://urbanlink.fr/auth/login
    login:
      ui_url: https://urbanlink.fr/auth/login
      lifespan: 10m
      after:
        default_browser_return_url: https://urbanlink.fr/explore
        oidc:
          hooks:
            - hook: revoke_active_sessions
    registration:
      lifespan: 30m
      ui_url: https://urbanlink.fr/auth/register
      after:
        password:
          hooks:
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: show_verification_ui
    settings:
      ui_url: https://urbanlink.fr/profile/settings/two-factor
      privileged_session_max_age: 15m
      required_aal: highest_available

# ============================================================================
# Session — niveau d'assurance exigé pour être « connecté »
# ----------------------------------------------------------------------------
# ⚠️ SANS CE BLOC, LE SECOND FACTEUR EST FACULTATIF POUR CELUI QUI L'A ACTIVÉ.
#
# `selfservice.flows.settings.required_aal: highest_available` (plus haut) ne
# gouverne qu'une chose : l'accès à l'écran de RÉGLAGES. Ce qui décide si une
# session vaut « connecté » pour le reste de l'application, c'est
# `session.whoami.required_aal` — et son défaut est `aal1`.
#
# Conséquence mesurable : un membre qui a pris la peine d'activer le TOTP
# obtenait quand même une session pleinement valide en donnant SEULEMENT son
# mot de passe. `/sessions/whoami` répondait 200, le backend le considérait
# authentifié, il pouvait acheter, écrire, vendre. Le second facteur n'était
# jamais réclamé nulle part — il ne protégeait rien.
#
# `highest_available` signifie : exige le niveau le plus élevé que CE compte
# a configuré. Un compte sans second facteur reste à `aal1` et n'est donc pas
# gêné ; un compte qui en a un doit le présenter.
session:
  whoami:
    required_aal: highest_available

log:
  level: info
  format: text
  leak_sensitive_values: false

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    # ⚠️ 12 et non 8. Le coût bcrypt est un EXPOSANT : chaque unité double le
    # travail, donc 8 → 12 multiplie par seize l'effort d'un attaquant qui
    # rejoue un dump de mots de passe. Côté légitime, cela coûte ~250 ms de
    # calcul par connexion — invisible pour un humain. 12 est le défaut
    # recommandé par Ory ; 8 relevait d'un réglage de poste de développement
    # recopié tel quel en production.
    #
    # Le changement ne casse AUCUN compte existant : Kratos vérifie avec le
    # coût inscrit DANS le hachage stocké, puis re-hache au coût courant à la
    # connexion suivante. La migration se fait compte par compte, toute seule,
    # sans réinitialisation de mot de passe et sans fenêtre de bascule.
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  # connection_uri / from_address / from_name sont surchargés par les variables
  # d'env COURIER_SMTP_* du compose (SMTP Infomaniak). Valeurs par défaut ici.
  smtp:
    connection_uri: smtp://mailslurper:1025/?skip_ssl_verify=true
    from_address: contact@urbanlink.fr
    from_name: UrbanConnect
