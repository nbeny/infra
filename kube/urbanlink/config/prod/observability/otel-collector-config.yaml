# ============================================================================
#  Collecteur OpenTelemetry -- PRODUCTION (Kubernetes, namespace urbanconnect)
# ----------------------------------------------------------------------------
#  Meme role qu'en dev. Trois differences, toutes justifiees ci-dessous.
#
#  Il n'y a PAS de pipeline `metrics` : elles sont scrapees directement par le
#  Prometheus applicatif sur /metrics (voir prometheus.yml).
# ============================================================================

extensions:
  # Sonde de vivacite, interrogee par les probes de
  # `otel-collector/deployment.yaml` du depot infra. Le collecteur n'expose AUCUN
  # endpoint de sante par defaut : sans elle, la seule chose observable est que
  # le port OTLP accepte une connexion TCP -- ce qu'il fait meme quand la
  # chaine d'export vers Tempo est morte.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # (1) Etiquette d'environnement -- indexee par loki.yaml.
  resource:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: k8s.cluster.name
        value: urbanlink
        action: upsert

  # (2) Echantillonnage. En dev on garde tout : le volume est nul et une trace
  # manquante coute une demi-heure de reproduction. En production, garder 100 %
  # des traces d'un service qui rend 200 remplit le disque avec ce que personne
  # ne regardera jamais.
  #
  # `probabilistic_sampler` et non `tail_sampling` : le second decide APRES
  # avoir bufferise la trace entiere, ce qui demande de la memoire proportionnelle
  # au trafic -- exactement ce que `memory_limiter` est la pour empecher. Le
  # cout est de ne pas pouvoir dire « garde les traces en erreur » : c'est
  # assume tant que le trafic tient sur un noeud.
  probabilistic_sampler:
    sampling_percentage: 20

  # (3) Masquage. Une trace porte les attributs que l'instrumentation a poses,
  # y compris ceux d'en-tetes HTTP. Un cookie de session Kratos ou un
  # `Authorization` qui atterrit dans Tempo y reste sept jours, lisible par
  # quiconque ouvre Grafana. On les efface a l'entree du collecteur, pas plus
  # loin : c'est le seul point ou l'on est sur de tout voir passer.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

exporters:
  otlp/tempo:
    endpoint: tempo.urbanconnect.svc.cluster.local:4317
    tls:
      # En clair, et c'est voulu : le saut reste dans le cluster, ou le mTLS du
      # mesh Istio (mode ambient) chiffre deja de pod a pod. Un TLS applicatif
      # par-dessus n'ajouterait qu'un certificat a renouveler.
      insecure: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s

  otlphttp/loki:
    endpoint: http://loki.urbanconnect.svc.cluster.local:3100/otlp
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s

service:
  extensions: [health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/redact, probabilistic_sampler, batch]
      exporters: [otlp/tempo]
    logs:
      # Les journaux ne sont PAS echantillonnes : c'est la ligne d'erreur d'une
      # requete sur mille qu'on vient chercher. Ne garder qu'un cinquieme des
      # journaux reviendrait a supprimer quatre incidents sur cinq.
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/redact, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
