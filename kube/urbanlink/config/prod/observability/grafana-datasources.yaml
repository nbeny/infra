# ============================================================================
#  Grafana -- sources de donnees provisionnees, PRODUCTION (Kubernetes)
# ----------------------------------------------------------------------------
#  TROIS sources, comme en dev : Prometheus, Tempo, Loki.
#
#  ⚠️ IL Y EN AVAIT QUATRE. La quatrieme, « Prometheus (mesh Istio) », visait
#  `prometheus.istio-system.svc.cluster.local:9090` -- le Prometheus de l'addon
#  Istio, qui portait la telemetrie du maillage pendant que celui d'`urbanconnect`
#  portait les metriques metier. Deux serveurs, deux roles, deux entrees : c'etait
#  juste.
#
#  Ca ne l'est plus depuis la consolidation (depot infra, commit af9cc10). Il n'y
#  a PLUS QU'UN Prometheus ; le Service `prometheus` de `istio-system` a survecu
#  en `ExternalName` pointant sur lui, parce que Kiali le nomme en dur et que sa
#  configuration amont n'est pas modifiable depuis ces depots.
#
#  Les deux entrees interrogeaient donc le MEME serveur sous deux noms. Un
#  tableau de bord pouvait citer l'une ou l'autre sans difference visible, ce qui
#  est exactement la situation ou l'on finit par croire qu'on compare deux
#  mesures. Le mesh et le metier vivent dans un seul Prometheus : une source.
#
#  ⚠️ `${__value.raw}` porte UN SEUL dollar ici, contre deux en dev. Le double
#  est une echappement de docker compose, qui interpole les fichiers qu'il
#  monte ; Kubernetes ne fait rien de tel et le rendrait litteral -- le lien
#  journal -> trace pointerait alors sur une trace nommee « $ ». C'est
#  exactement le genre de detail qu'une copie de fichier emporte sans bruit.
# ============================================================================

apiVersion: 1

# ⚠️ RETIRER UNE ENTREE DE `datasources:` NE SUPPRIME RIEN DANS GRAFANA.
#
# Le provisionnement par fichier est ADDITIF : Grafana insere ou met a jour ce
# qu'il lit, et laisse en base ce qui n'y figure plus. Mesure le 2026-09-02 --
# apres avoir retire « Prometheus (mesh Istio) » de ce fichier et redeploye,
# `GET /api/datasources` la rendait toujours, pointant sur un ExternalName vers
# le meme serveur que la source « Prometheus ». Le doublon avait disparu du
# depot et survivait dans le produit.
#
# `deleteDatasources` est le seul mecanisme de suppression. Il s'applique AVANT
# les insertions, il est idempotent, et il doit RESTER ici : l'enlever une fois
# le menage fait rendrait la suppression non rejouable sur une instance
# restauree depuis une sauvegarde anterieure.
deleteDatasources:
  - name: Prometheus (mesh Istio)
    orgId: 1

datasources:
  # --- Metriques : metier ET maillage, un seul serveur ----------------------
  # `prometheus.urbanconnect.svc.cluster.local` est un Service d'ALIAS
  # (infra: kube/urbanlink/observability/prometheus-alias.yaml) vers le
  # Prometheus du kube-prometheus-stack. Le nom est garde pour ne pas avoir a
  # reecrire cette URL a chaque changement de nom de release.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.urbanconnect.svc.cluster.local:9090
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo.urbanconnect.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki.urbanconnect.svc.cluster.local:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '${__value.raw}'
          datasourceUid: tempo

  # --- Metier : les STOCKS, que Prometheus ne sait pas porter ---------------
  #
  # Prometheus compte des EVENEMENTS : il sait combien d'inscriptions cette
  # heure-ci, pas combien d'inscrits en tout. « La courbe d'inscriptions depuis
  # l'ouverture », « l'entonnoir », « les annonces par statut » sont des etats
  # cumules que la base porte deja -- les porter en serie temporelle
  # demanderait une jauge remise a jour par un balayage, c'est-a-dire une
  # SECONDE source de verite sur un chiffre existant. La regle du depot
  # l'interdit.
  #
  # ⚠️ BRANCHEE SUR `postgres:5432`, PAS SUR PGBOUNCER. Le pooler tient sa
  # propre liste d'utilisateurs, qu'il faudrait modifier en parallele, pour un
  # gain nul : la charge de Grafana est derisoire. Le Service est *headless*
  # (`clusterIP: None`), ce qui n'empeche pas la resolution.
  #
  # ⚠️ QUE DES AGREGATS DANS LES PANNEAUX. Pas un e-mail, pas un nom, pas un
  # identifiant. Grafana est derriere une authentification basique partagee
  # entre consoles internes ; y deverser une table `users` en ferait un second
  # exposant de donnees personnelles, hors du perimetre tenu par
  # l'application. Cette regle se verifie a la relecture de chaque SELECT.
  #
  # ⚠️ `$GRAFANA_PG_PASSWORD` est une variable d'ENVIRONNEMENT du pod Grafana,
  # posee par les valeurs Helm depuis secrets.env. Aucun mot de passe en clair
  # dans ce depot.
  #
  # Le role `grafana_ro` ne peut RIEN ecrire : GRANT SELECT seul, plus
  # `default_transaction_read_only = on` par-dessus -- et le role Ansible qui
  # le pose ESSAIE d'ecrire pour verifier que ca echoue, plutot que de le
  # supposer.
  - name: Postgres (metier)
    type: postgres
    uid: postgres-metier
    access: proxy
    url: postgres.urbanconnect.svc.cluster.local:5432
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
    jsonData:
      database: urbanconnect
      sslmode: disable          # trafic interne au cluster, chiffre par le maillage
      postgresVersion: 1600
      timescaledb: false
      # Un panneau mal ecrit ne doit pas pouvoir assecher les connexions du
      # produit.
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
