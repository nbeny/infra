apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-nominatim
  namespace: urbanconnect
  labels:
    app: postgres-nominatim
spec:
  serviceName: postgres-nominatim
  replicas: 1
  selector:
    matchLabels:
      app: postgres-nominatim
  template:
    metadata:
      labels:
        app: postgres-nominatim
    spec:
      containers:
        - name: postgres-nominatim
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: nominatim
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: NOMINATIM_DB_PASSWORD
            - name: POSTGRES_DB
              value: nominatim
          volumeMounts:
            - name: postgres-nominatim-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U nominatim"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U nominatim"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-nominatim-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi  # Nominatim Europe ~60-80 Go
