# Configuration Ory Oathkeeper — Identity & Access Proxy en mode DECISION API.
# Traefik (Middleware forwardAuth) interroge /decisions ; Oathkeeper valide la
# session Kratos, applique la policy (access-rules.yaml) et injecte des headers
# d'identité vers l'upstream. Oathkeeper n'est JAMAIS dans le chemin du trafic
# réel — seul le sous-appel d'auth le traverse.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oathkeeper-config
  namespace: urbanconnect
  labels:
    app: oathkeeper
data:
  oathkeeper.yaml: |
    log:
      level: info
      format: json

    serve:
      api:
        port: 4456        # Decision API + /health (appelé par Traefik)
      proxy:
        port: 4455        # inutilisé en mode decision (on ne proxifie pas)

    access_rules:
      matching_strategy: regexp
      repositories:
        - file:///etc/oathkeeper/access-rules.yaml

    errors:
      fallback:
        - json
      handlers:
        json:
          enabled: true
        redirect:
          enabled: true
          config:
            to: https://urbanlink.fr/login
            when:
              # Des NOMS d'erreur, pas des codes HTTP. Avec [401, 403] le
              # schema echouait ("expected string, but got number") et le
              # oneOf basculait sur la branche qui exige enabled: false --
              # d'ou deux erreurs pour une seule cause.
              - error: ["unauthorized", "forbidden"]
                request:
                  header:
                    accept:
                      - text/html

    authenticators:
      # Session par cookie navigateur (ory_kratos_session) validée via Kratos whoami
      cookie_session:
        enabled: true
        config:
          check_session_url: http://kratos.urbanconnect.svc.cluster.local:4433/sessions/whoami
          preserve_path: true
          preserve_query: true
          only:
            - ory_kratos_session
      # Session par token (apps mobiles / API) dans X-Session-Token
      bearer_token:
        enabled: true
        config:
          check_session_url: http://kratos.urbanconnect.svc.cluster.local:4433/sessions/whoami
          token_from:
            header: X-Session-Token
      # Autorise le passage sans session (subject=guest) — l'authZ fine reste au backend
      anonymous:
        enabled: true
        config:
          subject: guest
      noop:
        enabled: true

    authorizers:
      allow:
        enabled: true
      deny:
        enabled: true

    mutators:
      # Injecte l'identité en clair vers l'upstream (pas de gestion de clés).
      header:
        enabled: true
        config:
          headers:
            X-User-Id: "{{ print .Subject }}"
            X-User-Email: "{{ print .Extra.identity.traits.email }}"
      noop:
        enabled: true
      # UPGRADE (JWT à l'edge) : activer id_token pour minter un JWT signé (RS256)
      # que le backend vérifie via jwks_url. ⚠️ Nécessite un JWKS (secret monté) et
      # de basculer le backend de HS256 (JWT_SECRET partagé) vers une vérif RS256.
      # id_token:
      #   enabled: true
      #   config:
      #     issuer_url: https://oathkeeper.urbanlink.fr/
      #     jwks_url: file:///etc/oathkeeper/jwks/jwks.json
      #     claims: '{"sub":"{{ print .Subject }}","email":"{{ print .Extra.identity.traits.email }}"}'

  access-rules.yaml: |
    # L'URL matchée est celle qu'Oathkeeper RECONSTRUIT depuis les en-têtes que
    # le filtre ext_authz d'Envoy lui recopie (`includeRequestHeadersInCheck`,
    # cf. istiod-values.yaml.j2) : X-Forwarded-Proto pour le schéma,
    # X-Forwarded-Host pour l'hôte, et le chemin restant après `/decisions`.
    #
    # Oathkeeper ne voit QUE le trafic de `api.urbanlink.fr` : c'est
    # l'AuthorizationPolicy `uc-edge-auth` (ingress/authorization.yaml) qui
    # choisit les requêtes envoyées ici. La sélection d'hôte est faite là-bas,
    # pas dans les règles ci-dessous.
    #
    # ⚠️ **LE SCHÉMA N'EST PAS `https` À CE POINT DE LA CHAÎNE.** Le TLS est
    # terminé par le nginx du nœud Proxmox, qui relaie EN CLAIR vers le
    # NodePort 30080 de la passerelle (voir l'en-tête de ingress/gateway.yaml).
    # Envoy tourne donc sur un listener HTTP avec `use_remote_address`, et il
    # **réécrit** X-Forwarded-Proto en `http` — écrasant le `https` que nginx
    # avait posé. Une règle ancrée sur `https://` ne correspond à RIEN, et
    # Oathkeeper répond alors 404 « The requested resource could not be
    # found » — au format d'erreur Ory, sur TOUTES les méthodes et TOUS les
    # chemins. C'est ce qui rendait `api.urbanlink.fr` entièrement mort :
    # `wss://api.urbanlink.fr/graphql` (abonnements GraphQL : messagerie temps
    # réel, notifications, appels) et les envois de fichiers du navigateur, qui
    # visent `NEXT_PUBLIC_API_URL` en direct. Le site restait debout parce que
    # ses requêtes GraphQL ordinaires passent par le relais same-origin
    # `/api/graphql` du frontend, qui joint `backend:4000` sans sortir du
    # cluster — donc sans traverser cette règle.
    #
    # ⇒ Le schéma est un groupe, pas un littéral. `failOpen: false` fait qu'une
    # panne d'Oathkeeper refuse (403) ; ce 404-ci, lui, ne ressemblait pas à
    # une panne.

    # API GraphQL/REST : pass-through. Si connecté → session validée + headers
    # d'identité injectés. Sinon → guest (le backend gère l'authZ via ses guards).
    - id: "api:passthrough"
      match:
        url: "<http|https>://api.urbanlink.fr/<.*>"
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      authenticators:
        - handler: cookie_session
        - handler: bearer_token
        - handler: anonymous
      authorizer:
        handler: allow
      mutators:
        - handler: header

    # EXEMPLE d'endpoint réservé aux connectés (déblocage : retirer `anonymous`
    # → 401/403 + redirection login pour les navigateurs). Adapter le préfixe.
    # - id: "api:protected"
    #   match:
    #     url: "<http|https>://api.urbanlink.fr/admin<.*>"
    #     methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    #   authenticators:
    #     - handler: cookie_session
    #     - handler: bearer_token
    #   authorizer:
    #     handler: allow
    #   mutators:
    #     - handler: header
    #   errors:
    #     - handler: redirect
    #       config:
    #         to: https://urbanlink.fr/login
