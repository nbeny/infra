# Interne uniquement — accès via : kubectl port-forward svc/kafka-ui 8080:8080 -n urbanconnect
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: urbanconnect
  labels:
    app: kafka-ui
spec:
  type: ClusterIP
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
