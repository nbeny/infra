# ==============================================================
# TEMPLATE — Ne jamais commiter avec de vraies valeurs.
# Utiliser Sealed Secrets ou External Secrets Operator en prod.
# kubectl create secret generic urbanconnect-secrets \
#   --from-env-file=.env.prod -n urbanconnect
# ==============================================================
apiVersion: v1
kind: Secret
metadata:
  name: urbanconnect-secrets
  namespace: urbanconnect
type: Opaque
stringData:
  # PostgreSQL App
  POSTGRES_USER: "urbanconnect"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "urbanconnect"
  DATABASE_URL: "postgresql://urbanconnect:CHANGE_ME@pgbouncer:6432/urbanconnect"

  # PostgreSQL Kratos
  KRATOS_DB_USER: "kratos"
  KRATOS_DB_PASSWORD: "CHANGE_ME"
  KRATOS_DB_NAME: "kratos"
  KRATOS_SECRET: "CHANGE_ME_32_CHARS_MIN_PLEASE!!"
  KRATOS_DSN: "postgresql://kratos:CHANGE_ME@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4"

  # PostgreSQL Directus
  DIRECTUS_DB_USER: "directus"
  DIRECTUS_DB_PASSWORD: "CHANGE_ME"
  DIRECTUS_DB_NAME: "directus"
  DIRECTUS_ADMIN_EMAIL: "admin@urbanconnect.fr"
  DIRECTUS_ADMIN_PASSWORD: "CHANGE_ME"
  DIRECTUS_SECRET: "CHANGE_ME_32_CHARS_MIN_PLEASE!!"

  # PostgreSQL Nominatim
  NOMINATIM_DB_PASSWORD: "CHANGE_ME"

  # PostgreSQL Temporal (auto-setup crée temporal + temporal_visibility)
  TEMPORAL_DB_USER: "temporal"
  TEMPORAL_DB_PASSWORD: "CHANGE_ME"

  # PgAdmin
  PGADMIN_EMAIL: "admin@urbanconnect.fr"
  PGADMIN_PASSWORD: "CHANGE_ME"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"

  # Elasticsearch (recherche + feeds) — `elastic` = superuser, `kibana_system` = compte interne Kibana
  ELASTICSEARCH_PASSWORD: "CHANGE_ME"
  KIBANA_SYSTEM_PASSWORD: "CHANGE_ME"

  # MinIO
  MINIO_ROOT_USER: "uc-minio-admin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  MINIO_BUCKET_NAME: "urbanconnect-images"

  # JWT
  JWT_SECRET: "CHANGE_ME_LONG_RANDOM_STRING"
  JWT_EXPIRATION: "7d"

  # Observabilité — jeton exigé par GET /metrics (Authorization: Bearer …).
  # En production, un jeton absent FERME l'endpoint (403) : la collecte casse
  # bruyamment plutôt que d'exposer silencieusement la forme interne de l'app.
  METRICS_TOKEN: "CHANGE_ME_LONG_RANDOM_STRING"

  # Stripe
  # Clé secrète Stripe. Le préfixe réel est volontairement absent du gabarit :
  # le scan de secrets de la CI y verrait une clé commitée.
  STRIPE_SECRET_KEY: "CHANGE_ME_STRIPE_SECRET_KEY"
  STRIPE_PUBLISHABLE_KEY: "pk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  STRIPE_CONNECT_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # Google OAuth
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"

  # Kratos webhook (requis au boot du backend)
  KRATOS_WEBHOOK_SECRET: "CHANGE_ME"

  # Klipy (GIFs messagerie) — laisser vide pour le mode mock
  KLIPY_API_KEY: ""

  # WebRTC / coturn (appels)
  TURN_SECRET: "CHANGE_ME"
  # URLs STUN/TURN publiques annoncées au navigateur (IP/FQDN public du nœud coturn)
  TURN_URLS: "stun:turn.urbanconnect.fr:3478,turn:turn.urbanconnect.fr:3478?transport=udp,turn:turn.urbanconnect.fr:3478?transport=tcp"

  # SMTP (Infomaniak)
  SMTP_CONNECTION_URI: "smtps://user:password@mail.infomaniak.com:465"
  SMTP_FROM_ADDRESS: "noreply@urbanconnect.fr"
  SMTP_FROM_NAME: "UrbanConnect"

  # SMS
  SMSAPI_TOKEN: "CHANGE_ME"
  SMSAPI_SENDER: "UrbanLink"

  # Sendcloud
  SENDCLOUD_PUBLIC_KEY: "CHANGE_ME"
  SENDCLOUD_SECRET_KEY: "CHANGE_ME"

  # MaxMind GeoIP
  MAXMIND_ACCOUNT_ID: "CHANGE_ME"
  MAXMIND_LICENSE_KEY: "CHANGE_ME"

  # Frontend (build args — public)
  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: "pk_live_CHANGE_ME"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "CHANGE_ME"
