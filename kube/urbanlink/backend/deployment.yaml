apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: urbanconnect
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: urbanconnect-backend:prod
          # En prod, remplacer par le registry : registry.urbanconnect.fr/backend:TAG
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: DATABASE_URL
            # MinIO / S3
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_BUCKET_NAME
            - name: S3_REGION
              value: eu-west-3
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            # MinIO legacy
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MINIO_ROOT_PASSWORD
            # ⚠️ **L'adresse que le NAVIGATEUR devra joindre, pas celle du pod.**
            # `StorageService.getFileUrl()` compose
            # `${MINIO_PUBLIC_URL}/${bucket}/${chemin}`. Non renseignee, elle
            # vaut `http://localhost:9000` — l'URL rendue a l'utilisateur
            # designe alors SA propre machine.
            #
            # La valeur pointe le proxy same-origin et non `s3.urbanlink.fr`,
            # parce que c'est le chemin que le produit a choisi : le
            # rewrite `/api/minio/:path*` de Next relaie vers MinIO, et
            # `getFileUrl` ajoutant deja `/<bucket>/`, on retombe exactement sur
            # l'URL que `front/src/utils/image.ts` fabrique de son cote. Une URL
            # `s3.` directe exigerait en plus une politique de bucket publique
            # et du CORS, pour aucun gain.
            - name: MINIO_PUBLIC_URL
              value: https://urbanlink.fr/api/minio
            # Kratos
            - name: KRATOS_PUBLIC_URL
              value: http://kratos:4433
            - name: KRATOS_ADMIN_URL
              value: http://kratos:4434
            # Redis
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: REDIS_URL
            # Nominatim
            - name: NOMINATIM_INTERNAL_URL
              value: http://nominatim:8080
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: JWT_EXPIRATION
            # Jeton exigé par GET /metrics. `optional` pour ne pas empêcher un
            # pod de démarrer sur un cluster où le secret n'a pas encore la
            # clé : dans ce cas /metrics répond 403 en production (fermé par
            # défaut), ce qui est le comportement voulu.
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: METRICS_TOKEN
                  optional: true
            # --- Traces et journaux OTLP ---------------------------------
            # ⚠️ SANS CETTE VARIABLE, RIEN NE PART. `tracing.ts` sort
            # immediatement si elle est absente ; le SDK ne demarre pas, aucune
            # instrumentation n'est posee, et c'est silencieux par conception
            # (on ne veut pas d'un backend qui retente un export vers un
            # collecteur absent en CI ou en dev).
            #
            # Elle manquait ici depuis le premier jour. Mesure le 2026-09-02 :
            # `tempo_distributor_spans_received_total` et
            # `loki_distributor_lines_received_total` n'existaient meme pas comme
            # series -- Tempo et Loki tournaient, etaient scrapes, sains, et
            # n'avaient jamais rien recu. Les tableaux de bord « Traces » et
            # « Journaux » etaient decoratifs.
            #
            # L'echantillonnage a 20 % et l'effacement des en-tetes
            # `authorization` / `cookie` / `set-cookie` sont deja configures dans
            # otel-collector-config.yaml : ils s'appliquent des le premier span.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.urbanconnect.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: urbanconnect-backend
            # CORS
            - name: CORS_ORIGIN
              value: "https://urbanlink.fr"
            - name: FRONTEND_URL
              value: "https://urbanlink.fr"
            # Stripe
            # ⚠️ **TEMPORAIRE — à retirer dès que l'image portant le nouveau
            # défaut (20000) est déployée.** Le code avait 1500, ce qui refusait
            # `searchArtefacts` (2 320, et 11 600 à limit=100) et
            # `userArtefacts` (5 200) : la recherche, la carte et la vitrine
            # vendeur rendaient « Erreur de chargement » en production.
            # Posée ici pour rétablir le service en deux minutes au lieu
            # d'attendre une construction d'image. Une fois l'image livrée,
            # cette ligne fait doublon avec le défaut du code — la retirer,
            # sinon deux endroits décideront de la même valeur.
            - name: GRAPHQL_MAX_COMPLEXITY
              value: "20000"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_SECRET_KEY
            # ⚠️ **Sans elle, Stripe Connect tourne en MOCK en production.**
            # `stripe-connect.service.ts` bascule en mode fictif dès que la clé
            # est vide — avec un simple `logger.warn`, jamais une erreur. Le KYC
            # vendeur produit alors des comptes `acct_mock_…`, et le balayage de
            # versement échoue sur « No such destination » sans que rien ne le
            # signale. Elle manquait ici depuis toujours : le mode test ne la
            # réclamait pas, le dev la lisant depuis `backTs/.env`.
            #
            # Même valeur que `STRIPE_SECRET_KEY` : un seul compte Stripe, avec
            # Connect activé dessus (vérifié en live le 2026-09-06).
            - name: STRIPE_CONNECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_SECRET_KEY
            # Instant à partir duquel la plateforme ENTIERCE les fonds au lieu
            # de les router vers le vendeur à la capture. Une vente antérieure
            # se rembourse par `reverse_transfer`, une postérieure par
            # `transfers.createReversal` : le mauvais geste échoue en silence.
            #
            # Date volontairement ANTÉRIEURE à toute vente live : il n'existe
            # aucun paiement en mode live avant la bascule, donc aucune vente
            # ne peut légitimement relever du régime pré-entiercement. Trop
            # tard aurait produit des fonds orphelins que rien ne signale ;
            # trop tôt, ici, ne peut rien produire du tout.
            - name: ESCROW_EPOCH
              value: "2026-09-06T00:00:00.000Z"
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_CONNECT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: STRIPE_CONNECT_WEBHOOK_SECRET
            # Identifiants de prix des trois plans payants (mode LIVE).
            #
            # En clair et non dans le Secret : un price ID n'est pas un secret —
            # il part chez le navigateur dans l'URL du Checkout hébergé. C'est de
            # la configuration propre à l'environnement, au même titre que
            # FRONTEND_URL et CORS_ORIGIN ci-dessus. Le poser ici le fait
            # réconcilier par Argo CD ; dans le Secret il exigerait de rejouer le
            # playbook Ansible 31 à chaque changement de tarif.
            #
            # ⚠️ Absents, ces trois-là ne cassent RIEN de visible : `listPlans()`
            # ne lit un montant que si `this.stripe && priceId`, donc le prix sort
            # à `null` et l'écran affiche « Tarif indisponible » sans une ligne de
            # journal. Pire, `syncFromStripe` mappe `priceId → plan` par cette même
            # table : sans elle, un abonnement réellement payé n'est rattaché à
            # aucun plan. Constaté en production le 2026-08-31.
            - name: STRIPE_PRICE_STARTER_ID
              value: "price_1UChBkKqEapb7zc8Ai3KMKl7"
            - name: STRIPE_PRICE_PREMIUM_ID
              value: "price_1UChBkKqEapb7zc8iaNahW4f"
            - name: STRIPE_PRICE_ENTERPRISE_ID
              value: "price_1UChBlKqEapb7zc8lzHXgrXb"
            # SMS
            - name: SMSAPI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_TOKEN
            - name: SMSAPI_SENDER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SMSAPI_SENDER
            # Sendcloud
            - name: SENDCLOUD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_PUBLIC_KEY
            - name: SENDCLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_SECRET_KEY
            # ⚠️ **Sans ce secret, TOUT le backend refuse de demarrer.**
            # `SendcloudService.onModuleInit` s'arrete net en production :
            # « SENDCLOUD_WEBHOOK_SECRET is required in production. Refusing to
            # start. » Il ne manquait pas seulement ici — il n'existait NULLE
            # PART : ni dans le Deployment, ni dans secrets.env.example, ni dans
            # le secrets.env du cluster. Le backend etait donc structurellement
            # incapable de demarrer sur ce manifeste, ce qu'on ne decouvrait
            # qu'apres avoir leve tous les autres obstacles.
            #
            # ⚠️ La severite du garde-fou est VOULUE, pas un exces : sans
            # signature, n'importe qui peut pousser un faux
            # `parcel_status_changed` « livre », ce qui bascule la commande en
            # DELIVERED **et ouvre le droit de retractation de 14 jours** sur un
            # colis jamais expedie. Un webhook non signe est une porte ouverte
            # sur l'argent.
            #
            # C'est un secret PARTAGE avec Sendcloud : sa valeur n'a pas
            # d'importance tant que les deux cotes portent la meme. Tant que le
            # compte Sendcloud n'est pas cable (module en mode simule), une
            # valeur aleatoire est la bonne reponse — d'ou `[auto]` dans
            # secrets.env.example. Le jour du cablage, reprendre celle que
            # Sendcloud affiche.
            - name: SENDCLOUD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: SENDCLOUD_WEBHOOK_SECRET
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: GOOGLE_CLIENT_SECRET
            # Elasticsearch (searchListings + 3 feeds + autocomplete + facettes ;
            # fallback Postgres auto si indispo — kill-switch SEARCH_ENGINE=postgres)
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: ELASTICSEARCH_PASSWORD
            - name: SEARCH_ENGINE
              value: elasticsearch
            # Kafka (événementiel / fanout / logs métier)
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: urbanconnect-backend
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
            # Temporal (workflows durables / timers / sagas)
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: urbanconnect
            # Backend des jobs planifiés (temporal | bullmq) — le worker dédié
            # (deployment temporal-worker) doit tourner avec la même valeur.
            - name: SCHEDULER_BACKEND
              value: temporal
            # ── Import de CV par agent ─────────────────────────────────
            #
            # ⚠️ **REQUISE, sinon le backend ne DÉMARRE PAS.** `cv-import.module`
            # refuse de se construire sans elle : « CV_AGENT_PROVIDER doit être
            # définie ». Absente lors de la livraison du module le 2026-09-14,
            # elle a mis backend et temporal-worker en CrashLoopBackOff — le
            # site n'est resté debout que parce que le déploiement roulant a
            # gardé les pods précédents.
            #
            # ⚠️ **`opencode` et NON `fake`**, et ce n'est pas un détail : le
            # module documente que retomber sur `fake` ferait tourner de
            # l'extraction factice en production, « remplissant les profils de
            # rien, sans qu'aucune alerte ne se déclenche ». `opencode` valide
            # sa configuration à l'USAGE (`readConfig` dans `extract`), pas au
            # démarrage : tant que `CV_AGENT_COMMAND` et `AI_WORKSPACE_DIR` ne
            # sont pas provisionnés, un import échoue clairement au lieu de
            # fabriquer du faux.
            - name: CV_AGENT_PROVIDER
              value: opencode
            # Couche async des routes migrées (kafka | bullmq)
            - name: ASYNC_BACKEND
              value: kafka
            # Kratos webhook (secret requis au boot même si le hook est off)
            - name: KRATOS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KRATOS_WEBHOOK_SECRET
            # Klipy (GIFs messagerie) — vide = mode mock
            - name: KLIPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: KLIPY_API_KEY
            # ── Fournisseurs de dropshipping ─────────────────────────────
            # ⚠️ **Le NOM vit ici, la valeur dans `secrets.env`** (ignoré par
            # git) puis dans le Secret `urbanconnect-secrets` que l'amorçage
            # Ansible pose. Argo CD ne peut PAS créer ce Secret — il n'applique
            # que la sortie de `kustomize build`.
            #
            # ⚠️ **Declarees dans le backend ET dans le worker Temporal.** Le
            # connecteur travaille des deux cotes : l'API lit le stock, le
            # worker passe les commandes et balaie le catalogue. Dans un seul
            # des deux, un cote fonctionne et l'autre se croit non configure —
            # SANS erreur. C'est le piege vecu avec `STRIPE_SECRET_KEY`, qui
            # faisait tourner le worker en mode simule pendant que le backend
            # parlait au vrai Stripe.
            #
            # ⚠️ `optional: true` : vide = connecteur inactif, et c'est un etat
            # de marche legitime (aucun catalogue importe, aucune commande
            # envoyee). Sans ce drapeau, le pod refuserait de demarrer tant que
            # la cle n'est pas posee — un arret de service pour une integration
            # qu'on n'a pas encore branchee.
            - name: CJ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: CJ_API_KEY
                  optional: true
            - name: MATTERHORN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MATTERHORN_API_KEY
                  optional: true
            - name: VIDAXL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: VIDAXL_API_KEY
                  optional: true
            # Appels WebRTC (coturn) — credentials TURN éphémères délivrés par le backend
            - name: FEATURE_CALLS
              value: "true"
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: TURN_SECRET
            # URLs STUN/TURN publiques annoncées au navigateur (IP/FQDN public du
            # nœud coturn — cf. kube/coturn/daemonset.yaml).
            - name: TURN_URLS
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: TURN_URLS
            - name: TURN_TTL_SECONDS
              value: "3600"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          # Liveness : « le processus est-il vivant ? ». Reste sur /health, qui
          # ne touche AUCUNE dépendance externe — délibérément. Une liveness qui
          # dépendrait de Postgres ferait redémarrer tous les pods en boucle
          # pendant une panne de base, transformant une panne de dépendance en
          # panne totale.
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness : « peut-il servir du trafic ? ». Interroge réellement
          # Postgres, Redis et Kafka (Elasticsearch est signalé mais non
          # bloquant : la recherche a un fallback Postgres). Un échec retire le
          # pod du Service sans le tuer — il se remettra à recevoir du trafic
          # dès que la dépendance revient, sans redémarrage.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
