# ============================================================================
#  backend-migrate -- applique les migrations Prisma, UNE SEULE FOIS
# ----------------------------------------------------------------------------
#  ⚠️ POURQUOI CE JOB EXISTE : la commande de demarrage de l'image backend
#  lancait `npx prisma migrate deploy && node dist/main.js`, donc a CHAQUE
#  replica. Prisma serialise ces executions par un verrou consultatif Postgres,
#  ce qui est sur, mais le perdant attend -- et sa patience est bornee a 10 s.
#
#  Mesure sur le cluster urbanlink : deux replicas au demarrage, `Error: P1002 /
#  Timed out trying to acquire a postgres advisory lock`, en boucle, sans jamais
#  converger. Et pour RIEN : la base portait deja 95 migrations appliquees et
#  0 en attente, donc les deux pods se disputaient un verrou pour un travail
#  vide. Le Dockerfile du depot applicatif l'annoncait d'ailleurs : « a deplacer
#  vers un job d'initialisation dedie le jour ou les migrations deviennent
#  couteuses ». Ce jour est arrive -- pas parce qu'elles sont longues, mais
#  parce que le noeud est lent et que la course se perd.
#
#  ⚠️ RECTIFICATION DU 2026-09-01 : la concurrence entre replicas n'etait que
#  la moitie de l'histoire. Ce Job SEUL, sans le moindre concurrent, echouait
#  exactement pareil -- parce qu'il passait par PGBOUNCER, en pooling par
#  transaction, ou un verrou de session ne peut pas tenir. Voir le bloc `env`
#  plus bas. Regrouper les migrations dans un Job unique restait juste ; ce
#  n'etait simplement pas suffisant.
#
#  ⚠️ CONSEQUENCE A CONNAITRE : les replicas ne migrent plus. Si ce Job n'est
#  pas applique, le backend demarre sur un schema perime SANS RIEN DIRE. Il
#  fait donc partie du kustomization, au meme titre que `kratos-migrate`.
#
#  ⚠️ Un Job est IMMUABLE une fois cree. Le rejouer apres un changement de tag
#  d'image suppose de le supprimer d'abord :
#      kubectl -n urbanconnect delete job backend-migrate
#      kubectl -n urbanconnect apply -f backend/migrate-job.yaml
#  `31-urbanlink-deploy.yml` le fait pour minio-init ; meme geste ici.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: urbanconnect
  labels:
    app: backend-migrate
  # ⚠️ Hook Argo, et non ressource ordinaire. La section `images:` du
  # kustomization epingle le tag du backend, qui figure AUSSI ici : la spec de
  # ce Job change donc a chaque livraison. Or les champs d'un Job sont
  # immuables -- `kubectl apply` echoue en « field is immutable » des que le
  # Job existe, et `Replace=false` / `ApplyOutOfSyncOnly=true` n'y changent
  # rien : le Job est hors-sync, donc applique, donc en echec.
  # `BeforeHookCreation` le supprime puis le recree, ce que
  # 31-urbanlink-deploy.yml faisait a la main avant Argo.
  #
  # `PreSync` et non `Sync` : la migration doit s'achever AVANT que les
  # nouveaux pods du backend ne demarrent. Cet ordre n'etait garanti par rien
  # jusqu'ici.
  #
  # ⚠️ **Il peut se le permettre parce qu'il ne monte AUCUNE ConfigMap
  # generee** -- il ne lit que des variables du Secret. Ses deux jumeaux,
  # `kratos/migrate-job.yaml` et `kibana/setup-job.yaml`, en montent une : la
  # phase PreSync s'executant avant que la moindre ressource ne soit appliquee,
  # ils attendraient une ConfigMap hashee que la synchronisation n'a pas encore
  # le droit de creer. Ils sont donc en `Sync` (detail mesure sur place).
  #
  # ⇒ Avant d'ajouter un `volumeMounts` a CE Job, le repasser en `Sync` --
  #   sinon la synchronisation entiere se bloque, et le message d'erreur ne
  #   parle que d'un montage.
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: OnFailure
      # Migrer avant que Postgres ne soit joignable ne servirait qu'a
      # consommer les 5 tentatives du backoff.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Attente de postgres..."
                sleep 2
              done
      containers:
        - name: backend-migrate
          # ⚠️ MEME image que le Deployment, et c'est necessaire : le schema et
          # les migrations viennent de `prisma/`, qui n'existe que dedans.
          # `kustomize edit set image urbanconnect-backend=…` reecrit les deux
          # references d'un coup — le Job ne peut donc pas deriver du Deployment.
          image: urbanconnect-backend:prod
          command: ["sh", "-c", "npx prisma migrate deploy"]
          # ⚠️ CE JOB NE PASSE PAS PAR PGBOUNCER, et c'est la condition pour
          # qu'il fonctionne du tout.
          #
          # `prisma migrate deploy` serialise les migrations avec un verrou
          # consultatif de SESSION (`pg_advisory_lock(72707369)`). PgBouncer
          # tourne en `POOL_MODE=transaction` : la session cliente n'est liee a
          # aucune connexion serveur durable, le verrou est pris sur l'une et
          # la requete suivante repart sur une autre. Prisma attend alors un
          # verrou qu'il detient lui-meme ailleurs, et rend au bout de 10 s :
          #
          #   Error: P1002 -- Timed out trying to acquire a postgres advisory
          #   lock (SELECT pg_advisory_lock(72707369)). Timeout: 10000ms
          #
          # Pire, l'echec ne se nettoie pas : la connexion serveur qui detenait
          # le verrou retourne dans le pool de PgBouncer et le garde. Mesure le
          # 2026-09-01 sur la base de production : SEIZE backends sur
          # l'objid 72707369, dont un `idle` depuis 21 minutes -- le zombie qui
          # bloquait les quinze autres. Chaque nouvelle tentative allongeait la
          # file au lieu d'aboutir, et la synchronisation Argo entiere restait
          # bloquee sur ce hook PreSync.
          #
          # L'URL est donc reconstruite ici vers `postgres:5432` en direct. Les
          # trois composantes viennent du meme Secret que DATABASE_URL ; seul
          # l'hote change. Les mots de passe generes par
          # scripts/secrets/bootstrap.sh sont alphanumeriques (`rand`), il n'y a
          # donc rien a echapper dans l'URL.
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_DB
            # `$(VAR)` est developpe par kubelet a partir des variables
            # DECLAREES AVANT dans cette meme liste -- d'ou l'ordre.
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
