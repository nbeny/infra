# ============================================================================
#  backend-badges -- pose les badges de reference, RIEN D'AUTRE. Idempotent.
# ----------------------------------------------------------------------------
#  Contexte : la production doit rester une PLATEFORME VIDE (schema + donnees
#  de reference seulement -- pas d'utilisateurs, d'annonces, de messages ou de
#  conversations de demonstration). `backend/seed-job.yaml` pose tout ca et ne
#  doit jamais tourner ici (voir son en-tete, renomme
#  `seed-job.yaml.DANGER-demo-data`). Mais les BADGES ne sont pas une donnee de
#  demo : ce sont des definitions de catalogue (nom, icone, seuil, points) que
#  `checkAndAwardBadges()` interroge des la premiere action d'un vrai
#  utilisateur. Sans elles, un compte reel qui publie sa premiere annonce ne
#  recoit jamais aucun badge -- silencieusement, rien ne le signale.
#
#  ⚠️ VERIFIE avant d'ecrire ce fichier, pas suppose : `prisma/seeds/badges.seed.ts`
#  et `prisma/seeds/artefacts-badges.seed.ts` n'ecrivent QUE dans la table
#  `Badge`, exclusivement par
#      prisma.badge.upsert({ where: { name }, update: badge, create: badge })
#  Aucune ligne `users`, `artefacts`, `posts` ou `conversations` n'est touchee.
#  Rejouable a volonte : un badge deja present est mis a jour a l'identique, un
#  badge absent est cree. C'est le seul fragment de `db:seed:all` qui a sa
#  place en production.
#
#  ⚠️ IMAGE : `urbanconnect-seed:prod`, PAS `urbanconnect-backend:prod` --
#  contrairement a ce que la ressemblance avec `migrate-job.yaml` suggere.
#  Deux manques structurels de l'image backend de production (voir l'en-tete de
#  `Dockerfile.seed`, depot applicatif) rendent la commande irrealisable dessus :
#    1. `ts-node` est une devDependency, retiree par le `npm ci --omit=dev` de
#       cette image -- `npx ts-node prisma/seeds/badges.seed.ts` echouerait a
#       l'introuvable.
#    2. Meme avec `ts-node` present, `badges.seed.ts` appelle en cascade
#       `seedArtefactsBadges()` (import dynamique de `artefacts-badges.seed.ts`),
#       qui importe `../../../front/src/data/categoriesStructure` -- `front/src`
#       n'existe PAS dans l'image backend (contexte de build = `backTs/` seul).
#  L'image `urbanconnect-seed:prod` a ete construite precisement pour lever ces
#  deux manques (contexte RACINE, `npm ci` complet, `COPY front/src`) -- c'est
#  elle qu'il faut, meme si ce Job ne seed que les badges.
#
#  ⚠️ ORDRE : ce Job doit suivre `backend-migrate` -- les badges vont dans une
#  table qui doit deja exister avec le bon schema. Meme phase `PreSync` que
#  `backend-migrate` (aucune ConfigMap generee montee ici non plus -- autorise
#  par `scripts/ci/check-argo-hooks.py` du depot applicatif), mais
#  `hook-weight: "1"` pour s'executer APRES lui (poids implicite 0). Argo
#  ordonne par poids croissant a l'interieur d'une meme phase.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-badges
  namespace: urbanconnect
  labels:
    app: backend-badges
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: backend-badges
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Attente de postgres..."
                sleep 2
              done
      containers:
        - name: backend-badges
          # Voir l'en-tete : image du SEED, pas celle du backend.
          image: urbanconnect-seed:prod
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx ts-node prisma/seeds/badges.seed.ts"]
          # ⚠️ MEME raisonnement que `backend-migrate` : passer par pgbouncer
          # exposerait l'adaptateur Prisma (`@prisma/adapter-pg` + `pg.Pool`) au
          # mode `POOL_MODE=transaction` de pgbouncer, ou une session cliente
          # n'est liee a aucune connexion serveur durable -- source connue de
          # "prepared statement does not exist" avec node-postgres. Ce Job est
          # court et borne : se brancher direct sur `postgres:5432` l'evite
          # sans le moindre cout.
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
