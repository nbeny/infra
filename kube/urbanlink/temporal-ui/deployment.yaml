apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: urbanconnect
  labels:
    app: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.31.2
          ports:
            - containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            # Interne uniquement (accès via port-forward) → CORS restreint au localhost
            # utilisé pour le tunnel `kubectl port-forward`.
            - name: TEMPORAL_CORS_ORIGINS
              value: http://localhost:8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
