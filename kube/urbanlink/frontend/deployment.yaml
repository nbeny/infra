apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: urbanconnect
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: urbanconnect-frontend:prod
          # En prod, remplacer par le registry : registry.urbanconnect.fr/frontend:TAG
          # L'image tourne en `nextjs` (uid 1001, `front/Dockerfile`) : on
          # l'impose ici. `runAsUser` numerique est OBLIGATOIRE avec
          # `runAsNonRoot` : l'image declare un NOM d'utilisateur.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # ⚠️⚠️ **CES QUATRE VARIABLES SONT INERTES ICI — elles se posent au
            # BUILD.** Le commentaire d'origine annoncait « runtime Next.js » ;
            # c'est faux, et ca a coute cher. `next build` resout
            # `next.config.js` et ecrit les destinations DEJA INTERPOLEES dans
            # `.next/routes-manifest.json` ; `next start` les sert telles
            # quelles, sans jamais relire l'environnement.
            #
            # Mesure dans le pod : `MINIO_PROXY_URL=http://minio:9000` etait
            # bien present, et le serveur proxifiait quand meme vers
            # `http://127.0.0.1:10006` — le defaut fige a la construction d'une
            # image batie sans ces arguments. Consequences en cluster :
            # `/api/kratos/` 500 (ni connexion ni inscription),
            # `/api/nominatim/` 500 (pas d'autocompletion d'adresse),
            # `/api/minio/` 500 (aucune image).
            #
            # ⇒ Les valeurs qui comptent sont les `--build-arg` de
            #   `front/Dockerfile` : voir `30-urbanlink-images.yml` et le job
            #   `images` de la CI du depot applicatif.
            #
            # On les GARDE malgre tout, pour deux raisons : elles documentent
            # sur place ce que l'image doit contenir, et elles redeviendront
            # vivantes le jour ou ces `rewrites` seront remplacees par des route
            # handlers (`app/api/<x>/[...path]/route.ts`), qui lisent
            # `process.env` a chaque requete. Les retirer ferait perdre les deux.
            - name: NOMINATIM_PROXY_URL
              value: http://nominatim:8080
            - name: KRATOS_PROXY_URL
              value: http://kratos:4433
            - name: BACKEND_PROXY_URL
              value: http://backend:4000
            - name: MINIO_PROXY_URL
              value: http://minio:9000
            # ----------------------------------------------------------------
            #  Celles-ci, EN REVANCHE, sont vivantes a l'execution
            # ----------------------------------------------------------------
            # Le jour annonce par le commentaire ci-dessus est arrive : une
            # partie des `rewrites` a ete remplacee par des route handlers
            # (`app/api/<x>/[...path]/route.ts`), qui relisent `process.env` a
            # chaque requete. Les quatre variables ci-dessus ne les concernent
            # pas -- elles portent les noms de l'epoque des rewrites, et AUCUN
            # de ces handlers ne les lit.
            #
            # Chaque handler a un repli code en dur, et c'est ce qui rend la
            # panne silencieuse : rien ne signale une variable absente, le
            # serveur appelle simplement une adresse de developpement.
            # Releve dans le bundle du pod (`.next/server`), toutes ces
            # variables valant `undefined` :
            #
            #   GRAPHQL_ENDPOINT        -> http://127.0.0.1:10012/graphql  (x5)
            #                              http://localhost:4000/graphql   (x1)
            #   NEXT_PUBLIC_GRAPHQL_URI -> http://localhost:4000           (x3)
            #   KRATOS_PUBLIC_URL       -> http://localhost:4433           (x1)
            #
            # `localhost`, dans un pod, c'est le pod lui-meme : rien n'y ecoute
            # sur ces ports. D'ou le `ECONNREFUSED` sur DEUX adresses (::1 puis
            # 127.0.0.1) visible dans les journaux du frontend, et le
            # « Response not successful: Received status code 500 » cote
            # navigateur. Mesure du 31/08/2026 : /api/graphql avait servi 226
            # reponses 500 et pas une seule 200 dans la journee.
            - name: GRAPHQL_ENDPOINT
              value: http://backend:4000/graphql
            # Le handler en fait `?.replace("/graphql", "")` pour construire
            # `<base>/upload/avatar`, `<base>/upload/cover-photo` et
            # `<base>/stripe-connect/upload-document`. La valeur doit donc etre
            # l'URI GraphQL COMPLETE, pas la base -- sans le suffixe, le
            # `replace` ne retire rien et les trois envois de fichier tapent sur
            # `http://backend:4000/graphql/upload/...`.
            #
            # Le prefixe NEXT_PUBLIC_ ne l'expose pas au navigateur ici : ces
            # trois lectures sont faites par le SERVEUR. Le bundle client, lui,
            # a fige sa propre valeur au build et ignore celle-ci.
            - name: NEXT_PUBLIC_GRAPHQL_URI
              value: http://backend:4000/graphql
            # Meme cible que KRATOS_PROXY_URL ci-dessus, sous le nom que lit
            # reellement le handler `/api/kratos/[...path]`. Le mot PUBLIC du
            # nom est trompeur : c'est le serveur qui appelle, pas le
            # navigateur. Le navigateur, lui, passe par auth.urbanlink.fr.
            - name: KRATOS_PUBLIC_URL
              value: http://kratos:4433
            # Meme cible que NOMINATIM_PROXY_URL plus haut, sous le nom que
            # lisent reellement les handlers -- et c'est la 4e occurrence du
            # meme piege que GRAPHQL_ENDPOINT ci-dessus.
            #
            # `/api/geocode/route.ts` fait
            # `process.env.NOMINATIM_INTERNAL_URL ?? 'http://127.0.0.1:8081'`.
            # La variable etant absente ici, il appelait ce defaut de
            # developpement : dans un pod, `127.0.0.1:8081` n'est personne. Le
            # geocodage serveur (onglet Identite du profil) echouait donc en
            # ECONNREFUSED, sans que rien ne le signale -- le repli code en dur
            # transforme une variable oubliee en panne muette.
            #
            # C'est aussi le nom que prefere `/api/address/autocomplete`
            # (autocompletion BAN puis Nominatim). Ce handler-la sait retomber
            # sur NOMINATIM_PROXY_URL, donc il fonctionnait deja ; celui de
            # `/api/geocode`, non.
            - name: NOMINATIM_INTERNAL_URL
              value: http://nominatim:8080
            # Images redimensionnees : la route /api/img (handler, donc relu a
            # chaque requete) signe la demande et la passe a imgproxy. Aucune
            # des trois n'a de repli : absente, la route repond 500 en la
            # nommant. Cle et sel = les memes entrees que le Deployment imgproxy.
            - name: IMGPROXY_URL
              value: http://imgproxy:8080
            - name: IMGPROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: IMGPROXY_KEY
            - name: IMGPROXY_SALT
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: IMGPROXY_SALT
            # MaxMind GeoIP
            - name: GEOIP_DB_PATH
              value: /usr/share/GeoIP/GeoLite2-Country.mmdb
            - name: MAXMIND_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MAXMIND_ACCOUNT_ID
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MAXMIND_LICENSE_KEY
          volumeMounts:
            - name: geoip-data
              mountPath: /usr/share/GeoIP
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: geoip-data
          persistentVolumeClaim:
            claimName: geoip-data
