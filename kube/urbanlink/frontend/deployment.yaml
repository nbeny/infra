apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: urbanconnect
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: urbanconnect-frontend:prod
          # En prod, remplacer par le registry : registry.urbanconnect.fr/frontend:TAG
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # Proxy rewrites → services Docker internes (runtime Next.js)
            - name: NOMINATIM_PROXY_URL
              value: http://nominatim:8080
            - name: KRATOS_PROXY_URL
              value: http://kratos:4433
            - name: BACKEND_PROXY_URL
              value: http://backend:4000
            # MaxMind GeoIP
            - name: GEOIP_DB_PATH
              value: /usr/share/GeoIP/GeoLite2-Country.mmdb
            - name: MAXMIND_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MAXMIND_ACCOUNT_ID
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: MAXMIND_LICENSE_KEY
          volumeMounts:
            - name: geoip-data
              mountPath: /usr/share/GeoIP
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: geoip-data
          persistentVolumeClaim:
            claimName: geoip-data
