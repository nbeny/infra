# coturn — STUN/TURN pour les appels WebRTC.
# hostNetwork : TURN a besoin de l'IP publique du nœud + d'une plage de ports UDP
# relay joignable de l'extérieur. Un Service ClusterIP/LoadBalancer ne convient pas
# (relay UDP dynamique). Le backend délivre des credentials TURN éphémères
# (use-auth-secret) ; les clients atteignent turn:<IP_PUBLIQUE_NŒUD>:3478.
#
# ⚠️ À adapter avant prod :
#   - nodeSelector ci-dessous : cibler le(s) nœud(s) ayant une IP publique routable.
#   - Ouvrir 3478/tcp+udp et 49160-49200/udp sur le firewall / security group.
#   - --no-tls/--no-dtls repris du dev : pour la prod, ajouter un cert (turns:5349).
#   - TURN_URLS du backend doit pointer vers l'IP/FQDN public (voir backend/deployment.yaml).
#
# ⚠️ **Plages privées INTERDITES comme pair** (`--denied-peer-ip`, audit
# 2026-10-09). En `hostNetwork`, le relais part DEPUIS le nœud : tout membre
# connecté reçoit des identifiants TURN (`calls.service.ts`) et pouvait s'en
# servir pour joindre les ClusterIP (Kratos admin :4434, Kafka en clair), les
# pods, et le LAN 192.168.x — derrière le `allow/deny` qui y réserve les
# consoles. `--no-tcp-relay` : les navigateurs n'allouent que de l'UDP, le
# relais TCP (RFC 6062) ne servait qu'à ce détournement.
#
# Contrepartie à connaître : sans `--external-ip`, coturn annonce ses adresses
# de relais en 10.0.0.111 (IP privée du nœud), désormais refusée comme pair. Un
# appel où LES DEUX parties passent par le relais peut donc échouer. Le bon
# remède n'est pas de réautoriser 10.0.0.111 (kubelet, API server et NodePorts
# y écoutent) mais de poser `--external-ip=<IP publique>/10.0.0.111` : posé ci-
# dessous avec l'IP WAN de la maison (`82.65.87.60`, `mikrotik/README.md`).
# ⚠️ Cette IP n'est PAS garantie fixe (`docs/reconstruction.md`) : si elle change,
# la mettre à jour ici, sinon les candidats de relais annoncés sont faux.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coturn
  namespace: urbanconnect
  labels:
    app: coturn
spec:
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Décommenter et adapter pour n'exécuter coturn que sur les nœuds publics :
      # nodeSelector:
      #   urbanconnect.fr/turn: "true"
      containers:
        - name: coturn
          image: coturn/coturn:4.6-alpine
          command:
            - sh
            - -c
            - |
              exec turnserver \
                -n \
                --log-file=stdout \
                --listening-port=3478 \
                --min-port=49160 \
                --max-port=49200 \
                --fingerprint \
                --use-auth-secret \
                --static-auth-secret="$TURN_SECRET" \
                --realm=urbanconnect \
                --no-cli \
                --no-tls \
                --no-dtls \
                --no-tcp-relay \
                --no-multicast-peers \
                --external-ip=82.65.87.60/10.0.0.111 \
                --denied-peer-ip=0.0.0.0-0.255.255.255 \
                --denied-peer-ip=10.0.0.0-10.255.255.255 \
                --denied-peer-ip=100.64.0.0-100.127.255.255 \
                --denied-peer-ip=127.0.0.0-127.255.255.255 \
                --denied-peer-ip=169.254.0.0-169.254.255.255 \
                --denied-peer-ip=172.16.0.0-172.31.255.255 \
                --denied-peer-ip=192.168.0.0-192.168.255.255 \
                --denied-peer-ip=::1 \
                --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
                --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: urbanconnect-secrets
                  key: TURN_SECRET
          ports:
            - containerPort: 3478
              hostPort: 3478
              protocol: TCP
            - containerPort: 3478
              hostPort: 3478
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
